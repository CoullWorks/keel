function toggle(k,id){const i=sel[k].indexOf(id);i>=0?sel[k].splice(i,1):sel[k].push(id);}
function resetDeps(){sel.env=sel.db=sel.frontend=null;sel.service=[];sel.addon=[];sel.extra=[];}
function defaults(){
  const fw=sel.framework;
  const e=forFw(fw,"env").find(r=>isDefault(r,fw))||forFw(fw,"env")[0];if(e)sel.env=e.id;
  const d=forFw(fw,"db").find(r=>isDefault(r,fw));if(d)sel.db=d.id;
  ["service","addon","extra"].forEach(k=>{sel[k]=forFw(fw,k).filter(r=>isDefault(r,fw)).map(r=>r.id);});
  if(PROFILE&&PROFILE.framework===fw){
    const has=(k,id)=>forFw(fw,k).some(r=>r.id===id);
    if(PROFILE.env&&has("env",PROFILE.env))sel.env=PROFILE.env;
    if(PROFILE.database&&has("db",PROFILE.database))sel.db=PROFILE.database;
    if(PROFILE.frontend)sel.frontend=has("frontend",PROFILE.frontend)?PROFILE.frontend:sel.frontend;
    const v=(k,s)=>csv(s).filter(id=>has(k,id));
    const legacyWeb=v("service",PROFILE.services||"").find(id=>isWeb(byId(id)||{}))||null;
    const seededWeb=chosenWeb();
    if(PROFILE.services)sel.service=v("service",PROFILE.services).filter(id=>!isWeb(byId(id)||{}));
    const savedWeb=(PROFILE.webserver||"").trim();
    if(savedWeb==="none")setWeb(null);

    else setWeb(legacyWeb||seededWeb||null);
    if(PROFILE.addons)sel.addon=v("addon",PROFILE.addons);
    if(PROFILE.extras)sel.extra=v("extra",PROFILE.extras);
  }
}

// loadPluginOpts fetches the applicable plugins' wizard options for the chosen

// `keel new` would offer. It is what turns the studio build from "run plugins
// with defaults blind" into a real form the user can change. Refetched only when
// the framework changes; a plugin that fails to describe its options is skipped.
async function loadPluginOpts(){

// widgetSkeleton draws three placeholder widget tiles so the top row has real
// shape while /api/overview/facts is in flight — the dashboard never flashes empty.
function widgetSkeleton(){
  return ["Health","Uptime","Database"].map(l=>
    `<div class="ovw"><div class="ovw-body"><div class="ovw-l">${l}</div><div class="ovw-v muted" style="font-size:15px">…</div></div></div>`).join("");
}
// loadServices fetches the project env's services + each one's up/down state and
// draws the running-services dashboard as the top Overview section. Every failure
// mode (Docker not installed, env down, native/no-services) comes back as a clear
// message the backend supplies, so this never renders a blank.
async function loadServices(dir){
  let d={};try{d=await apiJSON("/api/services?dir="+encodeURIComponent(dir));}catch(e){d={message:String(e.message||e)};}
  const host=document.getElementById("ovservices");if(!host||!PROJ||PROJ.path!==dir)return;
  host.innerHTML=renderServices(d,dir);
}
// renderServices draws the dashboard card: an overall up/down headline, then a row
// per service (name, up/down dot, kind) with Start/Stop/Restart controls where the
// runtime supports them. A message-only result (down / not-installed / native) is
// rendered as a calm inline note, never a blank card.
function renderServices(d,dir){
  d=d||{};
  const svcs=d.services||[];
  const dj=jarg(dir);
  // The overall-state headline: a coloured dot + a word, reusing the .conn style
  // the header connectivity dot uses so the two read the same.
  let head;
  if(svcs.length){
    head=d.up?`<span class="conn up"><span class="d"></span>environment running</span>`
             :`<span class="conn down"><span class="d"></span>environment stopped</span>`;
  }else{
    head=`<span class="conn"><span class="d"></span>${esc(d.family||"env")}</span>`;
  }
  // A whole-env Start/Stop lives beside the headline for every runtime, so even a
  // ddev/native project (no per-service control) can be brought up from here. It
  // reuses the same /api/project/action the header Start/Stop uses.
  const canEnv=PROJ&&PROJ.env&&PROJ.env!=="local"&&!isRootLaunch();
  const envActs=canEnv?`<button class="btn sm" onclick='projAction(${dj},"start")' title="Bring the whole environment up">▶ Start all</button>
      <button class="btn sm" onclick='projAction(${dj},"stop")' title="Tear the whole environment down">■ Stop all</button>`:"";
  let rows;
  if(svcs.length){
    rows=`<div class="svcs">`+svcs.map(s=>{
      const dot=s.running?`<span class="conn up"><span class="d"></span></span>`:`<span class="conn down"><span class="d"></span></span>`;
      const state=s.running?`<span class="svc-state up">up</span>`:`<span class="svc-state down">down</span>`;
      const kind=s.kind?`<span class="muted" style="font-size:11.5px">${esc(s.kind)}</span>`:"";
      // Uptime badge on a running row — parsed from the runtime's own Status
      // ("Up 2 hours") by the backend, so it needs no second probe. Off/native
      // rows carry no uptime, so the badge simply does not draw.
      const up=(s.running&&s.uptime)?`<span class="svc-up">up <b>${esc(s.uptime)}</b></span>`:"";
      // Per-service controls only where the backend says the runtime supports them
      // (compose/sail). ddev manages its services together, so those rows show
      // state only and the env-level Start/Stop above is the control.
      const ctl=d.controls?`<span class="svc-acts">
        <button class="btn sm" title="Start ${esc(s.name)}" onclick='svcAction(${dj},${jarg(s.name)},"start")'>▶</button>
        <button class="btn sm" title="Stop ${esc(s.name)}" onclick='svcAction(${dj},${jarg(s.name)},"stop")'>■</button>
        <button class="btn sm" title="Restart ${esc(s.name)}" onclick='svcAction(${dj},${jarg(s.name)},"restart")'>↻</button>
      </span>`:"";
      return `<div class="svc">${dot}<b class="svc-name">${esc(s.name)}</b>${state}${kind}<span class="grow"></span>${up}${ctl}</div>`;
    }).join("")+`</div>`;
  }else{
    rows=`<p class="muted" style="margin:10px 0 0;font-size:12.5px">${esc(d.message||"No services to show.")}</p>`;
  }
  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:${svcs.length?"10px":"2px"}">
      <h3 style="margin:0">Services ${head}</h3>
      <span class="row" style="gap:8px">${envActs}
        <button class="btn sm ghost" title="Re-check" onclick='loadServices(${dj})'>↻ Refresh</button></span>
    </div>
    ${rows}
  </div>`;
}
// svcAction starts/stops/restarts one named service and streams the result into
// the console (a toast reports pass/fail). It refreshes the dashboard when the
// stream finishes so the row's up/down dot reflects the new state.
async function svcAction(dir,service,action){
  await stream("/api/service/action",{dir,service,action});
  if(VIEW==="project"&&PROJ&&PROJ.path===dir)loadServices(dir);
}
// loadFacts fetches the project's data-led facts ONCE and paints BOTH the top
// widget row (Health / Uptime / DB gauges) and the framework-STATISTICS tile grid.
// Every value the backend cannot cheaply learn comes back empty and renders "—",
// so this never fabricates a number and never blocks the paint.
async function loadFacts(dir,fresh){
  let d={};try{d=await apiJSON("/api/overview/facts?dir="+encodeURIComponent(dir)+(fresh?"&fresh=1":""));}catch(e){d={message:String(e.message||e)};}
  if(!PROJ||PROJ.path!==dir)return;
  const wh=document.getElementById("ovwidgets");if(wh)wh.innerHTML=renderWidgets(d,dir);
  const host=document.getElementById("ovfacts");if(host)host.innerHTML=renderFacts(d,dir);
  // renderWidgets rebuilt the #ovdb host as "checking…", so re-kick its own
  // async ping to resolve it (also covers the Refresh button rebuilding facts).
  loadDBWidget(dir);
}
// dbScore maps a DB round-trip latency (ms) to a 0-100 gauge score so the ring
// reads like the rest: a snappy DB (≤10ms) is ~100, and it falls off toward 0 as
// latency climbs past ~500ms. It is a display signal, not a benchmark — the point
// is a coloured ring that says "the DB is quick / sluggish" at a glance. A down or
// unknown DB (latency < 0) has no honest score, so callers show "—" instead.
function dbScore(ms){ms=Number(ms);if(!isFinite(ms)||ms<0)return null;if(ms<=10)return 100;return Math.max(0,Math.round(100-(ms-10)/4.9));}
// renderWidgets draws the top gauge/big-number tile row from the facts payload:
//   Health  — a sonRing gauge of services-up / total (as a %), the headline word,
//             and the up/total count. A native/no-service env shows "native".
//   Uptime  — the env's longest-running service age (big number), or "—" when down.
//   DB      — a HOST only ("checking…"); loadDBWidget fills it from its OWN async
//             endpoint (/api/overview/db) so the row never blocks on the DB ping.
// The Health/Uptime tiles reuse the sonRing SVG ring (no chart lib). An
// unmanaged/unknown project (no facts) shows the calm message inline.
function renderWidgets(d,dir){
  d=d||{};
  const h=d.health||{};
  // Health gauge: up/total as a ratio %. No services = a native env (not "down").
  const total=Number(h.servicesTotal)||0,up=Number(h.servicesUp)||0;
  let healthTile;
  if(total>0){
    const pct=Math.round(up/total*100);
    const word=h.up?`<span class="ovw-sub up">${up===total?"all running":"running"}</span>`
                   :`<span class="ovw-sub down">stopped</span>`;
    healthTile=`<div class="ovw">${sonRing(pct,64,7,"son-mnum")}
      <div class="ovw-body"><div class="ovw-l">Health</div>
      <div class="ovw-v">${up}<span style="color:var(--dim2);font-size:16px">/${total}</span></div>
      ${word}</div></div>`;
  }else{
    // A native / no-service env: an honest "native" state, not a red gauge.
    healthTile=`<div class="ovw"><div class="ovw-body"><div class="ovw-l">Health</div>
      <div class="ovw-v" style="font-size:19px">native</div>
      <div class="ovw-sub">no containers to manage</div></div></div>`;
  }
  // Uptime big-number tile: the env's longest-running service age, or "—" when down.
  const uptime=h.uptime||"";
  const uptimeTile=`<div class="ovw"><div class="ovw-body"><div class="ovw-l">Uptime</div>
    <div class="ovw-v${uptime?"":" muted"}" style="font-size:${uptime?"20px":"24px"}"${uptime?` title="longest-running service"`:""}>${uptime?esc(uptime):"—"}</div>
    <div class="ovw-sub">${uptime?"env online":"nothing running"}</div></div></div>`;
  // The DB tile is a HOST that loadDBWidget fills async — the facts payload no
  // longer carries the DB ping (it moved to /api/overview/db) so Health + Uptime
  // paint instantly and never wait ~5s on a down database. Until the ping
  // resolves the tile shows a calm "checking…", never the "…" skeleton.
  const dbTile=`<div class="ovw" id="ovdb"><div class="son-mini"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28.5" fill="none" stroke="var(--line2)" stroke-width="7"/></svg><div class="son-mnum" style="color:var(--dim2)">…</div></div>
    <div class="ovw-body"><div class="ovw-l">Database</div>
    <div class="ovw-v muted" style="font-size:15px">checking…</div></div></div>`;
  const tiles=healthTile+uptimeTile+dbTile;
  // An unmanaged/unknown project has no framework facts; surface its calm message
  // once (below the widgets) rather than leaving the row silent.
  const msg=(!d.facts||!d.facts.length)&&d.message?`<div class="ovw" style="grid-column:1/-1"><div class="ovw-body"><div class="ovw-l">Note</div><div class="ovw-sub" style="white-space:normal;font-size:12px">${esc(d.message)}</div></div></div>`:"";
  return tiles+msg;
}
// renderDBTile draws the resolved Database widget from the /api/overview/db
// payload: a sonRing latency-score gauge + engine + latency in ms when reachable,
// or the calm down state (ring "—") when not. Split out of renderWidgets so the
// tile can be swapped in on its own async path without a full widget repaint.
function renderDBTile(db){
  db=db||{};
  const score=db.up?dbScore(db.latencyMs):null;
  const ring=(score===null)?`<div class="son-mini"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28.5" fill="none" stroke="var(--line2)" stroke-width="7"/></svg><div class="son-mnum" style="color:var(--dim2)">—</div></div>`:sonRing(score,64,7,"son-mnum");
  const dbSub=db.up?`<span class="ovw-sub up">${(Number(db.latencyMs)>=0)?esc(db.latencyMs)+" ms":"reachable"}</span>`
                   :`<span class="ovw-sub down">not running</span>`;
  const dbVal=db.up?esc(db.engine||"database"):"down";
  return `${ring}
    <div class="ovw-body"><div class="ovw-l">Database</div>
    <div class="ovw-v" style="font-size:19px"${db.up?` title="${dbVal}"`:""}>${dbVal}</div>${dbSub}</div>`;
}
// loadDBWidget fetches the Database tile's OWN async feed and swaps it into the
// #ovdb host once it resolves. This is the perf split: the DB ping can take ~5s
// when the database is down, so it must never block the rest of the dashboard.
// A fetch failure degrades the tile to the calm down state, never a blank.
async function loadDBWidget(dir){
  let db={up:false,latencyMs:-1};
  try{db=await apiJSON("/api/overview/db?dir="+encodeURIComponent(dir));}catch(e){db={up:false,latencyMs:-1};}
  if(!PROJ||PROJ.path!==dir)return;
  const host=document.getElementById("ovdb");if(host)host.innerHTML=renderDBTile(db);
}
// renderFacts draws the framework-STATISTICS card as a grid of big-number TILES
// (value + label + a sub-line hint) — NOT a text list of facts. The identity +
// git signals lead, then every framework-specific stat the backend supplied. Each
// value the backend could not cheaply learn is "—" (rendered dimmed), so the grid
// never fabricates a number and a stat-less framework still shows its identity.
function renderFacts(d,dir){
  d=d||{};
  const dj=jarg(dir);
  // Identity + git lead the grid; then the per-framework statistics. Git rows the
  // backend supplies (branch, uncommitted) fold in so the grid is one source.
  const base=[
    {label:"Framework",value:d.framework||"",hint:"the project's framework"},
    {label:"Environment",value:d.env||"",hint:"the keel env recipe"},
  ];
  const all=base.concat(d.git||[]).concat(d.facts||[]);
  const tiles=all.map(f=>{
    const v=f.value||"";
    // The value carries its own title so a long value that clamps to two lines
    // (e.g. "laravel-docker") is still readable in full on hover — never a
    // silent mid-word cut. The tile title stays the hint (what the stat means).
    return `<div class="ovstat"${f.hint?` title="${esc(f.hint)}"`:""}>
      <div class="ovstat-v${v?"":" dash"}"${v?` title="${esc(v)}"`:""}>${esc(v||"—")}</div>
      <div class="ovstat-l">${esc(f.label)}</div>
      ${f.hint?`<div class="ovstat-s">${esc(f.hint)}</div>`:""}</div>`;
  }).join("");
  const note=(!d.facts||!d.facts.length)&&d.message?`<p class="muted" style="margin:10px 0 0;font-size:12.5px">${esc(d.message)}</p>`:"";
  return `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
      <h3 style="margin:0">Statistics</h3>
      <button class="btn sm ghost" title="Re-read statistics" onclick='loadFacts(${dj},true)'>↻ Refresh</button>
    </div>
    <div class="ovstats statgrid">${tiles}</div>
    ${note}
  </div>`;
}
// --- Manage-services tab: the installed recipes (with Remove) + `keel add` ---
//   Was add-only (Dan: "I can't see existing services to remove them"). Now it
//   leads with the recipes THIS project already has — read from the real manifest
//   via /api/installed, so it is accurate on every framework — each with a Remove
//   that streams `keel remove <recipe> --yes`. The add list follows below. Both
//   halves stream their output into the console.
const KIND_LABEL={service:"Services",db:"Databases",frontend:"UI kits & frontends",addon:"Addons",extra:"Extras",config:"Config",generator:"Generators"};
async function renderAddTab(b){
  b.innerHTML=`<div class="card"><h3 style="margin-top:0">Manage services · ${esc(PROJ.name)}</h3><p class="muted" style="font-size:12.5px;margin:0">Loading this project's recipes…</p></div>`;
  // Both reads in parallel: what is installed (to list + remove) and what is
  // addable (to add). Either failing degrades to a clear message, never a blank.
  const [inst,add]=await Promise.all([
    fetchJSON("/api/installed?dir="+encodeURIComponent(PROJ.path)),
    fetchJSON("/api/addable?dir="+encodeURIComponent(PROJ.path)),
  ]);
  if(!b.isConnected||PTAB!=="add"||!PROJ)return; // tab changed while loading
  const fw=inst.framework||add.framework||"this project";
  b.innerHTML=`${installedCard(inst)}${addableCard(add)}`;
  if(inst.error&&add.error)b.innerHTML=`<div class="err">${esc(inst.error||add.error)}</div>`;
}
// installedCard lists the recipes already in the manifest, each with a Remove
// (except the framework/env, which define the project — shown, not removable).
function installedCard(d){
  d=d||{};
  const dj=jarg(PROJ.path);
  const list=d.installed||[];
  const rows=list.length?list.map(r=>{
    const kind=r.kind?`<span class="svc-state" style="border-color:var(--line2);color:var(--dim)">${esc(r.kind)}</span>`:"";
    const src=r.source&&r.source!=="builtin"?`<span class="muted" style="font-size:11.5px">${esc(r.source)}</span>`:"";
    const act=r.removable
      ?`<button class="btn sm ghost" title="Remove ${esc(r.id)} from the manifest (files are kept)" onclick='removeRecipe(${dj},${jarg(r.id)})'>Remove</button>`
      :`<span class="tag dim" title="The framework and environment define the project. They cannot be removed">core</span>`;
    return `<div class="svc"><b class="svc-name">${esc(r.label||r.id)}</b>${kind}${src}<span class="grow"></span>${act}</div>`;
  }).join(""):`<p class="muted" style="font-size:12.5px;margin:8px 0 0">Nothing added yet. This project has only its framework and environment. Add a service below.</p>`;
  return `<div class="card"><h3 style="margin-top:0">Installed in ${esc(d.framework||"this project")}</h3>
    <p class="muted" style="font-size:12.5px;margin:0 0 8px">Remove runs <code>keel remove &lt;recipe&gt;</code>. It stops managing the recipe in the manifest; files an installer wrote are left for you to remove. Output streams below.</p>
    ${list.length?`<div class="svcs">${rows}</div>`:rows}</div>`;
}
// addableCard offers the recipes compatible with this framework that are not yet
// installed, grouped by kind — the old add-only surface, now the second half.
function addableCard(d){
  d=d||{};
  if(d.error&&!(d.addable||[]).length)return `<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Add a service</h3><p class="muted" style="font-size:12.5px;margin:0">${esc(d.error)}</p></div>`;
  const list=d.addable||[];
  if(!list.length)return `<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Add a service</h3><p class="muted" style="font-size:13px;margin:0">Nothing left to add. Every compatible recipe is already installed.</p></div>`;
  const byKind={};list.forEach(r=>{(byKind[r.kind]=byKind[r.kind]||[]).push(r);});
  const dj=jarg(PROJ.path);
  const groups=Object.keys(byKind).map(k=>{
    const chips=byKind[k].map(r=>`<span class="opt" onclick='addRecipe(${dj},${jarg(r.id)})' title="${esc(r.id)}">${iconImg(iconSlug(r),18)} ${esc(r.label||r.id)}</span>`).join("");
    return `<div style="margin-top:12px"><div class="railcap" style="padding:0 0 6px">${esc(KIND_LABEL[k]||k)}</div><div class="opts">${chips}</div></div>`;
  }).join("");
  return `<div class="card" style="margin-top:14px"><h3 style="margin-top:0">Add a service</h3>
    <p class="muted" style="font-size:12.5px;margin:0 0 4px">Runs <code>keel add &lt;recipe&gt;</code>. Resolves against the existing stack, installs only the delta, records it in the manifest. Output streams below.</p>
    ${groups}</div>`;
}
// --- Deploy tab: pick a target, see the artifacts it writes, generate them ----
//   keel deploy only ever WRITES artifacts — a Dockerfile, a compose file, a
//   fly.toml — it never calls a cloud API. The target list + each target's
//   artifact filenames come from /api/deploy/targets, which shells `keel deploy
//   --json`, so deploy.go's deployTargets/deployFiles stay the single source of
//   truth and this tab can never hardcode a list that drifts from it.
const DEPLOY={dir:null,target:null,targets:[],framework:""};
async function renderDeploy(b){
  b.innerHTML=`<div class="card"><h3 style="margin-top:0">Deploy ${esc(PROJ.name)}</h3><p class="muted" style="font-size:12.5px;margin:0">Loading deploy targets…</p></div>`;
  DEPLOY.dir=PROJ.path;
  const d=await fetchJSON("/api/deploy/targets?dir="+encodeURIComponent(PROJ.path));
  if(!b.isConnected||PTAB!=="deploy"||!PROJ||PROJ.path!==DEPLOY.dir)return; // tab changed while loading
  DEPLOY.targets=(d&&d.targets)||[];
  DEPLOY.framework=(d&&d.framework)||"";
  if(d&&d.error&&!DEPLOY.targets.length){
    b.innerHTML=`<div class="card"><h3 style="margin-top:0">Deploy ${esc(PROJ.name)}</h3>
      <p class="muted" style="font-size:13px;margin:0">Could not read the deploy targets: ${esc(d.error)}</p></div>`;
    return;
  }
  if(!DEPLOY.targets.length){
    b.innerHTML=`<div class="card"><h3 style="margin-top:0">Deploy ${esc(PROJ.name)}</h3>
      <p class="muted" style="font-size:13px;margin:0">keel has no deploy targets for this project.</p></div>`;
    return;
  }
  // Default to the profile's hosting default when it is one of the offered targets,
  // else the first target — so the picker opens on a sensible choice.
  const keys=DEPLOY.targets.map(t=>t.key);
  if(!DEPLOY.target||!keys.includes(DEPLOY.target)){
    DEPLOY.target=keys.includes(PROFILE.hosting)?PROFILE.hosting:keys[0];
  }
  renderDeployBody(b);
}
function pickDeployTarget(key){DEPLOY.target=key;const b=document.getElementById("tabbody");if(b)renderDeployBody(b);}
function renderDeployBody(b){
  const cur=DEPLOY.targets.find(t=>t.key===DEPLOY.target)||DEPLOY.targets[0];
  const dj=jarg(DEPLOY.dir);
  const picker=rlistHTML(DEPLOY.targets.map(t=>({
    on:t.key===DEPLOY.target,label:t.key,sub:t.desc||"",call:`pickDeployTarget(${jarg(t.key)})`,
  })));
  // The artifacts a target writes come from the endpoint; without a manifest the
  // framework is unknown so keel deploy --json omits them — say so rather than
  // imply the target writes nothing.
  const arts=(cur&&cur.artifacts)||[];
  const artifacts=arts.length
    ? `<ul style="margin:6px 0 0;padding-left:18px">${arts.map(f=>`<li><code>${esc(f)}</code></li>`).join("")}</ul>`
    : `<p class="muted" style="font-size:12.5px;margin:6px 0 0">The exact files depend on this project's framework. keel resolves them at generate time. ${DEPLOY.framework?"":"Build or track this project so keel knows its stack."}</p>`;
  b.innerHTML=`<div class="card"><h3 style="margin-top:0">Deploy ${esc(PROJ.name)}</h3>
    <p class="muted" style="font-size:12.5px;margin:0 0 12px">keel generates the deploy artifacts your hosting target needs. It never calls a cloud API. Output streams below.</p>
    <div class="railcap" style="padding:0 0 6px">Target</div>
    ${picker}
    <div style="margin-top:14px"><div class="railcap" style="padding:0 0 2px">Artifacts <b style="color:var(--headSoft)">${esc(cur?cur.key:"")}</b> generates</div>${artifacts}</div>
    <div class="row" style="gap:8px;margin-top:14px">
      <button class="btn primary" onclick='stream("/api/exec",{dir:${dj},args:["deploy",${jarg(DEPLOY.target)}]})'>⤴ Generate deploy artifacts</button>
      <button class="btn" onclick='stream("/api/exec",{dir:${dj},args:["deploy",${jarg(DEPLOY.target)},"--dry-run"]})'>Preview (dry run)</button>
    </div></div>`;
}

/* ---------- ADD RECIPE (keel add) ---------- */
// Install a recipe compatible with the project (chosen in the Add-service tab)
// via the exec path, streaming. --yes skips the TTY confirm the studio's exec
// path cannot answer; --trust covers a pack recipe.
async function addRecipe(dir,id){
  await stream("/api/exec",{dir,args:["add",id,"--yes","--trust"]});
  // Re-read the manage-services tab so the added recipe moves into Installed and
  // out of the addable list without a manual refresh.
  if(VIEW==="project"&&PROJ&&PROJ.path===dir&&PTAB==="add"){const b=document.getElementById("tabbody");if(b)renderAddTab(b);}
}
// removeRecipe drops a recipe from the manifest via `keel remove <recipe> --yes`
// (the studio exec path cannot answer the TTY confirm, so --yes is required),
// streaming the result, then re-reads the tab so the row disappears from Installed.
async function removeRecipe(dir,id){
  if(!confirm("Remove "+id+" from this project's manifest? Files on disk are kept."))return;
  await stream("/api/exec",{dir,args:["remove",id,"--yes"]});
  if(VIEW==="project"&&PROJ&&PROJ.path===dir&&PTAB==="add"){const b=document.getElementById("tabbody");if(b)renderAddTab(b);}
}

/* ---------- GENERATE (uniform module-plan surface for EVERY framework) ----------
   ONE generation system whatever the stack: a module header, an accordion section
   per component type (grouped by level), each opening a per-component typed form
   rendered GENERICALLY from that component's GenInput (incl. the full fields
   table), a staged-instance list (edit/duplicate/remove) backing a ModulePlan,
   and a Generate button that submits the whole plan to /api/generate. Only the
   catalogue (fetched from /api/generators) differs per framework — the shell, the
   fields primitive and the interaction are identical for Laravel, Django, Next,
   Magento, etc. Stacks (auth) live in their own section and apply via `keel add`. */
const GEN={
  dir:null,fw:"",items:[],hasModule:false, // catalogue + whether this framework has a module concept
  plan:{vendor:"",module:"",target:"",components:[]}, // the ModulePlan being staged
  openType:null,                       // which component section's Add form is open
  draft:null,                          // the instance being added/edited {type,params,fields,editIdx}
};
const GEN_TYPES=["string","int","decimal","bool","text","datetime","foreignId","json"];
const LEVELS=[["code-block","Code blocks"],["module","Modules"],["package","Packages"],["stack","Stacks"]];
function levelLabel(l){const m=LEVELS.find(x=>x[0]===l);return m?m[1]:(l||"other");}
// A framework keel renders a whole plan for (Magento) vs one that falls back to
// per-component `keel gen`. Cosmetic only — the backend enforces the real path.
const genWholePlan=fw=>fw==="magento";
// The module generatable (if the framework has one) — its inputs drive the header
// (vendor / module / target). A framework with no "module" entry has no header
// fields beyond a plain module name.
function genModuleDef(){return GEN.items.find(g=>g.level==="module")||null;}
const genByKey=key=>GEN.items.find(g=>g.key===key)||null;
const genInputsOf=g=>(g&&g.inputs)||[];
const genHasFields=g=>genInputsOf(g).some(i=>i.type==="fields");

async function renderGenerate(c){
  c.innerHTML=`<p class="lede" style="margin-top:0">Generate code into <b>${esc(PROJ.name)}</b>: add components (each with its own typed form and fields table), then Generate. Only this framework's catalogue differs; the flow is the same for every stack. Output streams below.</p><div id="genhost"><span class="muted">loading generators for this stack…</span></div>`;
  GEN.dir=PROJ.path;GEN.plan={vendor:"",module:"",target:"",components:[]};GEN.openType=null;GEN.draft=null;
  const d=await fetchJSON("/api/generators?dir="+encodeURIComponent(PROJ.path));
  const host=document.getElementById("genhost");if(!host)return;
  if(d.error){host.innerHTML=`<div class="err">${esc(d.error)}</div>`;return;}
  GEN.fw=d.framework||"";GEN.items=d.generatables||[];GEN.hasModule=!!d.hasModule;
  if(!GEN.items.length){host.innerHTML=`<div class="card"><p class="muted" style="margin:0">keel has no generators for <b>${esc(GEN.fw||"this framework")}</b> yet.</p></div>`;return;}
  // Default the target from the module def's target input, if it declares one.
  const mdef=genModuleDef();
  const tin=mdef&&genInputsOf(mdef).find(i=>i.name==="target");
  if(tin&&tin.default)GEN.plan.target=tin.default;
  renderGenAll();
}
// renderGenAll draws the whole Generate surface: the module header, one accordion
// per component type, and the Generate/stack footer.
function renderGenAll(){
  const host=document.getElementById("genhost");if(!host)return;
  host.innerHTML=genHeaderHTML()+genSectionsHTML()+genFooterHTML();
}
// --- module header (rendered from the module generatable's own inputs) ---------
// Shown only for a framework with a real module concept (Magento's Vendor_Module,
// NestJS's @Module). Next/Laravel/Django/Symfony/FastAPI generate components
// directly, so there is no module to name and no header: the fix for a "Module"
// box appearing where the framework has no such thing.
function genHeaderHTML(){
  if(!GEN.hasModule)return"";
  const mdef=genModuleDef();
  const ins=genInputsOf(mdef);
  // A framework with a vendor concept declares a "vendor" input; one with an
  // app/code-vs-package target declares a "target" options input. Everything is
  // read from GenInput — no per-framework special case here.
  const hasVendor=ins.some(i=>i.name==="vendor");
  const tin=ins.find(i=>i.name==="target");
  let fields=`<div class="row" style="gap:var(--s2);flex-wrap:wrap">`;
  if(hasVendor)fields+=`<label style="flex:1;min-width:160px"><span class="msub" style="padding-top:0">Vendor</span><input value="${esc(GEN.plan.vendor)}" placeholder="Acme" oninput="GEN.plan.vendor=this.value"></label>`;
  fields+=`<label style="flex:1;min-width:160px"><span class="msub" style="padding-top:0">Module</span><input value="${esc(GEN.plan.module)}" placeholder="${esc(hasVendor?"Blog":"my_module")}" oninput="GEN.plan.module=this.value"></label>`;
  fields+=`</div>`;
  let target="";
  if(tin&&(tin.choices||[]).length){
    target=`<div style="margin-top:var(--s3)"><div class="msub" style="padding-top:0">Target</div>`
      +rlistHTML(tin.choices.map(ch=>({on:(GEN.plan.target||tin.default)===ch,label:targetLabel(ch),sub:targetHelp(ch),call:`setGenTarget(${jarg(ch)})`})))
      +`</div>`;
  }
  const pathNote=genWholePlan(GEN.fw)?"":`<p class="muted" style="font-size:12px;margin:var(--s3) 0 0">${esc(GEN.fw)} has no whole-plan renderer yet, so Generate runs <code>keel gen</code> for each component. It looks and works the same; only the render path differs.</p>`;
  return `<div class="card"><h3 style="margin-top:0">Module</h3>${fields}${target}${pathNote}</div>`;
}
function targetLabel(t){return t==="package"?"Composer package":t==="app-code"?"App code":t;}
function targetHelp(t){return t==="package"?"a distributable package under vendor/":t==="app-code"?"drops it in the application tree (app/code)":"";}
function setGenTarget(t){GEN.plan.target=t;renderGenAll();}
// --- one accordion per component type, grouped by level -----------------------
function genSectionsHTML(){
  const byLevel={};GEN.items.forEach(g=>{(byLevel[g.level]=byLevel[g.level]||[]).push(g);});
  let n=0,html="";
  LEVELS.forEach(([lvl,title])=>{
    const items=(byLevel[lvl]||[]).filter(g=>lvl!=="module"); // the module IS the header
    if(!items.length)return;
    html+=`<div class="msub">${esc(title)}</div>`;
    items.forEach(g=>{
      n++;
      if(g.level==="stack"){html+=genStackAccordion(n,g);return;}
      html+=genComponentAccordion(n,g);
    });
  });
  return html;
}
// genComponentAccordion is one component type: its staged instances + an Add form.
function genComponentAccordion(n,g){
  const staged=GEN.plan.components.filter(c=>c.type===g.key);
  const open=GEN.openType===g.key;
  const summary=staged.length?staged.length+" staged":"none staged";
  const state=open?"open":(staged.length?"done":"");
  const body=open?genComponentBody(g):"";
  return accHTML(n,g.label,summary,state,`toggleGenType(${jarg(g.key)})`,body);
}
function toggleGenType(key){
  GEN.openType=(GEN.openType===key)?null:key;
  GEN.draft=(GEN.openType===key)?newGenDraft(key):null;
  renderGenAll();
}
function newGenDraft(key){
  const g=genByKey(key);const params={};
  // Seed scalar inputs with their declared defaults so the form is honest.
  genInputsOf(g).forEach(i=>{if(i.type!=="fields"&&i.default!==undefined&&i.default!=="")params[i.name]=i.default;});
  return {type:key,params,fields:[],editIdx:-1};
}
// genComponentBody renders the staged-instance list + the per-component typed form
// (rendered generically from GenInput), plus its Add/Save button.
function genComponentBody(g){
  const staged=GEN.plan.components.map((c,i)=>({c,i})).filter(x=>x.c.type===g.key);
  const rows=staged.length?`<div class="marows">${staged.map(({c,i})=>genStagedRow(c,i)).join("")}</div>`
    :`<div class="ma-empty">No ${esc(g.label.toLowerCase())} staged yet. Fill the form below and Add.</div>`;
  return rows+genDraftForm(g);
}
// genStagedRow is one staged instance: its name + a field count, with edit /
// duplicate / remove — the add-many list backing the ModulePlan.
function genStagedRow(c,i){
  const nm=(c.params&&c.params.name)||"(unnamed)";
  const extra=(c.fields&&c.fields.length)?` <small>${c.fields.length} field${c.fields.length===1?"":"s"}</small>`:"";
  return `<div class="marow">
    <span class="ma-name"><b>${esc(nm)}</b>${extra}</span>
    <span class="ma-acts">
      <button class="btn ghost sm" onclick="editStaged(${i})" title="edit">✎</button>
      <button class="btn ghost sm" onclick="dupStaged(${i})" title="duplicate">⧉</button>
      <button class="btn ghost sm" onclick="removeStaged(${i})" title="remove">✕</button>
    </span></div>`;
}
// genDraftForm renders the per-component form generically from the component's
// GenInput list: a text/class → text box, int → number, bool → checkbox, options →
// radio list, ref → text, and fields → the full mage2gen fields table. This is the
// single form machinery every framework shares.
function genDraftForm(g){
  if(!GEN.draft||GEN.draft.type!==g.key)GEN.draft=newGenDraft(g.key);
  const dr=GEN.draft;
  let controls="";
  genInputsOf(g).forEach(inp=>{
    if(inp.type==="fields"){controls+=genFieldsTable();return;}
    controls+=genScalarControl(inp,dr);
  });
  const editing=dr.editIdx>=0;
  return `<div style="margin-top:var(--s3);border-top:1px dashed var(--line2);padding-top:var(--s3)">
    ${controls}
    <div class="row" style="gap:var(--s2);margin-top:var(--s3)">
      <button class="btn primary sm" onclick="commitDraft(${jarg(g.key)})">${editing?"Save changes":"+ Add "+esc(g.label)}</button>
      ${editing?`<button class="btn ghost sm" onclick="cancelDraft(${jarg(g.key)})">Cancel</button>`:""}
    </div>
  </div>`;
}
// genScalarControl renders one non-fields input from its GenInput.
function genScalarControl(inp,dr){
  const v=dr.params[inp.name]!==undefined?dr.params[inp.name]:"";
  const lab=`<span class="msub" style="padding-top:0">${esc(inp.label||inp.name)}${inp.required?" *":""}</span>`;
  const help=inp.help?`<div class="muted" style="font-size:11px;margin-top:3px">${esc(inp.help)}</div>`:"";
  // Handler attributes are SINGLE-quoted because the param name comes through
  // JSON.stringify (double quotes); putting that inside a double-quoted attribute
  // would close it early. The rlistHTML path already single-quotes its onclick.
  const set=`setDraftParam(${jarg(inp.name)},this`;
  if(inp.type==="bool"){
    return `<label class="chk" style="margin-top:var(--s3)"><input type="checkbox" ${v?"checked":""} onchange='${set}.checked)'> ${esc(inp.label||inp.name)}</label>${help}`;
  }
  if(inp.type==="int"){
    return `<label style="display:block;margin-top:var(--s3)">${lab}<input type="number" value="${esc(v)}" oninput='${set}.value)'></label>${help}`;
  }
  if(inp.type==="options"){
    return `<div style="margin-top:var(--s3)">${lab}${rlistHTML((inp.choices||[]).map(ch=>({on:String(v)===String(ch),label:ch,call:`setDraftParam(${jarg(inp.name)},${jarg(ch)})`})))}</div>${help}`;
  }
  // text / class / ref / path → a text box
  const ph=inp.name==="name"?"e.g. Product":"";
  return `<label style="display:block;margin-top:var(--s3)">${lab}<input value="${esc(v)}" placeholder="${esc(ph)}" oninput='${set}.value)'></label>${help}`;
}
// setDraftParam accepts either an event-value (from an oninput/onchange, second
// arg is the value) or a direct value (from a radio row's call string).
function setDraftParam(name,val){if(!GEN.draft)return;GEN.draft.params[name]=val;
  if(GEN.draft.type&&genByKey(GEN.draft.type)&&genByKey(GEN.draft.type).inputs&&genByKey(GEN.draft.type).inputs.some(i=>i.type==="options"))renderGenAll();
}
// --- the shared full fields table (name/type/nullable/unique/index/default/len) -
function genFieldsTable(){
  const rows=GEN.draft.fields.map((fld,i)=>`<tr>
    <td><input value="${esc(fld.name||"")}" placeholder="name" oninput="GEN.draft.fields[${i}].name=this.value"></td>
    <td><select onchange="GEN.draft.fields[${i}].type=this.value">${GEN_TYPES.map(t=>`<option value="${t}"${t===fld.type?" selected":""}>${t}</option>`).join("")}</select></td>
    <td style="text-align:center"><input type="checkbox" ${fld.nullable?"checked":""} onchange="GEN.draft.fields[${i}].nullable=this.checked"></td>
    <td style="text-align:center"><input type="checkbox" ${fld.unique?"checked":""} onchange="GEN.draft.fields[${i}].unique=this.checked"></td>
    <td style="text-align:center"><input type="checkbox" ${fld.index?"checked":""} onchange="GEN.draft.fields[${i}].index=this.checked"></td>
    <td><input value="${esc(fld.default||"")}" placeholder="—" oninput="GEN.draft.fields[${i}].default=this.value"></td>
    <td><input type="number" value="${fld.length||""}" placeholder="—" oninput="GEN.draft.fields[${i}].length=parseInt(this.value||'0',10)"></td>
    <td style="text-align:center"><button class="btn ghost sm" onclick="delGenField(${i})" title="remove">✕</button></td>
  </tr>`).join("");
  return `<div style="margin-top:var(--s4)">
    <div class="msub" style="padding-top:0">Fields</div>
    <table class="ftable"><thead><tr>
      <th>Name</th><th style="width:120px">Type</th><th style="width:52px">Null</th><th style="width:60px">Unique</th><th style="width:52px">Index</th><th style="width:90px">Default</th><th style="width:70px">Len</th><th style="width:36px"></th>
    </tr></thead>
    <tbody>${rows||`<tr><td colspan="8" class="muted" style="font-size:12px">No fields yet. Add one to give the model real columns.</td></tr>`}</tbody></table>
    <div class="row" style="margin-top:var(--s2)"><button class="btn sm" onclick="addGenField()">+ Add field</button></div>
  </div>`;
}
function addGenField(){GEN.draft.fields.push({name:"",type:"string",nullable:false,unique:false,index:false,default:"",length:0});renderGenAll();}
function delGenField(i){GEN.draft.fields.splice(i,1);renderGenAll();}
// --- staging actions (add / edit / duplicate / remove) ------------------------
function commitDraft(key){
  const g=genByKey(key);const dr=GEN.draft;
  // Enforce required inputs the same way the CLI would.
  for(const inp of genInputsOf(g)){
    if(inp.required&&inp.type!=="fields"&&!String(dr.params[inp.name]||"").trim()){alert("“"+(inp.label||inp.name)+"” is required.");return;}
  }
  const fields=dr.fields.filter(f=>String(f.name||"").trim());
  const inst={type:key,params:Object.assign({},dr.params),fields};
  if(dr.editIdx>=0)GEN.plan.components[dr.editIdx]=inst;
  else GEN.plan.components.push(inst);
  GEN.draft=newGenDraft(key);
  renderGenAll();
}
function cancelDraft(key){GEN.draft=newGenDraft(key);renderGenAll();}
function editStaged(i){
  const c=GEN.plan.components[i];if(!c)return;
  GEN.openType=c.type;
  GEN.draft={type:c.type,params:Object.assign({},c.params),fields:(c.fields||[]).map(f=>Object.assign({},f)),editIdx:i};
  renderGenAll();
}
function dupStaged(i){
  const c=GEN.plan.components[i];if(!c)return;
  GEN.plan.components.splice(i+1,0,{type:c.type,params:Object.assign({},c.params),fields:(c.fields||[]).map(f=>Object.assign({},f))});
  renderGenAll();
}
function removeStaged(i){GEN.plan.components.splice(i,1);if(GEN.draft&&GEN.draft.editIdx===i)GEN.draft=null;renderGenAll();}
// --- stack section (auth etc.): applied via keel add, not the plan -------------
function genStackAccordion(n,g){
  const applies=(g.applies||[]);const open=GEN.openType==="stack:"+g.key;
  const d=jarg(GEN.dir);
  const body=applies.length?`<p class="muted" style="font-size:var(--t-sm);margin:0 0 var(--s3)">Installs: <code>${applies.map(esc).join(" ")}</code>. A stack is a capability, not a code component. It applies the real recipe(s) via <code>keel add</code>. Review the plan in the stream first.</p>
    <div class="row" style="gap:var(--s2)">
      <button class="btn primary sm" onclick='addStack(${d},${jarg(applies)})'>Add ${esc(g.label)}</button>
      <button class="btn sm" onclick='stream("/api/exec",{dir:${d},args:["add",${applies.map(a=>jarg(a)).join(",")},"--dry-run"]})'>What will this do?</button>
    </div>`
    :`<p class="muted" style="margin:0">This stack has no recipes to install for ${esc(GEN.fw)}.</p>`;
  return accHTML(n,g.label,applies.length?applies.join(" "):"",open?"open":"",`toggleGenType(${jarg("stack:"+g.key)})`,open?body:"");
}
// --- footer: Generate the whole plan ------------------------------------------
function genFooterHTML(){
  const n=GEN.plan.components.length;
  const needModule=GEN.hasModule&&!GEN.plan.module.trim();
  const dis=(needModule||!n)?"disabled":"";
  const note=GEN.hasModule
    ?(GEN.plan.module.trim()?"module "+esc(GEN.plan.module):"name the module above")
    :(n?"ready to generate":"stage a component below");
  return `<div class="card" style="display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap">
    <div style="flex:1;min-width:200px"><b>${n} component${n===1?"":"s"} staged</b>
      <div class="muted" style="font-size:12px">${note} · ${genWholePlan(GEN.fw)?"rendered as one plan":"one keel gen per component"}</div></div>
    <button class="btn" ${dis} onclick="submitGenPlan(true)">Preview</button>
    <button class="btn primary" ${dis} onclick="submitGenPlan(false)">Generate</button>
  </div>`;
}
// submitGenPlan posts the whole ModulePlan to /api/generate. It looks and behaves
// identically for every framework; the backend renders the whole plan (Magento)
// or execs `keel gen` per component (others). A module name is required only where
// the framework has a module concept.
function submitGenPlan(dryRun){
  if(GEN.hasModule&&!GEN.plan.module.trim()){alert("Name the module first.");return;}
  if(!GEN.plan.components.length){alert("Stage at least one component.");return;}
  stream("/api/generate",{dir:GEN.dir,vendor:GEN.plan.vendor,module:GEN.plan.module,target:GEN.plan.target,components:GEN.plan.components,dryRun:!!dryRun});
}
// addStack installs a stack's recipe(s) via keel add, streaming. --yes skips the
// TTY confirm the studio's exec path cannot answer; --trust covers a pack recipe.
function addStack(dir,ids){stream("/api/exec",{dir,args:["add",...ids,"--yes","--trust"]});}

/* ---------- DATA (grid + raw SQL) ---------- */
const GRID={dir:null,table:null,cols:[],rows:[],pk:[],page:1,pageSize:50,total:0,sort:"",desc:false,filterCol:"",filter:"",dirty:{}};
const gridEl=()=>document.getElementById("gridhost");
// gridSet writes into the Data grid host, but ONLY if it is still on screen and
// the Data tab is still the active one. The grid renders are async (they await
// /api/db/*), so navigating away mid-load would otherwise call .innerHTML on a
// null host — the "Cannot set properties of null" crash the fitness audit found
// on the Next Generate tab and the monorepo root. Returns true when it wrote.
function gridSet(html){
  const el=gridEl();
  if(!el||PTAB!=="data")return false;
  el.innerHTML=html;
  return true;
}
function renderData(c){
  const be=PROJ_BACKEND;
  const banner=be&&be.inherited&&be.engine?`<div class="backend" style="margin-bottom:14px">${iconImg(iconSlug({id:be.provider||be.engine,label:be.engine}),22)}<div style="flex:1"><div class="bl">Inherited shared backend</div><b>${esc(be.engine)}${be.provider?" · "+esc(be.provider):""}</b>${be.source?`<span class="muted" style="font-size:12px"> · ${esc(be.source)}</span>`:""}</div></div>`:"";
  const dj=jarg(PROJ.path);
  // Migrate / seed / reset / status run the real `keel db …` (already allowlisted
  // on /api/exec) and stream into the console — the studio's parity with the CLI's
  // db verbs. Reset is destructive, so it confirms first.
  const dbBar=`<div class="row" style="gap:6px;flex-wrap:wrap;margin:2px 0 12px">
    <span class="muted" style="font-size:12px;align-self:center;margin-right:2px">Database:</span>
    <button class="btn sm" onclick='projExec(${dj},["db","migrate"])' title="Run outstanding migrations">Migrate</button>
    <button class="btn sm" onclick='projExec(${dj},["db","seed"])' title="Run the database seeders">Seed</button>
    <button class="btn sm" onclick='projExec(${dj},["db","status"])' title="Show migration status">Status</button>
    <button class="btn sm warn" onclick='if(confirm("Reset drops and rebuilds the database. Continue?"))projExec(${dj},["db","reset"])' title="Drop, re-migrate and re-seed (destructive)">Reset</button>
  </div>`;
  c.innerHTML=`<p class="lede" style="margin-top:0">Browse and edit <b>${esc(PROJ.name)}</b>'s database. The grid is a real driver. Click a table, page, sort, filter, follow foreign keys, and stage inline edits that Commit applies in one transaction. Raw SQL is the escape hatch for DDL and one-offs.</p>`
    +banner+dbBar+tabStrip("pdata")
    +`<div id="gridhost" style="min-height:200px"></div>`;
  if(TAB.pdata==="sql")return renderSQL();
  GRID.dir=PROJ.path;
  // Pre-flight the database before offering the grid. Opening the grid against an
  // unreachable DB used to throw the raw driver error ("could not connect…") into
  // the page; instead we ping first and show a calm, actionable state.
  dataPreflight(PROJ.path);
}
// dataPreflight gates the grid on a live database. It never shows the raw driver
// error — only a calm "not reachable / configure" card with the way forward.
async function dataPreflight(dir){
  // Bail if the Data tab is no longer on screen (navigated away before the
  // initial paint): nothing to write to.
  if(!gridSet('<span class="muted">checking the database…</span>'))return;
  let d={};try{d=await apiJSON("/api/db/ping?dir="+encodeURIComponent(dir));}catch(e){d={reachable:false,reason:"Database not reachable - start the environment, then reopen Data."};}
  if(!d.reachable){
    const reason=esc(d.reason||"Database not reachable - start the environment.");
    const configure=/configure/i.test(d.reason||"");
    // gridSet guards the post-await write: if the user left the Data tab while
    // the ping was in flight, the grid host is gone and this is a no-op.
    gridSet(`<div class="card">
      <h3 style="margin-top:0">Database not reachable</h3>
      <p class="muted" style="font-size:13px;margin:0 0 12px">${reason}</p>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        ${configure?"":`<button class="btn sm" onclick='projAction(${jarg(dir)},"start")'>▶ Start environment</button>`}
        <button class="btn sm ghost" onclick='dataPreflight(PROJ.path)'>↻ Retry</button>
      </div></div>`);
    return;
  }
  projTables(dir);
}
function renderSQL(){
  gridSet(`<div class="card">
    <h3>Raw SQL</h3>
    <p class="muted" style="font-size:12.5px;margin:0 0 10px">Runs free-form SQL through this project's DB client (ddev psql / docker compose exec). Streams to the console below. The grid is the everyday tool; this is for DDL, EXPLAIN and one-offs.</p>
    <textarea id="rawsql" placeholder="SELECT * FROM users LIMIT 10;" style="min-height:120px"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" onclick='runRawSQL()'>Run SQL</button></div>
  </div>`);
}
function runRawSQL(){const sql=(document.getElementById("rawsql")||{}).value||"";if(sql.trim())stream("/api/db/query",{dir:PROJ.path,sql});}
async function projTables(dir){
  GRID.dir=dir;
  if(!gridSet('<span class="muted">loading tables…</span>'))return;
  const d=await fetchJSON("/api/db/tables",{dir});
  // Post-await writes go through gridSet: if the Data tab was left mid-load, the
  // host is gone and these are no-ops instead of a null-innerHTML crash.
  if(d.error){gridSet(`<div class="err">${esc(d.error)}</div>`);return;}
  const tables=d.tables||[];
  if(!tables.length){gridSet('<span class="muted">No tables found. Is the database running? Start the env in Projects, run Migrate, then reopen Data.</span>');return;}
  const chips=tables.map(tb=>`<button class="btn ghost sm" style="margin:3px" onclick='openTable(${jarg(tb)})'>${esc(tb)}</button>`).join("");
  gridSet(`<div class="muted" style="margin-bottom:8px">${tables.length} tables · click one to open the grid</div><div>${chips}</div>`);
}
async function openTable(table){
  if(table!==GRID.table){GRID.table=table;GRID.page=1;GRID.sort="";GRID.desc=false;GRID.filterCol="";GRID.filter="";GRID.dirty={};}
  await loadGrid();
}
async function loadGrid(){
  const body={dir:GRID.dir,table:GRID.table,page:GRID.page,pageSize:GRID.pageSize,sort:GRID.sort,desc:GRID.desc,filterCol:GRID.filterCol,filter:GRID.filter};
  const d=await fetchJSON("/api/db/grid",body);
  // Guard the post-await write: navigating off Data mid-fetch must not crash.
  if(d.error){gridSet(`<div class="grid-toolbar"><button class="btn ghost sm" onclick='projTables(GRID.dir)'>← Tables</button></div><div class="err">${esc(d.error)}</div>`);return;}
  GRID.cols=d.columns||[];GRID.rows=d.rows||[];GRID.pk=d.pk||[];GRID.page=d.page;GRID.pageSize=d.pageSize;GRID.total=d.total;
  renderGrid();
}
const isNumType=t=>/int|numeric|decimal|real|double|float|serial|money/i.test(t||"");
function dirtyKey(rowIdx,col){return rowIdx+"|"+col;}
function rowKey(row){const k={};GRID.cols.forEach((c,i)=>{if(GRID.pk.includes(c.name))k[c.name]=row[i];});return k;}
function renderGrid(){
  const editable=GRID.pk.length>0;
  const dirtyCount=Object.keys(GRID.dirty).length;
  const cols=GRID.cols;
  const filterOpts=cols.map(c=>`<option value="${esc(c.name)}"${c.name===GRID.filterCol?" selected":""}>${esc(c.name)}</option>`).join("");
  const head=cols.map(c=>{
    const pk=GRID.pk.includes(c.name);const arrow=GRID.sort===c.name?(GRID.desc?" ↓":" ↑"):"";
    return `<th class="${pk?'pk':''}" onclick='sortBy(${jarg(c.name)})' title="click to sort">${esc(c.name)}<span class="ty">${esc(c.type)}</span>${arrow}</th>`;
  }).join("");
  const rowsHTML=GRID.rows.map((row,ri)=>{
    const tds=cols.map((c,ci)=>{
      const dk=dirtyKey(ri,c.name);const staged=Object.prototype.hasOwnProperty.call(GRID.dirty,dk);
      const val=staged?GRID.dirty[dk].value:row[ci];
      const cls=[];if(isNumType(c.type))cls.push("num");if(val===null||val===undefined)cls.push("null");if(staged)cls.push("dirty");
      if(editable&&!GRID.pk.includes(c.name))cls.push("editable");
      const disp=(val===null||val===undefined)?"NULL":val;
      const canEdit=editable&&!GRID.pk.includes(c.name);
      if(c.fk&&val!==null&&val!==undefined){
        cls.push("fk");
        const follow=`followFK(${jarg(c.fk.table)},${jarg(c.fk.column)},${jarg(String(val))})`;
        const link=`<span class="fklink" title="open ${esc(c.fk.table)}.${esc(c.fk.column)} = ${esc(disp)}" onclick='event.stopPropagation();${follow}'>↗</span>`;
        return `<td class="${cls.join(' ')}"${canEdit?` onclick='editCell(${ri},${ci})'`:""}>${esc(disp)} ${link}</td>`;
      }
      return `<td class="${cls.join(' ')}"${canEdit?` onclick='editCell(${ri},${ci})'`:""}>${esc(disp)}</td>`;
    }).join("");
    return `<tr>${tds}</tr>`;
  }).join("");
  const pages=Math.max(1,Math.ceil(GRID.total/GRID.pageSize));
  const note=editable?"":`<div class="err" style="margin-bottom:8px">read-only: this table has no primary key, so cells can't be edited</div>`;
  // renderGrid runs after loadGrid's await, so guard the write: if the user left
  // the Data tab mid-fetch the host is gone and there is nothing to render into.
  if(!gridSet(`
    <div class="grid-toolbar">
      <button class="btn ghost sm" onclick='projTables(GRID.dir)'>← Tables</button>
      <b>${esc(GRID.table)}</b><span class="grow"></span>
      <select style="width:auto;padding:5px 8px;font-size:12.5px" onchange='GRID.filterCol=this.value'>${filterOpts}</select>
      <input id="gridfilter" placeholder="filter contains…" value="${esc(GRID.filter)}" onkeydown="if(event.key==='Enter')applyGridFilter()">
      <button class="btn sm" onclick='applyGridFilter()'>Filter</button>
      ${GRID.filter?`<button class="btn ghost sm" onclick='clearGridFilter()'>Clear</button>`:""}
      ${dirtyCount?`<button class="btn primary sm" onclick='commitEdits()'>Commit ${dirtyCount}</button><button class="btn ghost sm" onclick='cancelEdits()'>Cancel</button>`:""}
    </div>
    ${note}
    <div class="grid-wrap"><table class="grid"><thead><tr>${head}</tr></thead><tbody>${rowsHTML||`<tr><td colspan="${cols.length||1}" class="muted" style="padding:12px">no rows</td></tr>`}</tbody></table></div>
    <div class="grid-pager">
      <button class="btn ghost sm" ${GRID.page<=1?"disabled":""} onclick='gotoPage(${GRID.page-1})'>‹ Prev</button>
      <span>page ${GRID.page} / ${pages} · ${GRID.total} rows</span>
      <button class="btn ghost sm" ${GRID.page>=pages?"disabled":""} onclick='gotoPage(${GRID.page+1})'>Next ›</button>
    </div>`))return;
  if(!GRID.filterCol&&cols.length)GRID.filterCol=cols[0].name;
}
function followFK(refTable,refCol,value){GRID.table=refTable;GRID.page=1;GRID.sort="";GRID.desc=false;GRID.dirty={};GRID.filterCol=refCol;GRID.filter=value;loadGrid();}
function sortBy(col){if(GRID.sort===col)GRID.desc=!GRID.desc;else{GRID.sort=col;GRID.desc=false;}GRID.page=1;loadGrid();}
function gotoPage(p){GRID.page=p;loadGrid();}
function applyGridFilter(){const el=document.getElementById("gridfilter");GRID.filter=el?el.value.trim():"";GRID.page=1;loadGrid();}
function clearGridFilter(){GRID.filter="";GRID.page=1;loadGrid();}
function editCell(ri,ci){
  const col=GRID.cols[ci].name;const dk=dirtyKey(ri,col);
  const cur=Object.prototype.hasOwnProperty.call(GRID.dirty,dk)?GRID.dirty[dk].value:GRID.rows[ri][ci];
  const td=gridEl().querySelectorAll("tbody tr")[ri].children[ci];
  const inp=document.createElement("input");inp.value=(cur===null||cur===undefined)?"":cur;
  td.textContent="";td.appendChild(inp);inp.focus();inp.select();
  const commit=()=>{
    let v=inp.value;const orig=GRID.rows[ri][ci];const newVal=(v===""&&orig===null)?null:v;
    if(newVal===orig){delete GRID.dirty[dk];}else{GRID.dirty[dk]={rowIdx:ri,col,value:newVal,key:rowKey(GRID.rows[ri])};}
    renderGrid();
  };
  inp.onblur=commit;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();inp.blur();}else if(e.key==="Escape"){renderGrid();}};
}
function cancelEdits(){GRID.dirty={};renderGrid();}
async function commitEdits(){
  const edits=Object.values(GRID.dirty).map(d=>({column:d.col,value:d.value,key:d.key}));
  if(!edits.length)return;
  const d=await fetchJSON("/api/db/commit",{dir:GRID.dir,table:GRID.table,edits});
  if(d.error){alert("Commit failed: "+d.error);return;}
  GRID.dirty={};await loadGrid();
}

function renderSecrets(c){

  c.innerHTML=`<p class="lede" style="margin-top:0">Manage <b>${esc(PROJ.name)}</b>'s environment and secrets. keel generates the .env keys the stack needs and app keys locally. It never prints a secret value into the console. Values stream to disk with owner-only permissions.</p>`
    +`<div id="envvars"></div>`
    +`<div class="card">
      <h3>Sync .env</h3>
      <p class="muted" style="font-size:12.5px;margin:0 0 12px">Creates .env from .env.example, fills in required keys, and generates any app/secret keys the framework needs (APP_KEY, etc.).</p>
      <div class="row" style="gap:8px">
        <button class="btn primary" onclick='stream("/api/exec",{dir:${d},args:["secrets","sync"]})'>Sync secrets</button>
        <button class="btn" onclick='stream("/api/exec",{dir:${d},args:["secrets","check"]})'>Check</button>
      </div>
    </div>
    <div class="card">
      <h3>Generate a key</h3>
      <p class="muted" style="font-size:12.5px;margin:0 0 12px">Generate a value for a single key and write it to .env.</p>
      <div class="row" style="gap:8px">

      </div>
    </div>

// envVarRow renders one resolved variable. A public (NEXT_PUBLIC_) var shows its
// value with a "public" chip; a secret shows "••• present" (never the value)
// with a "secret" chip; ordinary config shows its value. Every row names the
// file it resolved from, and flags a value inherited from the workspace root.
function envVarRow(v){
  const chip=v.public?`<span class="tag ok">public</span>`
    :(v.secret?`<span class="tag warn">secret</span>`:`<span class="tag dim">config</span>`);
  const val=v.secret
    ?(v.present?`<span class="tag ok">••• present</span>`:`<span class="tag dim">not set</span>`)
    :`<code>${esc(v.value||"")||'<span class="muted">empty</span>'}</code>`;
  const prov=`<code style="font-size:11px" title="${v.fromRoot?"inherited from the workspace root":"this project"}">${esc(v.file||"")}${v.fromRoot?" · root":""}</code>`;
  return `<div class="plan-row" style="align-items:center">
    <div class="k" style="width:220px;word-break:break-all">${esc(v.key)}</div>
    <div>${chip}</div>
    <div style="flex:1">${val}</div>${prov}</div>`;
}
async function loadEnvVars(dir){
  const host=document.getElementById("envvars");if(!host)return;
  host.innerHTML=`<div class="card"><h3 style="margin-top:0">Environment variables</h3><p class="muted" style="margin:0">reading env…</p></div>`;

  const h=document.getElementById("envvars");if(!h)return;
  const intro=`<p class="muted" style="font-size:12.5px;margin:0 0 12px">The variables this project resolves, in Next.js precedence (<code>.env.*.local</code> &gt; <code>.env.local</code> &gt; <code>.env.&lt;env&gt;</code> &gt; <code>.env</code>). <b>NEXT_PUBLIC_</b> vars are shown in full; secrets are masked. Their value never leaves your machine.</p>`;
  if(d.error){h.innerHTML=`<div class="card"><h3 style="margin-top:0">Environment variables</h3><div class="err">${esc(d.error)}</div></div>`;return;}
  if(!d.found||!(d.vars&&d.vars.length)){
    h.innerHTML=`<div class="card"><h3 style="margin-top:0">Environment variables</h3>${intro}
      <p class="muted" style="font-size:12.5px;margin:0">${esc(d.note||"No env found. Inherited from the workspace root or injected by the platform. Run Sync .env below to create one.")}</p></div>`;
    return;
  }
  const banner=d.fromRoot?`<div class="msub" style="margin-top:0">inherited from the workspace root${d.envDir?` · <code style="font-size:11px">${esc(d.envDir)}</code>`:""}</div>`:"";
  h.innerHTML=`<div class="card"><h3 style="margin-top:0">Environment variables</h3>${intro}${banner}${d.vars.map(envVarRow).join("")}</div>`;
}
function genSecret(dir){const k=(document.getElementById("genkey").value||"").trim();if(!k){alert("Enter a key name.");return;}stream("/api/exec",{dir,args:["secrets","generate",k]});}
// magentoSecretRow renders one surfaced config key. A secret shows "••• present"
// (or "not set") + the file it lives in — never the value; a non-secret shows its
// value. This mirrors the studio's house rule: show WHERE a credential lives and
// THAT it exists, never leak the value itself.
function magentoSecretRow(it){
  const where=`<code style="font-size:11px">${esc(it.file)}</code>`;
  const val=it.secret
    ?(it.present?`<span class="tag ok">••• present</span>`:`<span class="tag dim">not set</span>`)
    :`<code>${esc(it.value||"")||'<span class="muted">empty</span>'}</code>`;
  return `<div class="plan-row" style="align-items:center">
    <div class="k" style="width:160px">${esc(it.key)}</div>

}
async function loadMagentoEnv(dir){
  const host=document.getElementById("magentoenv");if(!host)return;

async function renderPacks(c){
  let packs=[];try{const d=await apiJSON("/api/packs");packs=d.packs||[];}catch(e){}
  c.innerHTML=pageHead("Recipe packs","Packs are shareable recipe bundles: their recipes appear in the Build tree automatically. Disable one to drop its recipes without uninstalling it. Find more with <code>keel recipes search</code>; install with <code>keel recipes add &lt;owner/repo&gt;</code>.")
    +(packs.length?packs.map(p=>{
      const on=p.enabled!==false;
      const trust=`<span class="tag ${p.trusted?'ok':'warn'}">${p.trusted?"trusted":"untrusted"}</span>`;
      const state=on?trust:`<span class="tag warn">disabled</span>`+trust;
      const toggle=p.builtin?"":(on
        ?`<button class="btn ghost" onclick="togglePack(${jarg(p.name)},false)">Disable</button>`
        :`<button class="btn primary" onclick="togglePack(${jarg(p.name)},true)">Enable</button>`);
      const remove=p.builtin?"":`<button class="btn ghost" onclick="removePack(${jarg(p.name)})">Remove</button>`;
      const desc=p.description?`<p class="muted" style="margin:8px 0 0;font-size:12px">${esc(p.description)}</p>`:"";
      const body=on
        ?`<div class="opts" style="margin-top:12px">${(p.recipes||[]).map(r=>`<span class="opt" style="cursor:default">${iconImg(iconSlug(r))}<span>${esc(r.label)} <small>${esc(r.kind)}</small></span></span>`).join("")||'<span class="muted">no recipes</span>'}</div>`
        :`<p class="muted" style="margin:10px 0 0;font-size:12px">Disabled — its recipes are out of the Build tree. Enable to restore them.</p>`;
      return `
      <div class="card"${on?"":' style="opacity:.6"'}>
        <div class="row" style="width:100%"><span style="font-weight:600">${esc(p.name)}</span><span class="grow"></span>
          <span class="tag">${esc(p.version||"")}</span>${state}${toggle}${remove}</div>
        ${desc}
        ${body}
      </div>`;}).join(""):
      '<div class="muted">No packs installed. Add one with <code>keel recipes add &lt;owner/repo&gt;</code>.</div>');
}
// togglePack enables/disables an installed pack. Its recipes join or leave the
// catalog, so the recipe list the Build tree reads is refreshed before re-render —
// a disabled pack's recipes vanish from Build now, not on the next full reload.
async function togglePack(name,on){
  try{const d=await apiJSON("/api/packs",{action:on?"enable":"disable",name});if(d&&d.ok===false){alert(d.error||"failed");return;}}catch(e){alert(String(e));return;}
  try{const rec=await apiJSON("/api/recipes");R=rec.recipes||[];LANGS=rec.languages||[];}catch(e){}
  renderPacks(gc());
}
// removePack uninstalls a pack — deletes its files and drops its recipes from the
// catalog. Already-built projects are untouched. Refreshes the recipe list the
// Build tree reads, then re-renders.
async function removePack(name){
  if(!window.confirm("Remove pack \""+name+"\"?\n\nThis deletes its installed files and removes its recipes from the Build tree. Already-built projects are untouched."))return;
  try{const d=await apiJSON("/api/packs",{action:"remove",name});if(d&&d.ok===false){alert(d.error||"failed");return;}}catch(e){alert(String(e));return;}
  try{const rec=await apiJSON("/api/recipes");R=rec.recipes||[];LANGS=rec.languages||[];}catch(e){}
  renderPacks(gc());
}

// connectCard is the "Connect keel to your MCP client" panel: the two ways to
// give an AI coding agent MCP access to keel. The stdio form always works
// (`keel mcp`); the live HTTP form points at THIS studio's own /mcp endpoint,
// which auto-starts with the studio and is guarded by this session's token — so
// the agent presents X-Keel-Token exactly as the page does. The token is this
// process's; it never outlives the studio, and the card says so. The values are
// the standard MCP server-config shapes, so they paste into any MCP client.
function connectCard(){
  const host=location.host||"127.0.0.1:7373";
  const httpCmd=`{ "url": "http://${host}/mcp", "headers": { "X-Keel-Token": "${TOKEN}" } }`;
  const stdioCmd=`{ "command": "keel", "args": ["mcp"] }`;
  return `<div class="card" style="margin-top:22px">
    <h3 style="margin-top:0">Connect keel to your MCP client</h3>
    <p class="muted" style="font-size:12.5px;margin:0 0 12px">Give an AI coding agent MCP access to keel. It can list frameworks and recipes, resolve a plan, inspect projects and generate code. Add one of these to your MCP client's config:</p>
    <div class="msub">Live HTTP (this studio)</div>
    <p class="muted" style="font-size:12px;margin:-2px 0 6px">Uses the endpoint this studio auto-started at <code>http://${esc(host)}/mcp</code>, guarded by this session's token. Runs only while the studio is open; the token is regenerated each launch.</p>
    ${copyRow(httpCmd)}
    <div class="msub" style="margin-top:14px">Stdio (always available)</div>
    <p class="muted" style="font-size:12px;margin:-2px 0 6px">Runs <code>keel mcp</code> on demand, no studio needed. Add <code>--write</code> to <code>keel mcp</code> to expose the write tools.</p>
    ${copyRow(stdioCmd)}
    <p class="muted" style="font-size:11.5px;margin:12px 0 0">Started the studio with <code>--no-mcp</code>? The live HTTP endpoint is off; use the stdio form.</p>
  </div>`;
}
// copyRow renders a monospaced command with a copy button. The command carries a
// live session token, so it is never logged — only shown, and copied on demand.
function copyRow(cmd){
  const j=jarg(cmd);
  return `<div class="row" style="gap:8px;align-items:stretch">
    <code class="cmdbox">${esc(cmd)}</code>
    <button class="btn sm" onclick='copyText(${j},this)'>Copy</button></div>`;
}
function copyText(t,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent="Copied";setTimeout(()=>btn.textContent=o,1200);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,done);}
  else{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}ta.remove();done();}
}

/* ---------- BRAND: shared token renderers ----------
   One vocabulary for both the global editor and the per-project resolver: seed
   inputs, the generated 50-950 scales, the semantic roles, flat surface tokens
   and a light/dark preview. Every renderer takes a tokensDTO from the backend —
   the studio never derives a colour itself. */
const hexOK=s=>/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(String(s||"").trim());
// cssColor gates a colour token before it lands in a style="" attribute. The brand
// tokens all cross the HTTP boundary as #rrggbb; anything that is not a valid hex
// is dropped to "transparent" so a crafted value can neither break the attribute
// nor inject extra CSS declarations. esc() then handles the attribute layer.
const cssColor=v=>hexOK(v)?String(v).trim():"transparent";
// isLightHex decides label contrast on a swatch (crude luminance, enough for a caption).
function isLightHex(hex){
  const h=String(hex||"").replace("#","");
  if(h.length!==6&&h.length!==3)return false;
  const x=h.length===3?h.split("").map(c=>c+c).join(""):h;
  const r=parseInt(x.slice(0,2),16),g=parseInt(x.slice(2,4),16),b=parseInt(x.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)>150;
}
function scaleHTML(name,stops){
  if(!stops||!stops.length)return "";
  const cells=stops.map(s=>`<div class="stop${isLightHex(s.hex)?" lt":""}" style="background:${esc(cssColor(s.hex))}" title="${esc(name)}-${s.step}: ${esc(s.hex)}"><small>${s.step}</small></div>`).join("");
  return `<div class="brandrole"><div class="rname">${esc(name)}</div><div class="scale">${cells}</div></div>`;
}
function surfaceHTML(title,sf){
  const tok=(label,hex)=>hex?`<span class="tok"><i style="background:${esc(cssColor(hex))}"></i>${esc(label)}</span>`:"";
  const toks=[tok("background",sf.background),tok("foreground",sf.foreground),tok("card",sf.card),tok("card-fg",sf.cardForeground),tok("border",sf.border),tok("ring",sf.ring)].join("");
  return `<div class="brandrole"><div class="rname">${esc(title)}</div><div class="roleflat">${toks}</div></div>`;
}
// previewHTML paints a tiny themed card in light and in dark from the tokens, so
// the effect of the seed is visible, not just the swatches.
function previewHTML(t){
  const sf=t.surface,dk=t.dark,brand=(t.roles.brand||[]),accent=(t.roles.accent||[]);
  const at=w=>{const s=(brand.find(x=>x.step===w)||{}).hex;return s||"#5b21b6";};
  const ac=w=>{const s=(accent.find(x=>x.step===w)||{}).hex;return s||at(w);};
  const card=(mode,s,pri,acc)=>`<div class="pvcard" style="background:${esc(cssColor(s.card))};color:${esc(cssColor(s.foreground))};border-color:${esc(cssColor(s.border))}">
    <div class="pvmode">${mode}</div><h4>Aa: themed card</h4>
    <p style="color:${esc(cssColor(s.foreground))}">Buttons, borders and text derive from your seed.</p>
    <div class="pvbtns">
      <button class="pvbtn" style="background:${esc(cssColor(pri))};color:#fff">Primary</button>
      <button class="pvbtn" style="background:transparent;color:${esc(cssColor(acc))};border:1px solid ${esc(cssColor(acc))}">Accent</button>
    </div></div>`;
  return `<div class="brandprev">${card("Light",sf,at(600),ac(600))}${card("Dark",dk,at(500),ac(400))}</div>`;
}
// tokensPanel renders the full generated set: roles, surface (light+dark),
// radius/font, and the preview. Shared by both surfaces.
function tokensPanel(t){
  const order=[["brand",t.roles.brand],["accent",t.roles.accent],["neutral",t.roles.neutral],["muted",t.roles.muted],["success",t.roles.success],["warning",t.roles.warning],["destructive",t.roles.destructive]];
  const scales=order.map(([n,s])=>scaleHTML(n,s)).join("");
  const meta=`<div class="row" style="gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--dim)">
    <span>radius <code>${esc(t.radius||"—")}</code></span>
    <span>sans <code style="font-size:11px">${esc((t.fontSans||"—").split(",")[0])}</code></span>
    <span>mono <code style="font-size:11px">${esc((t.fontMono||"—").split(",")[0])}</code></span></div>`;
  return `<div class="msub" style="margin-top:16px">Semantic roles: 50 → 950</div>${scales}
    ${surfaceHTML("Surface: light",t.surface)}${surfaceHTML("Surface: dark",t.dark)}${meta}
    <div class="msub" style="margin-top:16px">Preview</div>${previewHTML(t)}`;
}

/* ---------- BRAND: Settings → the GLOBAL default editor ----------
   The house default over ~/.config/keel/brand.yaml, applied to every
   Tailwind/Bootstrap theme keel builds. Choose a seed primary (+ optional
   accent); the 50-950 scales, semantic roles, surface, radius/font and dark all
   regenerate live; Save persists it as the global default. */
let GBRAND={primary:"#5b21b6",accent:"",tokens:null,exists:false};
function renderBrandTab(c,head){
  c.innerHTML=head+`<div id="gbrandhost"><div class="card"><p class="muted" style="margin:0">loading the global brand default…</p></div></div>`;
  loadGlobalBrand();
}
async function loadGlobalBrand(){
  const d=await fetchJSON("/api/brand/global");
  const host=document.getElementById("gbrandhost");if(!host)return;
  if(d.error){host.innerHTML=`<div class="err">${esc(d.error)}</div>`;return;}
  GBRAND.tokens=d.tokens;GBRAND.exists=!!d.exists;
  GBRAND.primary=(d.tokens&&d.tokens.primary)||"#5b21b6";
  GBRAND.accent=(d.tokens&&d.tokens.accent)||"";
  paintGlobalBrand();
}
function paintGlobalBrand(){
  const host=document.getElementById("gbrandhost");if(!host)return;
  const t=GBRAND.tokens;
  const status=GBRAND.exists?`<span class="srcpill global"><i></i>saved default in ~/.config/keel/brand.yaml</span>`
    :`<span class="srcpill"><i></i>no default saved yet, this is a preview</span>`;
  host.innerHTML=`<div class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div><h3 style="margin:0 0 4px">House brand default</h3>
        <p class="muted" style="font-size:12.5px;margin:0;max-width:60ch">The default keel applies to <b>every</b> Tailwind or Bootstrap theme it builds. Projects inherit it unless they set their own override (on the project's Brand tab). Pick a seed; the full 50-950 scales, semantic roles, surface, radius/font and dark variant generate from it.</p></div>
      ${status}
    </div>
    <div class="seedrow" style="margin-top:16px">
      <div class="seedfld"><label>Primary (seed)</label><div class="swatchbox">
        <input type="color" id="gb_pc" value="${esc(hexOK(GBRAND.primary)?GBRAND.primary:"#5b21b6")}" oninput="gbSeed('primary',this.value)">
        <input type="text" id="gb_pt" value="${esc(GBRAND.primary)}" oninput="gbSeed('primary',this.value)" placeholder="#5b21b6"></div></div>
      <div class="seedfld"><label>Accent (optional)</label><div class="swatchbox">
        <input type="color" id="gb_ac" value="${esc(hexOK(GBRAND.accent)?GBRAND.accent:"#f97316")}" oninput="gbSeed('accent',this.value)">
        <input type="text" id="gb_at" value="${esc(GBRAND.accent)}" oninput="gbSeed('accent',this.value)" placeholder="auto (complementary)"></div></div>
      <div class="seedfld"><label>&nbsp;</label>
        <button class="btn primary" onclick="saveGlobalBrand()">${GBRAND.exists?"Save default":"Set as house default"}</button></div>
    </div>
    <div id="gb_out"></div>
    <div id="gb_panel">${t?tokensPanel(t):""}</div>
  </div>`;
}
// gbSeed updates a seed and re-generates the preview live (debounced), keeping
// the colour input and the hex text in sync.
let gbTimer=null;
function gbSeed(k,v){
  GBRAND[k]=v.trim();
  // Mirror to the paired control without a full repaint (so focus stays).
  const pc=document.getElementById(k==="primary"?"gb_pc":"gb_ac");
  const pt=document.getElementById(k==="primary"?"gb_pt":"gb_at");
  if(hexOK(v)){if(pc&&pc.value.toLowerCase()!==v.toLowerCase())pc.value=v;if(pt&&document.activeElement!==pt)pt.value=v;}
  clearTimeout(gbTimer);gbTimer=setTimeout(previewGlobalBrand,220);
}
// previewGlobalBrand regenerates the swatches from the current seed by asking the
// server to Generate (preview:true — never saves), so the live preview is
// byte-identical to what Save would persist. The studio never derives a colour.
// Only the token panel re-renders, so the seed inputs keep focus while typing.
async function previewGlobalBrand(){
  if(!hexOK(GBRAND.primary))return;                       // wait for a valid seed
  if(GBRAND.accent&&!hexOK(GBRAND.accent))return;
  let d={};try{d=await apiJSON("/api/brand/global",{primary:GBRAND.primary,accent:GBRAND.accent,preview:true});}catch(e){d=null;}
  if(!d||d.error||!d.tokens)return;
  GBRAND.tokens=d.tokens;
  const host=document.getElementById("gbrandhost");if(!host)return;
  let panel=document.getElementById("gb_panel");
  if(!panel){panel=document.createElement("div");panel.id="gb_panel";
    const card=host.querySelector(".card");if(card)card.appendChild(panel);}
  panel.innerHTML=tokensPanel(d.tokens);
}
async function saveGlobalBrand(){
  const out=document.getElementById("gb_out");
  if(!hexOK(GBRAND.primary)){out.innerHTML=`<div class="err" style="margin-top:12px">Primary must be a hex colour like #5b21b6.</div>`;return;}
  if(GBRAND.accent&&!hexOK(GBRAND.accent)){out.innerHTML=`<div class="err" style="margin-top:12px">Accent must be a hex colour like #f97316 (or leave it blank).</div>`;return;}
  out.innerHTML=`<div class="muted" style="margin-top:12px">generating and saving the house default…</div>`;
  const d=await fetchJSON("/api/brand/global",{primary:GBRAND.primary,accent:GBRAND.accent});
  if(d.error){out.innerHTML=`<div class="err" style="margin-top:12px">${esc(d.error)}</div>`;return;}
  GBRAND.tokens=d.tokens;GBRAND.exists=true;
  paintGlobalBrand();

  if(o2)o2.innerHTML=`<div class="tag ok" style="margin-top:12px">✓ saved as the house default. Every new theme inherits this</div>`;
}

/* ---------- BRAND: the PER-PROJECT override (project view → Brand tab) ----------
   An override on THIS project, layered over the global default: shows the
   resolved brand (project → global → kit, with which source wins), pre-fills from
   the project's existing CSS tokens (Detect), lets the user set or clear the
   override (writes the manifest brand block), then applies the resolved tokens to
   the project's CSS framework. */
let PBRAND={dir:null,primary:"",accent:"",radius:"",font:"",logoData:"",logoName:"",faviconData:"",data:null};
// pbFile reads a chosen logo/favicon into base64 for the brand POST (no upload
// server; the studio is loopback and writes the file into the project directly).
function pbFile(input,kind){
  const f=input.files&&input.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{if(kind==="logo"){PBRAND.logoData=rd.result;PBRAND.logoName=f.name;}else{PBRAND.faviconData=rd.result;}};
  rd.readAsDataURL(f);
}
async function renderBrandProject(b){
  b.innerHTML=`<div class="card"><p class="muted" style="margin:0">resolving this project's brand…</p></div>`;
  PBRAND.dir=PROJ.path;PBRAND.primary="";PBRAND.accent="";PBRAND.data=null;
  const d=await fetchJSON("/api/brand/project?dir="+encodeURIComponent(PROJ.path));
  if(d.error){b.innerHTML=`<div class="err">${esc(d.error)}</div>`;return;}
  PBRAND.data=d;
  // Pre-fill the seed fields: the project's own override if it has one, else the
  // resolved seed (global default / detected), else a sensible placeholder.
  const ov=d.override;
  PBRAND.primary=(ov&&ov.primary)||(d.resolved&&d.resolved.primary)||"";
  PBRAND.accent=(ov&&ov.accent)||(d.resolved&&d.resolved.accent)||"";
  paintBrandProject(b);
}
function srcLabel(src,hasKit){
  if(src==="project")return `<span class="srcpill project"><i></i>this project's own override</span>`;
  if(src==="global")return `<span class="srcpill global"><i></i>inheriting the global default</span>`;
  return `<span class="srcpill"><i></i>${hasKit?"the kit's own colours (no keel brand)":"no CSS kit detected"}</span>`;
}
function paintBrandProject(b){

  const stackNote=d.hasKit?`Detected <b>${esc(d.stack||"a CSS kit")}</b>${d.detectedFile?` in <code>${esc(d.detectedFile)}</code>`:""}.`

  const clearBtn=hasOverride?`<button class="btn ghost" onclick="clearBrandProject()">Clear override (inherit global)</button>`:"";
  b.innerHTML=`<div class="card">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div><h3 style="margin:0 0 4px">Brand for ${esc(PROJ.name)}</h3>
        <p class="muted" style="font-size:12.5px;margin:0;max-width:60ch">An override just for this project. Leave it clear to inherit the <a href="#" onclick="go('settings');setTab('brand');return false" style="color:var(--orange)">house default</a>. Setting a seed writes it to this project's manifest and applies the generated theme to its CSS.</p></div>
      ${srcLabel(d.source,d.hasKit)}
    </div>

    <div class="seedrow" style="margin-top:14px">

  </div>${magentoThemesCard(d.magento)}`;
