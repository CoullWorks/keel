// magentoThemesCard renders the Magento theme picker: every frontend theme keel
// found under app/design/frontend, its resolved brand swatches, and a marker for
// the Luma fallback. Magento's active theme is chosen in the DB (unreadable from
// disk), so we show them all and default to Luma. Returns "" for a non-Magento
// project so the card only appears where it makes sense.
let MTHEME=0;
function magentoThemesCard(mg){
  if(!mg||!mg.themes||!mg.themes.length)return "";
  MTHEME=(typeof mg.defaultIndex==="number"&&mg.defaultIndex>=0)?mg.defaultIndex:0;
  const picker=mg.themes.map((t,i)=>{
    const label=t.title||t.path;
    const luma=t.isLuma?`<span class="tag dim">default</span>`:"";
    return `<button class="btn sm mtheme-btn" data-i="${i}" onclick="pickMagentoTheme(${i})">${esc(label)} ${luma}</button>`;
  }).join("");
  return `<div class="card" style="margin-top:14px">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div><h3 style="margin:0 0 4px">Magento theme brand</h3>
        <p class="muted" style="font-size:12.5px;margin:0;max-width:62ch">Brand read from each theme's Less vars under <code>web/css/source/</code> (chasing <code>@var</code> indirections and the <code>&lt;parent&gt;</code> chain to Luma). Magento picks the active theme in the database, which keel can't read from disk, so every theme is shown and the <b>Luma default</b> is the fallback.</p></div>
    </div>
    <div class="opts" style="margin-top:12px;gap:8px">${picker}</div>
    <div id="mtheme_panel" style="margin-top:12px"></div>
  </div>`;
}
function wireMagentoThemePicker(mg){
  if(!mg||!mg.themes||!mg.themes.length)return;
  pickMagentoTheme(MTHEME);
}
// pickMagentoTheme renders the selected theme's resolved role/surface swatches.
// It reuses the shared scaleHTML/surfaceHTML renderers, so a Magento theme's
// brand shows in the exact same vocabulary as every other brand surface.
function pickMagentoTheme(i){
  const mg=PBRAND.data&&PBRAND.data.magento;if(!mg||!mg.themes[i])return;
  MTHEME=i;
  document.querySelectorAll(".mtheme-btn").forEach(b=>b.classList.toggle("primary",Number(b.dataset.i)===i));
  const t=mg.themes[i],panel=document.getElementById("mtheme_panel");if(!panel)return;
  const meta=[
    t.parent?`parent <code>${esc(t.parent)}</code>`:"",
    t.fallback?`<span class="tag warn">brand inherited from parent</span>`:"",
    t.isLuma?`<span class="tag dim">Luma: the on-disk default</span>`:""
  ].filter(Boolean).join(" · ");
  const roles=[["brand",t.roles.brand],["accent",t.roles.accent],["success",t.roles.success],["warning",t.roles.warning],["destructive",t.roles.destructive]];
  const scales=roles.map(([n,s])=>scaleHTML(n,s)).filter(Boolean).join("");
  const hasSurface=t.surface&&(t.surface.background||t.surface.foreground||t.surface.card||t.surface.border);
  const body=(scales||hasSurface)
    ?`${scales}${hasSurface?surfaceHTML("Surface",t.surface):""}`
    :`<p class="muted" style="font-size:12.5px;margin:0">No brand Less vars resolved for this theme.</p>`;
  panel.innerHTML=`<div class="muted" style="font-size:12px;margin:0 0 8px">${esc(t.path)}${meta?" · "+meta:""}</div>${body}`;
}
let pbTimer=null;
function pbSeed(k,v){
  PBRAND[k]=v.trim();
  const pc=document.getElementById(k==="primary"?"pb_pc":"pb_ac");
  const pt=document.getElementById(k==="primary"?"pb_pt":"pb_at");
  if(hexOK(v)){if(pc&&pc.value.toLowerCase()!==v.toLowerCase())pc.value=v;if(pt&&document.activeElement!==pt)pt.value=v;}
  clearTimeout(pbTimer);pbTimer=setTimeout(previewBrandProject,220);

// previewBrandProject shows the seed's generated theme live (Generate via the
// global preview path — never saves, never derives client-side) before the user
// commits it as this project's override.
async function previewBrandProject(){
  if(!hexOK(PBRAND.primary))return;
  if(PBRAND.accent&&!hexOK(PBRAND.accent))return;

/* Plugins tab */
async function pluginAction(body){
  try{const d=await apiJSON("/api/plugins",body);if(d&&d.ok===false)alert(d.error||"failed");}catch(e){alert(String(e));}

  // pages exist, so refresh both and rebuild the nav — a disabled plugin's tab and
  // its nav entry must vanish now, not on the next full refresh.
  await loadScreens();
  await loadPluginPages();

  // it rather than showing a stale, now-disabled surface.
  if(VIEW==="ppage"&&PPAGE&&!PLUGIN_PAGES.some(p=>p.id===PPAGE.id)){renderNav();return go("plugins");}
  if(VIEW==="project"&&PTAB&&PTAB.indexOf("screen:")===0){

}
// renderPluginsView is the top-level Plugins item, reusing the plugins panel.
function renderPluginsView(c){
  const head=pageHead("Plugins","Plugins add commands, wizard steps and per-project studio screens. Install from a folder or a git repository. keel reads the manifest and copies files, and never runs a plugin's code just to install it.");

function renderUpgradeBar(msg){

// loadPluginProblems reads the plugin rows and keeps the ones that failed to load
// (their row carries a Problem), so a failure is surfaced everywhere — not only on
// the Plugins page a user may never open. A plugin that does nothing because it
// failed to register is exactly the thing to tell someone about.
async function loadPluginProblems(){
  try{const d=await apiJSON("/api/plugins");const ps=(d&&d.plugins)||[];PLUGIN_PROBLEMS=ps.filter(p=>p.problem).map(p=>({name:p.name,problem:p.problem}));}
  catch(e){PLUGIN_PROBLEMS=[];}

}
// renderPluginProblemBanner shows a dismissible-to-Plugins banner when any plugin
// failed to load. It sits above the header like the upgrade bar, so it is visible
// from any view, and clicking it jumps to the Plugins page where the full reason
// and the fix live.
function renderPluginProblemBanner(){
  let el=document.getElementById("plugbar");
  if(!PLUGIN_PROBLEMS.length){if(el)el.remove();return;}
  if(!el){el=document.createElement("div");el.id="plugbar";el.className="plugbar";el.onclick=()=>go("plugins");document.getElementById("body").insertBefore(el,document.getElementById("head"));}
  const names=PLUGIN_PROBLEMS.map(p=>p.name).join(", ");
  el.textContent="⚠ "+PLUGIN_PROBLEMS.length+" plugin"+(PLUGIN_PROBLEMS.length>1?"s":"")+" failed to load ("+names+"). Click to see why";

async function renderPluginsTab(c,head){
  // GET /api/plugins returns {plugins:[…]} — unwrap it, or the list reads as an
  // object and renders nothing.
  let ps=[];try{const d=await apiJSON("/api/plugins");ps=(d&&d.plugins)||[];}catch(e){}
  c.innerHTML=head+`
    <div class="card">
      <div class="row" style="gap:8px">
        <input id="plugsrc" placeholder="./my-plugin  or  owner/repo" style="flex:1"/>
        <input id="plugref" placeholder="ref (optional)" style="width:140px"/>
        <button class="btn" id="plugadd">Install</button>
      </div>
      <div class="muted" style="font-size:12px;margin-top:8px">A folder path, a GitHub owner/repo, or any git URL.</div>
    </div>
    ${ps.length?ps.map(p=>pluginCard(p)).join(""):'<div class="muted">Nothing installed yet.</div>'}`;
  document.getElementById("plugadd").onclick=()=>{const src=document.getElementById("plugsrc").value.trim();if(!src)return;pluginAction({action:"add",source:src,ref:document.getElementById("plugref").value.trim()});};
  c.querySelectorAll("button[data-act]").forEach(b=>{b.onclick=()=>{const act=b.getAttribute("data-act"),name=b.getAttribute("data-name");if(act==="remove"&&!confirm("Remove "+name+"?"))return;pluginAction({action:act,name});};});
  // Per-capability grant/revoke — the /api/plugins action endpoint expects
  // {action:"grant"|"ungrant",name,cap}, matching handlePlugins' body fields.
  c.querySelectorAll("button[data-cap-act]").forEach(b=>{b.onclick=()=>{pluginAction({action:b.getAttribute("data-cap-act"),name:b.getAttribute("data-name"),cap:b.getAttribute("data-cap")});};});
}
// pluginProvenance is the honest one-liner about where a plugin came from — the
// #1 relabel: a bundled built-in is a SEPARATE COULLWORKS tool that ships inside
// keel (its own author/homepage), not something keel wrote; a first-party plugin
// is keel's own; a PATH one is an external executable. We never say "ships with
// keel", which blurred the distinction the bundled flag exists to make.
function pluginProvenance(p){
  const onPath=p.where!=="built-in"&&p.where!=="installed";
  if(p.bundled){
    const home=p.homepage?` · <a href="${esc(safeURL(p.homepage))}" target="_blank" rel="noopener">${esc(p.homepage)}</a>`:"";
    return `separate ${esc(p.author||"COULLWORKS")} tool bundled with keel${home}`;
  }
  if(p.builtIn)return "first-party keel plugin";
  if(p.where==="installed")return "installed plugin";
  if(onPath)return "found on your PATH";
  return "";
}
// capLabel is the human name of a capability, so a grant toggle reads as a power
// rather than a bare key. Unknown keys fall back to themselves.
function capLabel(cap){return ({net:"Network access",secrets:"Read secrets",exec:"Run shell commands"})[cap]||cap;}
// pluginCapsHTML draws the per-capability grant/revoke toggles for a plugin.
// Declared capabilities come from the manifest; the granted subset is the user's
// explicit consent. Trust is the prior gate — an untrusted plugin's grants are
// inert (capabilityGranted refuses every power without trust), so the toggles are
// shown disabled-with-reason until the plugin is trusted. A plugin that declares
// nothing (every built-in today) reads "no capabilities requested", which is the
// correct, honest state and not a gap.
function pluginCapsHTML(p){
  const declared=p.capabilities||[];
  if(!declared.length)return `<div class="muted" style="font-size:12px;margin-top:10px">No capabilities requested.</div>`;
  const granted=new Set(p.granted||[]);
  const gated=!p.trusted; // caps are moot until the plugin is trusted
  const rows=declared.map(cap=>{
    const on=granted.has(cap);
    const act=on?"ungrant":"grant";
    const btn=gated
      ? `<button class="btn sm" disabled title="Trust ${esc(p.name)} first. An untrusted plugin's capabilities are refused">Grant</button>`
      : `<button class="btn sm${on?'':' primary'}" data-cap-act="${act}" data-name="${esc(p.name)}" data-cap="${esc(cap)}">${on?"Revoke":"Grant"}</button>`;
    return `<div class="row" style="gap:8px;margin-top:6px">
      <span class="tag ${on&&!gated?'ok':'dim'}">${on&&!gated?"granted":"not granted"}</span>
      <span style="flex:1;font-size:12.5px"><b>${esc(capLabel(cap))}</b> <span class="muted">(${esc(cap)})</span></span>
      ${btn}
    </div>`;
  }).join("");
  return `<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px">
    <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px">Capabilities</div>
    ${gated?`<div class="muted" style="font-size:12px;margin-bottom:2px">Trust this plugin to grant any of these.</div>`:``}
    ${rows}
  </div>`;
}
// pluginCard draws one plugin row. Enable/Disable is offered for built-in AND
// installed plugins (both persist server-side); trust and remove stay
// installed-only. A disabled plugin dims and reads "disabled", and because a
// disabled plugin registers nothing, its screens/steps disappear on refresh.
function pluginCard(p){
  const onPath=p.where!=="built-in"&&p.where!=="installed";
  const whereTag=p.where==="built-in"?(p.bundled?"bundled tool":"built-in"):(p.where==="installed"?"installed":"on PATH");
  const disabled=!p.problem&&!p.enabled;
  const canToggle=!onPath; // built-ins and installed plugins both toggle
  return `
    <div class="card${disabled?' dim':''}"${disabled?' style="opacity:.62"':''}>
      <div class="row" style="width:100%">
        <span style="font-weight:600">${esc(p.name)}</span><span class="grow"></span>
        <span class="tag">${esc(p.version||"")}</span>
        <span class="tag">${esc(whereTag)}</span>
        <span class="tag ${p.enabled?'ok':'dim'}">${p.problem?"not loaded":(p.enabled?"enabled":"disabled")}</span>
        ${p.runsCode?`<span class="tag ${p.trusted?'ok':'warn'}">${p.trusted?"trusted":"untrusted"}</span>`:``}
      </div>
      <div class="muted" style="font-size:12px;margin-top:6px">${pluginProvenance(p)}</div>
      ${p.problem?`<div class="muted" style="margin-top:8px">not loaded: ${esc(p.problem)}</div>`:`<div class="muted" style="margin-top:8px">${esc(p.description||"")}</div>`}
      <div class="row" style="gap:8px;margin-top:10px">
        ${canToggle?`<button class="btn sm" data-act="${p.enabled?'disable':'enable'}" data-name="${esc(p.name)}">${p.enabled?"Disable":"Enable"}</button>`:``}
        ${p.where==="installed"&&p.runsCode?`<button class="btn sm" data-act="${p.trusted?'untrust':'trust'}" data-name="${esc(p.name)}">${p.trusted?"Untrust":"Trust"}</button>`:``}
        ${p.where==="installed"?`<button class="btn sm" data-act="remove" data-name="${esc(p.name)}">Remove</button>`:``}
        ${onPath?`<span class="muted" style="font-size:12px">external executable, manage it where it lives</span>`:``}
      </div>
      ${p.where==="installed"?pluginCapsHTML(p):``}
    </div>`;
}

/* ---------- PLUGIN SCREENS (Screener screens as per-project actions) ---------- */
// The backend serves the screens plugins register (/api/plugins/screens) and
// renders one for a project (/api/plugins/screen). A screen returns data, not
// markup, so the page draws it — a plugin cannot script into this page. Sonar's
// "Visibility" screen becomes a per-project action this way.
async function loadScreens(){try{const d=await apiJSON("/api/plugins/screens");SCREENS=d.screens||[];}catch(e){SCREENS=[];}}
// Open a plugin screen for a project: focus the project, then switch to its
// screen tab. Each plugin Screener screen is a per-project tab — this is what
// turns sonar's "Visibility" screen into a real per-project surface, not a dead
// endpoint. Used by the command palette; inside a focused project clickPTab
// handles the screen tab directly.
function openScreen(dir,id){
  focusProject(dir).then(()=>{const s=SCREENS.find(x=>x.id===id);if(s){renderProjTabs();clickPTab("screen:"+s.id);}});
}
async function renderScreen(c){
  if(!SCREEN){c.innerHTML='<div class="muted">Pick a plugin screen tab.</div>';return;}
  // A plugin that describes its choices as an OptionStepper schema (ai-core's
  // skills + rules) gets a live, checkable form instead of a read-only screen —
  // add/remove any skill or rule per project and it applies on the fly. Any other
  // screen stays the read-only Screener render.
  //
  // Gated on the ai-core screen id: /api/plugin-options is framework-wide, not
  // per-screen, so it returns ai-core's option schema whichever plugin screen is
  // open. Without this gate every screen tab (sonar's "Visibility") rendered
  // ai-core's form — the screen-routing collision. Each screen must render ITS OWN.
  if(SCREEN.id==="ai-core"&&await renderOptionForm(c))return;

  const sections=(d.sections||[]);

// The per-project interactive option form (ai-core's skills + rules). It fetches
// the OptionStepper schemas for this project's framework and the project's CURRENT
// selection, so every choice pre-checks from installed state (not the recommended
// defaults). Editing a checkbox stages the change; Apply reconciles — writing the
// newly chosen and REMOVING the no-longer chosen — the two-way sync the old
// read-only tab could never do. Returns true when it rendered a form (so the
// caller skips the read-only screen), false when the plugin has no schema here.
let AICORE={fw:null,schemas:[],picks:{}};
async function renderOptionForm(c){
  const fw=PROJ.framework;if(!fw)return false;

// Lighthouse colour bands, the one place the cutoffs live (0-49 poor / 50-89
// needs-work / 90-100 good) so every gauge reads the same and matches PSI.
function sonBand(n){n=Number(n)||0;return n>=90?"good":n>=50?"amber":"poor";}
function sonBandColor(n){return {good:"var(--green)",amber:"var(--yellow)",poor:"var(--red)"}[sonBand(n)];}
// sonRing draws a band-coloured SVG ring gauge with the number centred (inline
// SVG, no chart lib). size/stroke scale it for the top row vs the per-section mini.
function sonRing(score,size,stroke,cls){
  score=Math.max(0,Math.min(100,Number(score)||0));
  const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-score/100),col=sonBandColor(score);
  const num=cls==="son-mnum"?`<div class="${cls}" style="color:${col}">${score}</div>`
    :`<div class="son-num" style="color:${col}">${score}</div>`;
  return `<div class="${cls==="son-mnum"?"son-mini":"son-ring"}">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line2)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}"
        stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg>${num}</div>`;
}


/* ---------- toasts: command-execution notifications ----------
   A streamed command's detail lives in #term, but a collapsed console leaves no
   signal it ran or whether it worked. A toast is that signal: while a command
   streams it shows a sticky `running` toast (spinner), which is REPLACED IN PLACE
   (matched by id) by its ok/bad result once the `event: done` frame lands.
   Terminal toasts auto-dismiss; a manual × dismisses early. The .toast CSS
   already carries the running|ok|bad|info kinds, the .leaving exit and reduced-
   motion handling — this is only the behaviour. */
const TOAST_TTL=4500; // ms a terminal (ok/bad/info) toast lingers before it leaves
const toastIcon={running:'<span class="spin">◠</span>',ok:"✓",bad:"✗",info:"ℹ"};
let toastSeq=0;
// dismissToast plays the leaving animation then removes the node. Re-entrant-safe:
// a toast already leaving is left alone so its timer and a manual × don't double up.
function dismissToast(id){
  const el=document.getElementById(id);if(!el||el.classList.contains("leaving"))return;
  if(el._ttl){clearTimeout(el._ttl);el._ttl=null;}
  el.classList.add("leaving");
  const gone=()=>el.remove();
  el.addEventListener("animationend",gone,{once:true});
  // Fallback for reduced-motion (no animationend fires) and any missed event.
  setTimeout(gone,260);
}
// toast raises or updates a toast. `id` lets a running toast be replaced in place
// by its result (same node, new kind/message); a running toast is sticky, a
// terminal one auto-dismisses after TOAST_TTL. Returns the toast's id so a caller
// can update it later.
function toast(msg,opts){
  opts=opts||{};
  const kind=opts.kind||"info";
  const id=opts.id||("toast"+(++toastSeq));
  const host=document.getElementById("toasts");if(!host)return id;
  let el=document.getElementById(id);
  if(!el){
    el=document.createElement("div");el.id=id;host.appendChild(el);
  }else if(el._ttl){clearTimeout(el._ttl);el._ttl=null;} // reused: cancel a pending dismiss
  el.className="toast "+kind;
  el.classList.remove("leaving");
  el.innerHTML=`<span class="ti">${toastIcon[kind]||toastIcon.info}</span>`+
    `<span class="tmsg"></span>`+
    `<button class="tx" aria-label="dismiss" onclick="dismissToast('${id}')">×</button>`;
  el.querySelector(".tmsg").textContent=msg; // textContent: never render command output as HTML
  const sticky=opts.sticky||kind==="running";
  if(!sticky)el._ttl=setTimeout(()=>dismissToast(id),TOAST_TTL);
  return id;
}

/* ---------- collapsed-console activity badge ----------
   The drawer never fully hides — dragged to its minimum the term pane is only a
   sliver, so lines stream where they cannot be read. When that happens we pulse a
   badge on the term bar; revealing the pane (a bigger drawer) clears it. */
const TERM_MIN_VISIBLE=60; // px of #term below which streaming output is effectively hidden
function termCollapsed(){const t=document.getElementById("term");return !t||t.clientHeight<TERM_MIN_VISIBLE;}
function showTermActivity(on){
  const el=document.getElementById("termact");if(!el)return;
  el.classList.toggle("hidden",!on);
}
// Called on every streamed line: flag activity only while the pane is too small to
// read, and clear it the moment it is big enough to.
function noteTermActivity(){showTermActivity(termCollapsed());}
// Clearing when the drawer grows: the resize drag and any programmatic change both
// end up wider, so re-evaluate after a resize.
window.addEventListener("resize",()=>{if(!termCollapsed())showTermActivity(false);});

/* ---------- SSE streaming ---------- */
function clearTerm(){document.getElementById("term").innerHTML="";}
// TERM_MAX bounds how many lines the terminal keeps in the DOM. A long build or a
// chatty `keel run dev` can stream thousands of lines; unbounded, each one is a
// retained node and the tab's memory climbs until it janks. We keep the tail (the
// part a person reads) and drop the oldest.
const TERM_MAX=2000;
function termLine(line){
  const t=document.getElementById("term");let cls="";
  if(line.startsWith("✓"))cls="ok";else if(line.startsWith("✗"))cls="bad";
  else if(line.startsWith("→")||line.startsWith("$"))cls="cmd";else if(line.startsWith("keel "))cls="hd";
  const span=document.createElement("span");span.className=cls;span.textContent=line+"\n";
  t.appendChild(span);
  // Trim from the front once over the cap, so memory stays flat on a long stream.
  while(t.childNodes.length>TERM_MAX)t.removeChild(t.firstChild);
  t.scrollTop=t.scrollHeight;
}
let streamAbort=null;
function stopStream(){if(streamAbort){try{streamAbort.abort();}catch(e){}termLine("■ stopped");toast("Stopped",{kind:"info",id:"stream-toast"});}}
// streamLabel derives a human name for a streamed command, so a toast can say
// WHAT ran rather than echo a URL. A build carries {name}; an exec carries
// {args}, which reads best as the `keel …` line the user would have typed; the
// URL is the honest fallback.
function streamLabel(url,body){
  body=body||{};
  if(Array.isArray(body.args)&&body.args.length)return "keel "+body.args.join(" ");
  if(body.name&&/build/i.test(url))return "Building "+body.name;
  if(/build/i.test(url))return "Building";
  return url;
}
// revealConsole grows the drawer enough to read output — used when a command
// fails while the console is collapsed, so the detail the toast points at is
// actually visible.
function revealConsole(){
  const stage=document.getElementById("stage");if(!stage)return;
  const rect=stage.getBoundingClientRect();
  // Route through the single height writer so a programmatic reveal is clamped,
  // persisted and toggle-consistent like every other size change.
  setTermHeight(Math.max(200,Math.round(rect.height*0.4)));
}
async function stream(url,body){
  if(streamAbort){try{streamAbort.abort();}catch(e){}}
  const ac=new AbortController();streamAbort=ac;
  clearTerm();
  const dot=document.getElementById("termdot");dot.classList.add("live");
  document.getElementById("termstop").classList.remove("hidden");
  // A running toast is the collapsed-console signal that something is happening;
  // its stable id lets the ok/bad result replace it in place when done lands.
  const label=streamLabel(url,body);
  const tid="stream-toast";
  toast(label+"…",{kind:"running",id:tid});
  let consent=null,fin=null; // fin: the {ok,code,err} the `event: done` frame carries
  try{
    const res=await api(url,{method:"POST",body:JSON.stringify(body),signal:ac.signal});
    if(!res.ok){termLine("✗ "+res.status+" "+res.statusText);toast(label+" failed ("+res.status+")",{kind:"bad",id:tid});return null;}
    const reader=res.body.getReader();const dec=new TextDecoder();let buf="";
    for(;;){
      const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const frames=buf.split("\n\n");buf=frames.pop();
      for(const f of frames){
        if(f.startsWith("event: done")){
          // The done frame carries the real status: {ok,code,err}. Parse it (rather
          // than skipping it) so a collapsed console still gets a pass/fail toast.
          const m=f.match(/^data: ([\s\S]*)$/m);if(m){try{fin=JSON.parse(m[1]);}catch(e){}}
          continue;
        }
        if(f.startsWith("event: consent")){const m=f.match(/^data: ([\s\S]*)$/m);if(m){try{consent=JSON.parse(m[1]);}catch(e){}}continue;}
        const m=f.match(/^data: ([\s\S]*)$/m);if(m){termLine(m[1]);noteTermActivity();}
      }
    }
  }catch(e){if(e.name!=="AbortError"){termLine("✗ "+e);toast(label+" failed",{kind:"bad",id:tid});}}
  finally{
    if(streamAbort===ac){streamAbort=null;dot.classList.remove("live");document.getElementById("termstop").classList.add("hidden");}
    // Replace the running toast with the command's real outcome. A stream aborted
    // by the user (fin still null, streamAbort cleared elsewhere) leaves the
    // running toast to be superseded by the next stream's — no false "finished".
    if(fin){
      if(fin.ok){toast(label+" finished",{kind:"ok",id:tid});}
      else{
        const code=fin.code?" (exit "+fin.code+")":"";
        const why=fin.err?": "+fin.err:"";
        toast(label+" failed"+code+why,{kind:"bad",id:tid});
        if(termCollapsed())revealConsole(); // surface the detail the toast points at
      }
    }
    // A stream can change on-disk state (a build, an add, a start): refresh the
    // live surface so the rail/header/tab reflect it.
    if(VIEW==="home")renderRail();
    else if(VIEW==="project"&&PROJ){renderProjHeader();}
  }
  return consent;
}

// openPTab focuses a project then opens one of its tabs — the palette's way into
// a project-scoped action.
function openPTab(dir,tab){focusProject(dir).then(()=>{renderProjTabs();setPTab(tab);});}
function openPalette(){PAL=palCommands();palSel=0;document.getElementById("palette").classList.add("open");const i=document.getElementById("palinput");i.value="";palRender();i.focus();}
function closePalette(){document.getElementById("palette").classList.remove("open");}
function palFilter(){palSel=0;palRender();}
function fuzzy(q,s){q=q.toLowerCase();s=s.toLowerCase();if(!q)return true;let i=0;for(const ch of s){if(ch===q[i])i++;if(i===q.length)return true;}return false;}
function palRender(){
  const q=document.getElementById("palinput").value;
  const items=PAL.filter(c=>fuzzy(q,c.label)||fuzzy(q,c.sub||""));
  PAL._view=items;
  document.getElementById("pallist").innerHTML=items.map((c,i)=>`<div class="palrow ${i===palSel?"sel":""}" onclick="palRun(${i})"><span class="g">${esc(c.g)}</span><span>${esc(c.label)}</span>${c.sub?`<span class="sub">${esc(c.sub)}</span>`:""}</div>`).join("")||'<div class="palrow">no matches</div>';
  const sel=document.querySelector("#pallist .palrow.sel");if(sel)sel.scrollIntoView({block:"nearest"});
}
function palRun(i){const c=(PAL._view||[])[i];if(c){closePalette();c.run();}}
function palKey(e){
  const n=(PAL._view||[]).length;
  if(e.key==="ArrowDown"){palSel=(palSel+1)%n;palRender();e.preventDefault();}
  else if(e.key==="ArrowUp"){palSel=(palSel-1+n)%n;palRender();e.preventDefault();}

}
window.addEventListener("keydown",e=>{

/* ---------- console drawer: toggle + resize (never vanishes) ----------
   The console has exactly two ways to change size — the header toggle and the
   dragbar — and both funnel through setTermHeight, so its height is always a
   single, clamped, persisted value. The floor is TERM_CLOSED_PX (the term bar
   stays visible and the toggle can always reopen it): dragging DOWN collapses to
   that thin bar, it never disappears to an unrecoverable zero. #content stays
   `overflow:auto;min-height:0` at every height, so a collapsed OR a huge console
   always leaves the page scrollable — the grid row is bounded to the stage. */
const TERM_CLOSED_PX=36;        // just the term bar — the closed, still-reopenable state
const TERM_DEFAULT_FRAC=0.24;   // the sensible open height (matches --termH:24%)
const TERM_MIN_OPEN_PX=120;     // an "open" console is at least this tall
let lastOpenTermPx=0;           // remembers the height to restore when reopening
// termMaxPx keeps the console bounded so #content can never be squeezed below a
// scrollable minimum — the drag/huge-console guard.
function termMaxPx(){const s=document.getElementById("stage");return Math.max(TERM_MIN_OPEN_PX,(s?s.getBoundingClientRect().height:600)-140);}
function currentTermPx(){
  const s=document.getElementById("stage");if(!s)return 0;
  const rows=(s.style.gridTemplateRows||"").split(/\s+/);
  const last=rows[rows.length-1]||"";const n=parseFloat(last);
  if(!isNaN(n)&&/px$/.test(last))return n;
  // Not yet set to px (initial %/var): measure the console element directly.
  const c=document.getElementById("console");return c?c.getBoundingClientRect().height:0;
}
// setTermHeight is the ONE writer of the drawer height. It clamps to
// [TERM_CLOSED_PX, termMaxPx] so the console can neither vanish nor crush the
// content pane, records the last OPEN height, and persists the state so it
// survives navigation.
function setTermHeight(px,persist){
  const stage=document.getElementById("stage");if(!stage)return;
  px=Math.max(TERM_CLOSED_PX,Math.min(px,termMaxPx()));
  stage.style.gridTemplateRows=`1fr auto ${px}px`;
  const closed=px<=TERM_CLOSED_PX+2;
  if(!closed)lastOpenTermPx=px;
  const tog=document.getElementById("consoletoggle");
  if(tog)tog.classList.toggle("on",!closed);
  if(persist!==false){try{localStorage.setItem("keel.termClosed",closed?"1":"0");if(!closed)localStorage.setItem("keel.termPx",String(Math.round(px)));}catch(e){}}
  // Revealing the pane clears the collapsed-activity badge.
  if(!termCollapsed())showTermActivity(false);
}
// toggleConsole flips open<->closed from the header button, so a closed console
// is ALWAYS reopenable. Opening restores the last open height (or the default);
// closing collapses to the thin, still-visible bar.
function toggleConsole(){
  if(currentTermPx()<=TERM_CLOSED_PX+2)openConsole();
  else setTermHeight(TERM_CLOSED_PX);
}
function openConsole(){
  const stage=document.getElementById("stage");
  const def=stage?Math.round(stage.getBoundingClientRect().height*TERM_DEFAULT_FRAC):200;
  setTermHeight(lastOpenTermPx||def);
}
// restoreConsole applies the persisted open/closed + height on first paint, so
// the drawer's state survives a reload/navigation.
function restoreConsole(){
  let closed="0",px=0;
  try{closed=localStorage.getItem("keel.termClosed")||"0";px=parseInt(localStorage.getItem("keel.termPx")||"0",10)||0;}catch(e){}
  const stage=document.getElementById("stage");
  const def=stage?Math.round(stage.getBoundingClientRect().height*TERM_DEFAULT_FRAC):200;
  lastOpenTermPx=px||def;
  if(closed==="1")setTermHeight(TERM_CLOSED_PX,false);
  else setTermHeight(lastOpenTermPx,false);
}
(function(){
  const bar=document.getElementById("dragbar"),stage=document.getElementById("stage");
  let dragging=false;
  bar.addEventListener("mousedown",e=>{dragging=true;e.preventDefault();document.body.style.userSelect="none";});
  window.addEventListener("mousemove",e=>{
    if(!dragging)return;
    const rect=stage.getBoundingClientRect();
    // Dragging DOWN (cursor toward the bottom) shrinks the drawer; setTermHeight's
    // clamp turns "dragged past the bottom" into the closed bar, never a vanish.
    setTermHeight(rect.bottom-e.clientY);
  });
  window.addEventListener("mouseup",()=>{if(dragging){dragging=false;document.body.style.userSelect="";}});
  // Keep the drawer within bounds when the window resizes (a smaller viewport must
  // not let a tall console crush #content below scrollable).
  window.addEventListener("resize",()=>{if(currentTermPx()>TERM_CLOSED_PX+2)setTermHeight(currentTermPx(),false);});
  restoreConsole();
})();

/* ---------- onboarding / edit defaults ---------- */
let OB={step:0,name:"",dir:"",hosting:"compose",hostingOptions:[]};
function frameworks(){return R.filter(r=>r.kind==="framework");}
function csv(s){return (s||"").split(",").map(x=>x.trim()).filter(Boolean);}
function seedSelFromProfile(){const fw=frameworks();const f=fw.find(x=>x.id===PROFILE.framework)||fw[0];if(!f)return;sel.lang=f.lang||"other";sel.framework=f.id;resetDeps();defaults();}
function obSteps(){
  const s=[{key:"name"},{key:"folder"},{key:"lang"},{key:"framework",title:"Default framework",single:true}];
  const fw=sel.framework;
  if(fw){
    s.push({key:"env",kind:"env",title:"Local dev environment",single:true});
    if(forFw(fw,"db").length)s.push({key:"db",kind:"db",title:"Database",single:true});
    if(forFw(fw,"frontend").length)s.push({key:"frontend",kind:"frontend",title:"Frontend",frontend:true});
    if(forFw(fw,"service").length)s.push({key:"service",kind:"service",title:"Services",multi:true});
    if(forFw(fw,"addon").length)s.push({key:"addon",kind:"addon",title:"Add-ons",multi:true});
    if(forFw(fw,"extra").length)s.push({key:"extra",kind:"extra",title:"Extras",multi:true});
  }
  s.push({key:"hosting"});return s;
}
function openOnboarding(){
  OB.step=0;OB.name=PROFILE.name||"";OB.dir=PROFILE.projects_dir||"";OB.hosting=PROFILE.hosting||"compose";OB.hostingOptions=PROFILE.hostingOptions||[];
  seedSelFromProfile();
  document.getElementById("obtitle").textContent=PROFILE.exists?"Edit your defaults":"Welcome to keel";
  document.getElementById("onboard").classList.add("open");obRender();
}
function obSelect(id,options,cur,onchange){return `<select id="${id}" onchange="${onchange}">${options.map(o=>`<option value="${esc(o.id||o.key)}" ${(o.id||o.key)===cur?"selected":""}>${esc(o.label)}</option>`).join("")}</select>`;}
function obChip(on,text,slug,call){return `<span class="opt ${on?'on':''}" onclick='${call}'>${iconImg(slug,20)}<span>${esc(text)}</span></span>`;}
function obChips(html){return `<div class="opts">${html}</div>`;}
function obChooseLang(l){sel.lang=l;sel.framework=null;resetDeps();obNext();}
function obChoose(key,id){sel[key]=id;if(key==="framework"){resetDeps();defaults();}obNext();}
function obChooseFrontend(id){sel.frontend=id;obNext();}
function obTog(k,id){toggle(k,id);obRender();}
function obRender(){
  const steps=obSteps();if(OB.step>=steps.length)OB.step=steps.length-1;
  const st=steps[OB.step],fw=sel.framework;
  document.getElementById("obstep").textContent=`Step ${OB.step+1} of ${steps.length}`;
  const b=document.getElementById("obbody");
  if(st.key==="name"){b.innerHTML=`<label>Your name</label><input id="obname" value="${esc(OB.name)}" placeholder="Ada Lovelace"><div class="hint">Stamped as the git author in projects keel scaffolds.</div>`;setTimeout(()=>document.getElementById("obname")?.focus(),40);}
  else if(st.key==="folder"){b.innerHTML=`<label>Default projects folder</label><input id="obdir" value="${esc(OB.dir)}" placeholder="~/code   (blank = current directory)"><div class="hint">Where <code>keel new</code> creates projects. <code>~</code> is expanded.</div>`;}
  else if(st.key==="lang"){b.innerHTML=`<label>Language</label>${obChips(LANGS.map(l=>obChip(sel.lang===l,label[l]||l,iconSlug(l),`obChooseLang(${jarg(l)})`)).join(""))}<div class="hint">The framework list filters to your language, same as Build.</div>`;}
  else if(st.key==="framework"){b.innerHTML=`<label>Default framework</label>${obChips(frameworksFor(sel.lang).map(f=>obChip(sel.framework===f.id,f.label,iconSlug(f),`obChoose(${jarg("framework")},${jarg(f.id)})`)).join(""))}<div class="hint">Pick one. The next steps adapt to it.</div>`;}
  else if(st.frontend){const none=obChip(!sel.frontend,"None","",`obChooseFrontend(null)`);b.innerHTML=`<label>${esc(st.title)}</label>${obChips([none,...forFw(fw,"frontend").map(e=>obChip(sel.frontend===e.id,e.label,iconSlug(e),`obChooseFrontend(${jarg(e.id)})`))].join(""))}`;}
  else if(st.single){b.innerHTML=`<label>${esc(st.title)}</label>${obChips(forFw(fw,st.kind).map(e=>obChip(sel[st.key]===e.id,e.label,iconSlug(e),`obChoose(${jarg(st.key)},${jarg(e.id)})`)).join(""))}`;}
  else if(st.multi){b.innerHTML=`<label>${esc(st.title)} <span class="muted" style="text-transform:none;letter-spacing:0">(pick any, then Next)</span></label>${obChips(forFw(fw,st.kind).map(e=>obChip(sel[st.key].includes(e.id),e.label,iconSlug(e),`obTog(${jarg(st.key)},${jarg(e.id)})`)).join(""))}`;}
  else if(st.key==="hosting"){b.innerHTML=`<label>Default hosting / deploy target</label>${obSelect("obhost",OB.hostingOptions,OB.hosting,"OB.hosting=this.value")}<div class="hint">Used by <code>keel deploy</code>. keel only generates deploy artifacts. It never calls a cloud API.</div>`;}
  const dots=`<div class="obdots">${steps.map((_,i)=>`<i class="${i<=OB.step?'on':''}"></i>`).join("")}</div>`;
  const last=OB.step===steps.length-1;
  document.getElementById("obnav").innerHTML=`
    <button class="btn ghost" ${OB.step===0?"disabled":""} onclick="obBack()">← Back</button>
    <button class="btn ghost" onclick="obSkip()" title="Use defaults, set later in Settings">Skip</button>
    <span class="grow"></span>${dots}<span class="grow"></span>
    <button class="btn primary" onclick="obNext()">${last?"Save":"Next →"}</button>`;
}
function obCapture(){const g=id=>document.getElementById(id);if(g("obname"))OB.name=g("obname").value.trim();if(g("obdir"))OB.dir=g("obdir").value.trim();}
function obBack(){obCapture();if(OB.step>0){OB.step--;obRender();}}
async function obCommit(){
  await api("/api/profile",{method:"POST",body:profileBody(OB.name,OB.dir,OB.hosting)});
  document.getElementById("onboard").classList.remove("open");
  PROFILE=await apiJSON("/api/profile");
  renderUpgradeBar(PROFILE.upgrade);
  buildStep=0;renderContent();
}
async function obNext(){obCapture();const steps=obSteps();if(OB.step<steps.length-1){OB.step++;obRender();return;}await obCommit();}
async function obSkip(){obCapture();await obCommit();}

/* ---------- hash router: URL <-> state, Back/Forward/refresh/deep-link ----------
   The studio had zero URL integration — Back was dead, refresh went home, a link
   could not point at a screen. This is a client-only hash router (no server
   change): serialise() turns the current state into a #/… hash, syncURL() pushes
   it, and applyRoute() drives the existing nav functions from a hash. The
   ROUTING guard stops the round trip (applyRoute → go/focusProject → syncURL →
   push) from looping. Routes:
     #/                     home (Projects)
     #/build   #/packs      #/settings   #/plugins   top-level views
     #/settings/<tab>       a settings sub-tab
     #/p/<enc-path>/<tab>   a focused project (or member) + its tab
     #/p/<enc-path>/screen/<id>   a plugin screen for a project           */
let ROUTING=false;                          // true while applyRoute drives state
// projectSlug picks the friendly URL segment for a focused project/member. A
// top-level project with a name that is unique among tracked projects serialises
// by that name (#/p/MyFamilyInfo) so the URL is human-readable and shareable.
// Anything that would not round-trip uniquely — a member, or a name shared by two
// projects — falls back to the encoded path, which applyRoute always resolves.
function projectSlug(){
  const name=PROJ&&PROJ.name;
  const parent=parentOf(PROJ);
  if(name&&!parent&&PROJECTS.filter(p=>p.name===name).length===1){
    return encodeURIComponent(name);
  }
  // A monorepo member serialises as parent:member — readable and shareable —
  // when the parent's name is unique among tracked projects, so it round-trips.
  // A non-unique parent name still falls back to the encoded path.
  if(name&&parent&&parent.name&&PROJECTS.filter(p=>p.name===parent.name).length===1){
    return encodeURIComponent(parent.name)+":"+encodeURIComponent(name);
  }
  return encodeURIComponent(PROJ.path);
}
// serialise turns the live VIEW/PROJ/PTAB/TAB into a hash.
function serialise(){
  if(VIEW==="project"&&PROJ){
    const base="#/p/"+projectSlug();
    if(PTAB&&PTAB.startsWith("screen:"))return base+"/screen/"+encodeURIComponent(PTAB.slice("screen:".length));
    return base+"/"+encodeURIComponent(PTAB||"overview");
  }
  if(VIEW==="settings"&&TAB.settings&&TAB.settings!=="profile")return "#/settings/"+encodeURIComponent(TAB.settings);
  if(VIEW==="ppage"&&PPAGE)return "#/extend/"+encodeURIComponent(PPAGE.id);
  if(VIEW==="home")return "#/";
  return "#/"+encodeURIComponent(VIEW);
}
// syncURL pushes the serialised state, unless applyRoute is currently driving it
// (then the URL already matches, so pushing would just double the history entry).
function syncURL(){
  if(ROUTING)return;
  const h=serialise();
  if(location.hash!==h)history.pushState({h},"",h);
}
// navTo pushes a hash and applies it — the imperative "go to this URL" entry a
// deep link or a programmatic jump uses.
function navTo(hash){if(location.hash!==hash)history.pushState({h:hash},"",hash);applyRoute(hash);}
// slugToPath resolves a #/p/<seg> segment to a project path. A segment that
// uniquely matches a tracked project's name (the friendly form serialise emits),
// or a member's name, resolves to that project's path; a non-unique name, or a
// segment that is already a path, is returned unchanged so encoded-path deep links
// and name collisions still resolve. It ensures PROJECTS is loaded first, so a
// cold deep link (refresh straight onto #/p/Name) resolves.
async function slugToPath(seg){
  if(!PROJECTS.length){try{await loadProjects();}catch(e){}}
  // A parent:member composite (a monorepo member) resolves within its named
  // parent — the friendly form projectSlug emits for a member.
  const colon=seg.indexOf(":");
  if(colon>0){
    const pn=seg.slice(0,colon),mn=seg.slice(colon+1);
    const parents=PROJECTS.filter(p=>p.name===pn);
    if(parents.length===1){
      const m=(parents[0].members||[]).find(x=>x.name===mn);
      if(m)return m.path;
    }
  }
  const tops=PROJECTS.filter(p=>p.name===seg);
  if(tops.length===1)return tops[0].path;                 // unique top-level name
  const members=[];
  for(const p of PROJECTS)for(const m of (p.members||[]))if(m.name===seg)members.push(m);
  if(!tops.length&&members.length===1)return members[0].path; // unique member name
  return seg;                                             // a path, or ambiguous → verbatim
}
// applyRoute drives the existing nav functions from a hash. It sets ROUTING so the
// nav functions it calls do not re-push the URL it is already applying.
async function applyRoute(hash){
  ROUTING=true;
  try{
    const raw=(hash||location.hash||"#/").replace(/^#\/?/,"");   // strip "#/"
    const parts=raw.split("/").filter(Boolean).map(decodeURIComponent);
    if(!parts.length){go("home");return;}
    if(parts[0]==="p"&&parts[1]){
      // parts[1] is a friendly name slug (#/p/MyFamilyInfo) or an encoded path
      // (legacy deep links, members, name collisions). Resolve a unique name to
      // its path first; otherwise treat the segment as the path verbatim so every
      // form still round-trips.
      const path=await slugToPath(parts[1]);
      await focusProject(path);
      if(!PROJ||PROJ.path!==path){return;}          // not tracked — focusProject stayed put
      if(parts[2]==="screen"&&parts[3]){
        renderProjTabs();clickPTab("screen:"+parts[3]);
      }else if(parts[2]){
        renderProjTabs();setPTab(parts[2]);
      }
      return;
    }
    if(parts[0]==="extend"&&parts[1]){
      openPluginPage(parts[1]);
      if(VIEW!=="ppage")go("home");   // page no longer exists — fall back home
      return;
    }
    const view=parts[0];
    if(["home","build","packs","settings","plugins"].includes(view)){
      go(view);
      if(view==="settings"&&parts[1]){setTab(parts[1]);}
    }else{
      go("home");
    }
  }finally{ROUTING=false;}
}
window.addEventListener("popstate",()=>applyRoute(location.hash));

/* ---------- boot ---------- */
async function boot(){
  try{
    const rec=await apiJSON("/api/recipes");
    R=rec.recipes||[];LANGS=rec.languages||[];
    if(LANGS.length)sel.lang=LANGS[0];
    document.getElementById("recstat").textContent=R.length+" recipes · zero telemetry";
    PROFILE=await apiJSON("/api/profile");
    if(PROFILE.upgrade)renderUpgradeBar(PROFILE.upgrade);
    await loadScreens();
    await loadPluginPages();
    loadPluginProblems();      // async — surfaces the failure banner when it lands
    await loadProjects();
    renderNav();
    // Boot from the URL: a refresh or a shared deep link lands where it points,
    // not always on home. An empty/"#/" hash resolves to home just the same.
    if(location.hash&&location.hash!=="#/"&&location.hash!=="#"){
      await applyRoute(location.hash);
    }else{
      renderCrumbs();renderContent();
    }
    if(!PROFILE.exists)openOnboarding();
  }catch(e){document.getElementById("content").innerHTML=`<div class="err">${esc(e)}</div>`;}
}
boot();
</script>
