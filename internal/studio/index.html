<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>keel studio</title>
<!-- This session's API token, substituted by the server when the page is served.
     Every /api/ call must send it as X-Keel-Token, so no other page can drive
     keel: a custom header forces a CORS preflight the studio never answers. -->
<meta name="keel-token" content="__KEEL_SESSION_TOKEN__" />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<style>
  :root{
    --bg:#0d0f14;--bg2:#0a0c11;--panel:#151922;--panel2:#11141b;--panel3:#1a1f2b;
    --line:#222734;--line2:#2c3342;--line3:#39435a;
    --dim:#7f8798;--dim2:#5b6474;--head:#e8ecf4;--headSoft:#c3cad7;
    --orange:#ff6a2c;--orangeSoft:rgba(255,106,44,.13);--orangeLine:rgba(255,106,44,.42);
    --green:#4ade80;--red:#f87171;--blue:#5aa2f5;--yellow:#eab34a;
    --termH:24%;
    /* spacing scale — one rhythm for every gap/pad, so the wizard and generate
       lay out on the same grid instead of ad-hoc pixel values */
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:36px;
    /* radius scale — one set of corner radii */
    --r-sm:6px;--r:10px;--r-lg:14px;--r-pill:999px;
    /* legacy alias so existing rules that still say var(--radius) keep working */
    --radius:var(--r);
    /* type scale */
    --t-xs:11px;--t-sm:12.5px;--t-md:14px;--t-lg:16px;--t-xl:21px;
    /* motion */
    --dur:.13s;--dur-lg:.28s;--ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font:14.5px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 700px at 78% -12%,#141a26 0%,var(--bg) 60%);color:var(--head);overflow:hidden;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#20263200;border:3px solid transparent;background-clip:padding-box}
  *:hover::-webkit-scrollbar-thumb{background:#2a3140;border:3px solid transparent;background-clip:padding-box;border-radius:8px}
  .hidden{display:none!important}

  /* ---------- app shell: sidebar + header + content + console ---------- */
  #app{height:100vh;display:grid;grid-template-columns:236px 1fr;grid-template-rows:1fr;grid-template-areas:"nav body"}
  #nav{grid-area:nav;background:linear-gradient(180deg,var(--panel2),var(--bg2));border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0}
  #body{grid-area:body;min-width:0;min-height:0;display:grid;grid-template-rows:58px 1fr}

  /* sidebar brand */
  .brand{display:flex;align-items:center;gap:11px;padding:17px 18px 15px}
  .brand img{width:30px;height:30px;border-radius:8px;flex:none}
  .brand b{font-size:17px;letter-spacing:.2px}
  .brand b span{color:var(--orange)}
  .brand small{display:block;color:var(--dim2);font-size:10.5px;letter-spacing:.4px;margin-top:1px}

  /* sidebar sections + nav items */
  .navscroll{flex:1;overflow:auto;padding:6px 10px 10px}
  .navcap{color:var(--dim2);font-size:10px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;padding:14px 12px 6px}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--dim);cursor:pointer;
    user-select:none;font-size:13.5px;position:relative;transition:background .13s,color .13s}
  .navitem .g{width:20px;text-align:center;font-size:15px;opacity:.9;flex:none}
  .navitem .kbd{margin-left:auto;font:10.5px ui-monospace,monospace;color:var(--dim2);border:1px solid var(--line2);border-radius:5px;padding:0 5px;opacity:0;transition:opacity .13s}
  .navitem:hover{background:#181d27;color:var(--headSoft)}
  .navitem:hover .kbd{opacity:1}
  .navitem.on{background:var(--orangeSoft);color:#fff}
  .navitem.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}

  .navpinned{padding:6px 10px 8px;border-top:1px solid var(--line)}
  .navfoot{border-top:1px solid var(--line);padding:11px 14px;display:flex;flex-direction:column;gap:8px}
  .navfoot .stat{display:flex;align-items:center;gap:7px;color:var(--dim2);font-size:11.5px}
  .navfoot .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green)}
  .navfoot a.support{display:flex;align-items:center;gap:7px;justify-content:center;color:#fff;text-decoration:none;
    border:1px solid var(--orangeLine);background:var(--orangeSoft);padding:6px 10px;border-radius:8px;font-size:12px}
  .navfoot a.support:hover{background:rgba(255,106,44,.2)}
  /* powered-by credit: links the studio back to coullworks.com, in the wordmark
     style (COULL in the head colour, WORKS in keel orange). */
  .navfoot a.pb{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--dim2);text-decoration:none}
  .navfoot a.pb:hover{color:var(--headSoft)}
  .navfoot a.pb b{font-weight:800;letter-spacing:.6px;color:var(--head)}
  .navfoot a.pb b i{font-style:normal;color:var(--orange)}

  /* Responsive sidebar. It was a fixed 236px, so a narrow window squeezed the
     content and truncated the header title with nowhere to go. It now narrows in
     steps and, on a small window, collapses to an icon rail (labels drop, glyphs
     stay; every nav item carries a title tooltip so the rail is still legible).
     A desktop tool, so this is a graceful narrowing, not a mobile rebuild. */
  @media(max-width:860px){
    #app{grid-template-columns:196px 1fr}
    .brand{padding:15px 14px 13px;gap:9px}
    .brand img{width:26px;height:26px}
    .brand b{font-size:15px}
    .navitem{padding:8px 10px;font-size:13px}
    #content{padding:18px 16px}
    #head{padding:0 16px}
  }
  @media(max-width:620px){
    #app{grid-template-columns:64px 1fr}
    .brand{justify-content:center;padding:14px 0 12px;gap:0}
    .brand>div{display:none}
    .navcap{display:none}
    .navitem{justify-content:center;padding:10px 0;gap:0}
    .navitem>span:not(.g){display:none}
    .navitem .kbd{display:none}
    .navpinned{padding:6px 6px 8px}
    .navfoot{display:none}
    #content{padding:14px 12px}
    #head{padding:0 12px}
  }

  /* header: breadcrumbs + palette hint + actions */
  #head{grid-row:1;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(21,25,34,.9),rgba(17,20,27,.7));backdrop-filter:blur(6px)}
  .crumbs{display:flex;align-items:center;gap:8px;font-size:13.5px;min-width:0;overflow:hidden}
  .crumbs .c{color:var(--dim);white-space:nowrap}
  .crumbs .c.here{color:var(--head);font-weight:600}
  .crumbs .c.link{cursor:pointer}
  .crumbs .c.link:hover{color:var(--headSoft)}
  .crumbs .sep{color:var(--dim2);font-size:11px}
  #head .grow{flex:1}
  .kbtn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);border:1px solid var(--line2);
    background:var(--panel);border-radius:8px;padding:6px 11px}
  .kbtn:hover{border-color:var(--line3);color:var(--headSoft)}
  .kbtn.on{border-color:var(--orangeLine);color:#fff;background:var(--orangeSoft)}
  .kbtn kbd{font:11px ui-monospace,monospace;color:var(--dim);border:1px solid var(--line2);border-radius:4px;padding:0 5px;background:var(--bg2)}

  /* the body splits into content + a resizable console drawer */
  #stage{grid-row:2;min-height:0;display:grid;grid-template-rows:1fr auto var(--termH)}
  #content{min-height:0;overflow:auto;padding:24px 28px}
  #dragbar{height:5px;cursor:row-resize;background:transparent;position:relative}
  #dragbar::after{content:"";position:absolute;left:0;right:0;top:2px;height:1px;background:var(--line)}
  #dragbar:hover::after{background:var(--line3)}

  /* console drawer */
  #console{min-height:0;display:grid;grid-template-rows:auto 1fr;background:var(--bg2);border-top:1px solid var(--line)}
  #termbar{display:flex;align-items:center;gap:10px;padding:7px 16px;background:var(--panel2);font-size:12px;color:var(--dim)}
  #termbar .tdot{width:8px;height:8px;border-radius:50%;background:#39435a;transition:.2s}
  #termbar .tdot.live{background:var(--green);box-shadow:0 0 9px var(--green);animation:pulse 1.3s infinite}
  @keyframes pulse{50%{opacity:.5}}
  #termbar b{color:var(--headSoft);font-weight:600;font-size:12px}
  #termbar .grow{flex:1}
  #termbar .tbtn{padding:3px 10px;border:1px solid var(--line2);background:transparent;color:var(--dim);border-radius:6px;font-size:11.5px}
  #termbar .tbtn:hover{border-color:var(--line3);color:var(--headSoft)}
  #termbar .tbtn.stop{color:var(--red);border-color:rgba(248,113,113,.3)}
  #term{overflow:auto;background:var(--bg2);font:12.5px/1.6 ui-monospace,"SF Mono",Menlo,monospace;
    padding:12px 16px;white-space:pre-wrap;word-break:break-word;color:#cbd2e0}
  #term .ok{color:var(--green)} #term .bad{color:var(--red)} #term .cmd{color:var(--orange)} #term .hd{color:var(--blue)}

  /* ---------- toasts (top-right, non-intrusive command notifications) ----------
     A command streams into #term, but a collapsed console leaves the user with no
     signal it ran or whether it worked. Toasts are that signal: a running toast
     while it streams, replaced in place by its ok/bad result. Kinds map to the
     same accent palette as the console (green ok, red bad, orange live). */
  #toasts{position:fixed;top:14px;right:14px;z-index:60;display:flex;flex-direction:column;gap:8px;
    max-width:min(360px,calc(100vw - 28px));pointer-events:none}
  .toast{pointer-events:auto;display:flex;align-items:flex-start;gap:9px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel3),var(--panel));
    box-shadow:0 8px 26px rgba(0,0,0,.4);font-size:12.5px;color:var(--headSoft);
    animation:toastIn .18s var(--ease) both}
  .toast .ti{flex:none;width:16px;text-align:center;font-size:13px;line-height:1.3}
  .toast .tmsg{flex:1;min-width:0;line-height:1.4;word-break:break-word}
  .toast .tx{flex:none;color:var(--dim2);cursor:pointer;background:none;border:none;font-size:14px;line-height:1;padding:0 0 0 4px}
  .toast .tx:hover{color:var(--headSoft)}
  .toast.running{border-color:var(--orangeLine)} .toast.running .ti{color:var(--orange)}
  .toast.ok{border-color:rgba(74,222,128,.4)} .toast.ok .ti{color:var(--green)}
  .toast.bad{border-color:rgba(248,113,113,.4)} .toast.bad .ti{color:var(--red)}
  .toast.info .ti{color:var(--blue)}
  .toast.leaving{animation:toastOut .18s var(--ease) both}
  .toast .spin{display:inline-block;animation:spin 1s linear infinite}
  @keyframes toastIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
  @keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateX(12px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* Reduced motion: no slide/spin, just show/hide. */
  @media(prefers-reduced-motion:reduce){.toast,.toast.leaving{animation:none}.toast .spin{animation:none}}
  /* the console/term bar activity badge: a subtle pulse when lines arrive while
     the console drawer is collapsed, so the user knows something is happening. */
  #termbar .tact{flex:none;font-size:10.5px;color:var(--orange);border:1px solid var(--orangeLine);
    background:var(--orangeSoft);border-radius:999px;padding:1px 7px;animation:pulse 1.3s infinite}
  #termbar .tact.hidden{display:none}

  /* ---------- page furniture ---------- */
  h1.page{font-size:21px;font-weight:650;letter-spacing:-.2px;margin:0 0 4px}
  p.lede{color:var(--dim);font-size:13px;margin:0 0 20px;max-width:64ch}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--dim);margin:0 0 14px}
  h3{margin:0 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
  .muted{color:var(--dim)} .softmuted{color:var(--dim2)}
  .row{display:flex;gap:10px;align-items:center}
  code{font:12px ui-monospace,monospace;background:var(--panel3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--headSoft)}

  /* tab strip (area -> resource -> tabs) */
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 22px}
  .tab{padding:9px 15px;color:var(--dim);cursor:pointer;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;user-select:none;transition:color .13s}
  .tab:hover{color:var(--headSoft)}
  .tab.on{color:#fff;border-bottom-color:var(--orange)}

  input,textarea,select{font:inherit;background:var(--panel);border:1px solid var(--line2);color:var(--head);border-radius:var(--r-sm);padding:var(--s2) 11px;width:100%;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--line3)}
  input:focus-visible,textarea:focus-visible,select:focus-visible{border-color:var(--orange);box-shadow:0 0 0 3px var(--orangeSoft)}
  textarea{font:13px/1.6 ui-monospace,Menlo,monospace;resize:vertical;min-height:76px}
  .btn{background:var(--panel);border:1px solid var(--line2);color:var(--head);border-radius:var(--r-sm);padding:var(--s2) 14px;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),filter var(--dur) var(--ease);white-space:nowrap}
  .btn:hover{border-color:var(--line3)}
  .btn:focus-visible{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orangeSoft)}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#180d06;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 11px;font-size:var(--t-sm)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .chk{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:13px;user-select:none}

  .card{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--panel),var(--panel2));padding:var(--s4) 18px;margin-bottom:var(--s4)}

  /* ---------- design-system primitives (shared by the wizard AND generate) ----------
     ONE system: an accordion (numbered steps), a real single-select radio list, a
     multi-select checkbox list, and an add-row. The .opt pill is retired for
     selection (it survives only as a passive chip in a couple of read-only spots). */

  /* accordion: a numbered badge + title + collapsed summary + chevron, states
     open/done/locked; pure-CSS grid-template-rows 0fr→1fr expand (animatable). */
  .acc{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--panel),var(--panel2));margin-bottom:var(--s3);overflow:hidden;transition:border-color var(--dur) var(--ease)}
  .acc.open{border-color:var(--line3)}
  .acc.locked{opacity:.5}
  .acc-h{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);cursor:pointer;user-select:none}
  .acc.locked .acc-h{cursor:not-allowed}
  .acc-h:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--orangeLine)}
  .acc-badge{width:24px;height:24px;flex:none;border-radius:var(--r-pill);border:1px solid var(--line2);color:var(--dim);
    display:flex;align-items:center;justify-content:center;font-size:var(--t-xs);font-weight:700;transition:.15s var(--ease)}
  .acc.open .acc-badge{border-color:var(--orange);color:var(--orange);background:var(--orangeSoft)}
  .acc.done .acc-badge{border-color:var(--green);color:#0f1218;background:var(--green)}
  .acc-t{flex:1;min-width:0}
  .acc-t b{display:block;font-size:var(--t-md);font-weight:600;letter-spacing:-.1px}
  .acc-t small{display:block;color:var(--dim);font-size:var(--t-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .acc-chev{color:var(--dim2);font-size:12px;transition:transform var(--dur-lg) var(--ease);flex:none}
  .acc.open .acc-chev{transform:rotate(90deg)}
  .acc-body-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--dur-lg) var(--ease)}
  .acc.open .acc-body-wrap{grid-template-rows:1fr}
  .acc-body-inner{overflow:hidden;min-height:0}
  .acc-body{padding:0 var(--s4) var(--s4);border-top:1px solid var(--line)}
  @media(prefers-reduced-motion:reduce){.acc-body-wrap,.acc-chev,.acc-badge{transition:none}}

  /* single-select radio list: a real radio dot + optional icon, one row per choice */
  .rlist{display:flex;flex-direction:column;gap:var(--s2)}
  .ritem{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 13px;border:1px solid var(--line2);border-radius:var(--r-sm);
    background:var(--panel);cursor:pointer;user-select:none;transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
  .ritem:hover{border-color:var(--line3)}
  .ritem:focus-visible{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orangeSoft)}
  .ritem.on{border-color:var(--orange);background:var(--orangeSoft)}
  .ritem .dot{width:16px;height:16px;flex:none;border-radius:var(--r-pill);border:2px solid var(--line3);position:relative;transition:border-color var(--dur) var(--ease)}
  .ritem.on .dot{border-color:var(--orange)}
  .ritem.on .dot::after{content:"";position:absolute;inset:2px;border-radius:var(--r-pill);background:var(--orange)}
  .ritem .rl{flex:1;min-width:0}
  .ritem .rl b{font-size:var(--t-md);font-weight:500}
  .ritem.on .rl b{color:#fff}
  .ritem .rl small{display:block;color:var(--dim);font-size:var(--t-xs)}

  /* multi-select checkbox list, with category subheads + a filter */
  .mfilter{margin:0 0 var(--s3)}
  .msub{color:var(--dim2);font-size:10px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;padding:var(--s3) 0 var(--s2)}
  .mlist{display:flex;flex-direction:column;gap:var(--s2)}
  .mitem{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) 13px;border:1px solid var(--line2);border-radius:var(--r-sm);
    background:var(--panel);cursor:pointer;user-select:none;transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
  .mitem:hover{border-color:var(--line3)}
  .mitem:focus-visible{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orangeSoft)}
  .mitem.on{border-color:var(--orange);background:var(--orangeSoft)}
  .mitem .box{width:16px;height:16px;flex:none;border-radius:4px;border:2px solid var(--line3);position:relative;transition:.12s var(--ease)}
  .mitem.on .box{border-color:var(--orange);background:var(--orange)}
  .mitem.on .box::after{content:"✓";position:absolute;inset:-2px 0 0;color:#180d06;font-size:12px;font-weight:800;text-align:center;line-height:16px}
  .mitem .ml{flex:1;min-width:0}
  .mitem .ml b{font-size:var(--t-md);font-weight:500}
  .mitem.on .ml b{color:#fff}
  .mitem .ml small{display:block;color:var(--dim);font-size:var(--t-xs)}

  /* shared add-row: a list of staged instances (edit/duplicate/remove) + an add button */
  .marows{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s3)}
  .marow{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--panel2)}
  .marow .ma-name{flex:1;min-width:0;font-size:var(--t-md)}
  .marow .ma-name b{font-weight:600}
  .marow .ma-name small{color:var(--dim);font-size:var(--t-xs);margin-left:6px}
  .marow .ma-acts{display:flex;gap:var(--s1)}
  .ma-add{display:inline-flex;align-items:center;gap:6px;padding:var(--s2) var(--s3);border:1px dashed var(--line3);border-radius:var(--r-sm);
    background:transparent;color:var(--dim);cursor:pointer;font-size:var(--t-sm);transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease);width:100%}
  .ma-add:hover{border-color:var(--orange);color:var(--headSoft)}
  .ma-add:focus-visible{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orangeSoft)}
  .ma-empty{color:var(--dim);font-size:var(--t-sm);padding:var(--s2) 0}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .tag.ok{color:var(--green);border-color:rgba(74,222,128,.4)}
  .tag.warn{color:var(--yellow);border-color:rgba(234,179,74,.4)}
  .tag.dim{color:var(--dim2)}

  pre{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;overflow:auto;font:12.5px/1.6 ui-monospace,Menlo,monospace;color:#cdd3df;margin:0}
  .err{color:var(--red);padding:11px 13px;border:1px solid rgba(248,113,113,.3);border-radius:10px;background:rgba(248,113,113,.08)}

  /* build wizard */
  .wrap2{display:grid;grid-template-columns:1fr 360px;gap:0;height:100%}
  .colL{overflow:auto;padding-right:24px;border-right:1px solid var(--line)}
  .colR{overflow:auto;padding-left:24px}
  .step{margin-bottom:var(--s5)}
  .opts{display:flex;flex-wrap:wrap;gap:var(--s2)}
  /* .opt is retired as a SELECTION control (rlist/mlist/acc replace it); it stays
     only as a passive chip — a quick-jump link or a read-only recipe/screen tag. */
  .opt{display:flex;align-items:center;gap:9px;padding:var(--s2) 13px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--panel);cursor:pointer;user-select:none;transition:border-color var(--dur) var(--ease);font-size:var(--t-md)}
  .opt:hover{border-color:var(--line3)}
  .opt.on{border-color:var(--orange);background:var(--orangeSoft);color:#fff}
  .opt .ic{width:22px;height:22px;flex:none}
  .opt small{display:block;color:var(--dim);font-size:var(--t-xs)}

  /* Intent-grouped project actions (Develop / Configure / Ship / Plugins): a real
     list of actions per group, replacing the flat .opt pill strip. */
  .actgroup h3{font-size:var(--t-sm);text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
  .arows{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--s2)}
  .arow{display:flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid var(--line2);border-radius:var(--r-sm);
    background:var(--panel);cursor:pointer;user-select:none;transition:border-color var(--dur) var(--ease)}
  .arow:hover{border-color:var(--line3)}
  .arow:focus-visible{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--orangeSoft)}
  .arow .ag{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--panel3);color:var(--orange);font-size:15px}
  .arow .al{display:flex;flex-direction:column;min-width:0}
  .arow .al b{font-size:var(--t-md);font-weight:600}
  .arow .al small{color:var(--dim);font-size:var(--t-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .crabpen{position:relative;height:150px;overflow:hidden;margin:24px 0 8px}
  .crab{position:absolute;bottom:0;width:130px;height:130px;left:0;
    animation:scuttle 7s cubic-bezier(.37,0,.63,1) infinite, bob .5s ease-in-out infinite alternate}
  @keyframes scuttle{0%{left:2%;transform:scaleX(1)}46%{left:calc(100% - 132px);transform:scaleX(1)}50%{left:calc(100% - 132px);transform:scaleX(-1)}96%{left:2%;transform:scaleX(-1)}100%{left:2%;transform:scaleX(1)}}
  @keyframes bob{from{margin-bottom:0}to{margin-bottom:9px}}
  @media(prefers-reduced-motion:reduce){.crab{animation:none;left:calc(50% - 65px)}}

  .graph{display:flex;flex-direction:column;align-items:center;margin:6px 0 18px}
  .grow-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .gnode{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);padding:7px 11px}
  .gnode img{width:20px;height:20px;flex:none}
  .gnode b{font-size:13px}
  .gnode small{display:block;color:var(--dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.6px}
  .gnode.app{border-color:var(--orange);background:rgba(255,106,44,.1)}
  .gnode.fe{border-color:var(--blue)}
  .gconn{width:2px;height:16px;background:var(--line2)}
  .plan-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
  .plan-row .k{color:var(--orange);width:84px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding-top:2px;flex:none}

  /* ---------- projects home: a rail + a rich detail pane (not boxy 3-up cards) ---------- */
  .home{display:grid;grid-template-columns:300px 1fr;gap:0;height:100%;min-height:0}
  .rail{border-right:1px solid var(--line);overflow:auto;padding-right:16px;min-height:0}
  .rail .addbox{display:flex;gap:7px;margin:0 0 12px}
  .rail .addbox input{padding:7px 10px;font-size:12.5px}
  .prow{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .13s,border-color .13s;position:relative;animation:fadein .28s ease both}
  .prow:hover{background:#151a24}
  .prow.on{background:var(--orangeSoft);border-color:var(--orangeLine)}
  .prow.on::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
  .prow .pi{width:26px;height:26px;flex:none}
  .prow .pmeta{min-width:0;flex:1}
  .prow .pmeta b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .pmeta small{color:var(--dim2);font-size:11px}
  .prow .pdot{width:7px;height:7px;border-radius:50%;background:var(--line3);flex:none}
  .prow .pdot.keel{background:var(--green);box-shadow:0 0 6px var(--green)}
  .prow .pdot.mono{background:var(--blue);box-shadow:0 0 6px var(--blue)}
  .railcap{color:var(--dim2);font-size:10px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;padding:14px 11px 6px}
  .homepane{overflow:auto;padding-left:22px;min-height:0}
  .hero{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(140deg,var(--panel3),var(--panel2) 60%);padding:26px 26px 22px;position:relative;overflow:hidden}
  .hero h1{font-size:22px;margin:0 0 6px}
  .hero p{color:var(--dim);font-size:13px;margin:0 0 16px;max-width:56ch}
  .hero .quick{display:flex;gap:9px;flex-wrap:wrap}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .tile{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel2);padding:15px 16px;cursor:pointer;transition:.14s}
  .tile:hover{border-color:var(--line3);transform:translateY(-1px)}
  .tile .g{font-size:18px}
  .tile b{display:block;font-size:14px;margin:6px 0 2px}
  .tile small{color:var(--dim);font-size:12px}

  /* ---------- project detail: persistent header + tab strip + tab body ---------- */
  .phead{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:var(--radius);
    background:linear-gradient(140deg,var(--panel3),var(--panel2) 70%);padding:15px 18px;margin:0 0 4px;animation:fadein .25s ease both}
  .phead .pi{width:40px;height:40px;flex:none}
  .phead .ptit{min-width:0;flex:1}
  .phead .ptit b{font-size:17px;display:block;line-height:1.2}
  .phead .ptit .ppath{color:var(--dim2);font-size:11.5px;font-family:ui-monospace,monospace;word-break:break-all}
  .phead .pchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
  .phead .pacts{display:flex;gap:7px;flex-wrap:wrap}
  .conn{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim)}
  .conn .d{width:7px;height:7px;border-radius:50%;background:var(--line3)}
  .conn.up .d{background:var(--green);box-shadow:0 0 6px var(--green)}
  .conn.down .d{background:var(--yellow)}
  .conn.checking .d{background:var(--blue);animation:pulse 1.1s infinite}

  /* running-services dashboard (Overview): one row per env service */
  .svcs{display:flex;flex-direction:column;gap:7px}
  .svc{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--panel2)}
  .svc .svc-name{font-size:var(--t-md);font-weight:600}
  .svc .svc-state{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;border-radius:999px;padding:1px 8px;border:1px solid var(--line2)}
  .svc .svc-state.up{color:var(--green);border-color:rgba(74,222,128,.4)}
  .svc .svc-state.down{color:var(--yellow);border-color:rgba(234,179,74,.4)}
  .svc .svc-acts{display:flex;gap:6px;flex:none}
  /* the Overview's per-framework fact grid: small label/value stat cells */
  .statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .stat{border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--panel2);padding:9px 12px;min-width:0}
  .stat .stat-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
  .stat .stat-v{font-size:var(--t-md);font-weight:600;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat .stat-v .conn{font-weight:500}
  /* --- Overview WIDGET dashboard: the top gauge/big-number tile row, the
     framework-STATISTICS tile grid, and the uptime badge on a service row.
     The gauge tiles reuse the sonRing SVG ring (no chart lib). --- */
  /* A plugin's own-UI page: its HTML runs in this sandboxed iframe. Full-bleed so
     the plugin owns the canvas; the plugin styles everything inside. */
  .pluginframe{width:100%;height:calc(100vh - 150px);min-height:520px;border:0;border-radius:var(--r);background:var(--panel);display:block}
  .ovwidgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--s3);margin-bottom:var(--s4)}
  /* Each widget tile is a clean flex row: the gauge (flex:none) + a real gap +
     a left-aligned text column (label / big value / sub, each on its own line).
     A shared min-height keeps the three tiles visually consistent across the
     gauge and text-only (native/down) states. (Dan: "not inline, too close.") */
  .ovw{border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,var(--panel),var(--panel2));padding:16px 18px;display:flex;align-items:center;gap:16px;min-width:0;min-height:96px}
  .ovw .ovw-body{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;text-align:left}
  .ovw .ovw-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);line-height:1.2}
  .ovw .ovw-v{font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--head);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ovw .ovw-sub{font-size:11px;color:var(--dim2);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ovw .ovw-sub.up{color:var(--green)} .ovw .ovw-sub.down{color:var(--yellow)}
  .ovw .son-ring,.ovw .son-mini{flex:none}
  /* the framework-STATISTICS grid: one big-number tile per stat (value + label + sub).
     The value can wrap to two lines (clamped) instead of hard-cutting mid-word
     (e.g. "laravel-docker" → "laravel-…"); the full value is on the title tooltip. */
  .ovstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s2)}
  .ovstat{border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--panel2);padding:13px 14px;min-width:0;display:flex;flex-direction:column}
  .ovstat .ovstat-v{font-size:22px;font-weight:700;letter-spacing:-.5px;color:var(--head);line-height:1.15;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ovstat .ovstat-v.dash{color:var(--dim2)}
  .ovstat .ovstat-l{font-size:11px;font-weight:600;color:var(--headSoft);margin-top:7px;line-height:1.25}
  .ovstat .ovstat-s{font-size:10px;color:var(--dim2);margin-top:3px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
  /* uptime badge on a running service row */
  .svc .svc-up{font-size:10.5px;color:var(--dim2);white-space:nowrap}
  .svc .svc-up b{color:var(--green);font-weight:600}
  /* the tiny inline action row that replaces the old Quick-actions card */
  .ovjump{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
  .ovjump .btn.sm{color:var(--dim)}
  /* the project tabs live under the header; the active tab body cross-fades */
  .ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 20px;overflow-x:auto}
  .ptab{padding:9px 14px;color:var(--dim);cursor:pointer;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;user-select:none;white-space:nowrap;transition:color .13s}
  .ptab:hover{color:var(--headSoft)}
  .ptab.on{color:#fff;border-bottom-color:var(--orange)}
  .ptab .tg{margin-right:6px;opacity:.85}
  #tabbody{animation:fadein .22s ease both}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.prow,.phead,#tabbody,.tile{animation:none}.tile:hover,.member:hover{transform:none}}

  /* members list at the monorepo level */
  .member{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);transition:.13s;cursor:pointer}
  .member:hover{border-color:var(--line3);background:var(--panel)}
  .member.lib{cursor:default;opacity:.72}
  .member.lib:hover{border-color:var(--line);background:var(--panel2)}
  .member .mi{width:26px;height:26px;flex:none}
  .member .mmeta{flex:1;min-width:0}
  .member .mmeta b{font-size:13.5px}
  .backend{display:flex;align-items:center;gap:10px;border:1px solid var(--orangeLine);border-radius:10px;background:var(--orangeSoft);padding:12px 15px;margin-bottom:14px}
  .backend .bl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}

  /* run & logs */
  .runbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .taskchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .taskchip{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line2);border-radius:9px;background:var(--panel);padding:9px 13px;cursor:pointer;min-width:120px;transition:.12s}
  .taskchip:hover{border-color:var(--line3)}
  .taskchip.on{border-color:var(--orange);background:var(--orangeSoft)}
  .taskchip b{font-size:13.5px}
  .taskchip small{color:var(--dim2);font-size:10.5px;font-family:ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}

  /* data grid */
  .grid-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .grid-toolbar input{width:auto;padding:5px 9px;font-size:12.5px}
  .grid-toolbar .grow{flex:1}
  .grid-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;max-height:calc(100% - 78px)}
  table.grid{border-collapse:collapse;font:12.5px/1.4 ui-monospace,Menlo,monospace;width:100%}
  table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 9px;text-align:left;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
  table.grid th{position:sticky;top:0;background:var(--panel3);color:var(--blue);cursor:pointer;user-select:none;z-index:1}
  table.grid th .ty{color:var(--dim);font-weight:400;font-size:10.5px;margin-left:5px}
  table.grid th.pk::after{content:" ⚷";color:var(--orange)}
  table.grid td.num{text-align:right}
  table.grid td.null{color:var(--dim);font-style:italic}
  table.grid td.editable{cursor:cell}
  table.grid td.editable:hover{outline:1px solid var(--line3)}
  table.grid td.dirty{background:rgba(255,106,44,.16);outline:1px solid var(--orange)}
  table.grid td.fk .fklink{color:var(--blue);cursor:pointer;font-weight:700;margin-left:2px}
  table.grid td.fk .fklink:hover{text-decoration:underline}
  table.grid tbody tr:hover{background:var(--panel)}
  table.grid td input{width:100%;padding:2px 4px;font:inherit;background:var(--bg2);border:1px solid var(--orange)}
  .grid-pager{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12.5px;color:var(--dim)}

  /* command palette */
  #palette{position:fixed;inset:0;background:rgba(5,7,11,.62);display:none;align-items:flex-start;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
  #palette.open{display:flex}
  #palbox{margin-top:12vh;width:min(600px,92vw);background:var(--panel);border:1px solid var(--line3);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.55)}
  #palinput{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 19px;font-size:16px;background:transparent}
  #palinput:focus{outline:none}
  #pallist{max-height:340px;overflow:auto;padding:7px}
  .palrow{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:9px;cursor:pointer;color:var(--dim)}
  .palrow .g{width:18px;text-align:center;font-size:14px}
  .palrow .sub{margin-left:auto;font-size:11px;color:var(--dim2)}
  .palrow.sel{background:var(--orangeSoft);color:#fff}
  .palrow.sel .sub{color:var(--headSoft)}
  .palcap{color:var(--dim2);font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;padding:9px 13px 4px}

  /* generator fields table (in the Generate tab) */
  table.ftable{width:100%;border-collapse:collapse;font-size:13px}
  table.ftable th{text-align:left;color:var(--dim2);font-weight:600;font-size:11px;letter-spacing:.4px;text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line)}
  table.ftable td{padding:4px 6px;border-bottom:1px solid var(--line)}
  table.ftable input,table.ftable select{width:100%}

  /* onboarding modal */
  #onboard{position:fixed;inset:0;background:rgba(5,7,11,.8);display:none;align-items:center;justify-content:center;z-index:60}
  #onboard.open{display:flex}
  #obbox{width:min(600px,94vw);background:var(--panel);border:1px solid var(--line3);border-radius:16px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.6)}
  #obhead{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
  #obhead b{font-size:17px}#obhead .muted{margin-left:auto;font-size:12px}
  #obbody{padding:22px;max-height:56vh;overflow:auto}
  #obbody label{display:block;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin:0 0 8px}
  #obbody .hint{color:var(--dim);font-size:12.5px;margin-top:9px}
  #obnav{display:flex;gap:10px;align-items:center;padding:16px 22px;border-top:1px solid var(--line)}
  #obnav .grow{flex:1}
  .obdots{display:flex;gap:6px}.obdots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}.obdots i.on{background:var(--orange)}

  /* upgrade bar */
  #upgradebar{padding:8px 22px;background:var(--orangeSoft);border-bottom:1px solid var(--line);color:var(--head);font-size:13px}
  .plugbar{padding:8px 22px;background:#3a1d1d;border-bottom:1px solid #5a2a2a;color:#f4b8b8;font-size:13px;cursor:pointer}
  .plugbar:hover{background:#452222}
  .cmdbox{flex:1;display:block;padding:9px 12px;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r-sm);
    font-family:var(--mono,ui-monospace,monospace);font-size:12px;color:var(--head);overflow-x:auto;white-space:pre;word-break:break-all}

  /* brand: seed inputs, generated token scales, semantic roles, preview */
  .seedrow{display:flex;gap:var(--s4);flex-wrap:wrap;align-items:flex-end}
  .seedfld{display:flex;flex-direction:column;gap:6px}
  .seedfld label{font-size:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:1.2px}
  .seedfld .swatchbox{display:flex;gap:var(--s2);align-items:center}
  .seedfld input[type=color]{width:38px;height:34px;flex:none;padding:2px;cursor:pointer;background:var(--panel)}
  .seedfld input[type=text]{width:120px;font-family:var(--mono,ui-monospace,monospace);font-size:12.5px}
  .brandrole{margin-top:var(--s4)}
  .brandrole .rname{font-size:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:1.2px;margin:0 0 6px}
  .scale{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
  .scale .stop{flex:1;min-width:0;height:44px;position:relative}
  .scale .stop small{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:9px;line-height:1;
    color:rgba(255,255,255,.75);text-shadow:0 1px 2px rgba(0,0,0,.5);pointer-events:none}
  .scale .stop.lt small{color:rgba(0,0,0,.6);text-shadow:none}
  .roleflat{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:6px}
  .roleflat .tok{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);border:1px solid var(--line2);
    border-radius:var(--r-pill);padding:3px 10px 3px 3px}
  .roleflat .tok i{width:20px;height:20px;border-radius:var(--r-pill);border:1px solid var(--line2);flex:none;display:block}
  .brandprev{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:var(--s3)}
  @media(max-width:760px){.brandprev{grid-template-columns:1fr}}
  .pvcard{border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);overflow:hidden}
  .pvcard .pvmode{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;opacity:.6;margin:0 0 10px}
  .pvcard h4{margin:0 0 6px;font-size:15px;font-weight:650}
  .pvcard p{margin:0 0 12px;font-size:12.5px;opacity:.75}
  .pvcard .pvbtns{display:flex;gap:8px;flex-wrap:wrap}
  .pvbtn{border:0;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:default}
  .srcpill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);
    border:1px solid var(--line2);border-radius:var(--r-pill);padding:3px 11px}
  .srcpill i{width:7px;height:7px;border-radius:50%;background:var(--dim2);display:block}
  .srcpill.project i{background:var(--orange)}.srcpill.global i{background:var(--green)}
  .son-ring{position:relative;width:96px;height:96px}
  .son-ring svg{transform:rotate(-90deg)}
  .son-ring .son-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:650;letter-spacing:-.5px}
  /* Size to the SVG it wraps rather than a fixed box: the overview gauges render a
     64px ring and the sonar list a 44px one, both into .son-mini. A fixed 44px box
     let the 64px ring overflow — off-centre in its tile, its number pushed into the
     text, and the rotate(-90deg) leaving a stray edge at the top-left. */
  .son-mini{position:relative;display:inline-block;flex:none;line-height:0}

  .son-mini .son-mnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:650}

<script>
/* ---------- IA: PROJECT-FIRST ----------
   The studio is project-first. The left nav is TOP-LEVEL only: a Projects home
   plus global-only items (New/Build a stack, Packs, Settings, Plugins). Every
   OPERATION lives INSIDE a focused project's detail view as a tab (Overview ·
   Build/Rebuild · Data · Run & Logs · Generate · Auth · Env & Secrets · Deploy ·
   Add-service · plugin screens). A monorepo focuses to a members list; a member
   focuses to its OWN detail view with the full action set.

   VIEW is the top-level route: "home" (projects) | "project" (a focused project)
   | "build" | "packs" | "settings". PTAB is the active tab inside a project. */
const NAV=[
  {id:"home",g:"❏",label:"Projects",group:"Workspace"},
  {id:"build",g:"◆",label:"New stack",group:"Workspace"},
  {id:"packs",g:"◇",label:"Packs",group:"Extend"},
  {id:"plugins",g:"◈",label:"Plugins",group:"Extend"},
  // Settings is intentionally NOT here — it is pinned to the bottom of the
  // sidebar (renderNav draws it into #navpinned), the conventional gear slot.
];

// Project-detail tabs, in order. `need` gates a tab on the project's state:
// "managed" tabs need a keel manifest; "runnable" tabs additionally need a real
// (non-lib) framework. A plugin Screener screen is appended as a dynamic tab.
// Note: there is no standalone Auth tab — auth is not a code component, it is a
// stack. It lives in Generate → Stacks (applied via `keel add`), so the tab that
// duplicated it was removed (fitness Round-2 [Gen] "Kill the Auth tab").
const PTABS=[
  {id:"overview",g:"◉",label:"Overview"},
  {id:"data",g:"▤",label:"Data",need:"managed"},
  {id:"run",g:"▷",label:"Run & Logs",need:"managed"},
  {id:"generate",g:"✦",label:"Generate",need:"managed"},
  {id:"brand",g:"◑",label:"Brand",need:"managed"},
  {id:"secrets",g:"⚷",label:"Env & Secrets",need:"managed"},
  {id:"add",g:"＋",label:"Manage services",need:"managed"},
  {id:"deploy",g:"⤴",label:"Deploy",need:"managed"},
];

let R=[],LANGS=[],VIEW="home",PTAB="overview",PROJECTS=[],buildStep=0,PROFILE={},svcFilter="";
let TAB={};                 // current sub-tab per top-level view (settings tabs, data grid/sql)
let PROJ=null;              // the project (or member) currently in focus
let PROJ_BACKEND=null;      // the focused project/member's effective shared backend (or null)
let CREDS_WANTED=[],ENV_NAMES=[],CREDS={},CREDS_EXTRA=[];
let sel={lang:null,framework:null,env:null,db:null,frontend:null,service:[],addon:[],extra:[]};
let PLUGIN_OPTS=[];         // schemas for the applicable plugins' wizard steps (e.g. ai-core's skills)
let pluginChoices={};       // the user's picks per plugin step id -> [values], posted with the build
let pluginOptsFw=null;      // the framework PLUGIN_OPTS was fetched for, so we refetch on change
let LAST_BUILD=null;        // remembers the last plan+name so a project can re-run it
let SCREENS=[];             // plugin Screener screens, rendered as per-project tabs
let SCREEN=null;            // the plugin screen currently open in the screen tab {id,title}
let PLUGIN_PAGES=[];        // global plugin Pager pages, shown under the "Extend" nav group
let PPAGE=null;             // the plugin page currently open {id,title}
let PLUGIN_PROBLEMS=[];     // plugin load failures, surfaced as a banner beyond the Plugins page

// A member of a monorepo is non-runnable when it is a shared lib (no framework
// of its own). Everything else with a manifest is a keel-managed, actionable
// project. isMono/isLib/isManaged read a project OR member row uniformly.
const isMono=p=>p&&p.framework==="monorepo";
const isLib=p=>p&&p.framework==="lib";
const pManaged=p=>!!(p&&p.managed);

/* ---------- API ---------- */
const TOKEN=document.querySelector('meta[name="keel-token"]').content;
function api(path,opts){
  const o=Object.assign({},opts);
  o.headers=Object.assign({},o.headers,{"X-Keel-Token":TOKEN});
  if(o.body!==undefined)o.headers["Content-Type"]="application/json";
  return fetch(path,o);
}
// apiJSON calls an endpoint and returns its parsed JSON. A non-2xx is surfaced as
// a thrown Error carrying the status: the guarded handlers answer 400/403/405 with
// a PLAIN-TEXT body (e.g. "keel studio is loopback-only"), so calling r.json() on
// those blindly threw a SyntaxError that hid the real status. Callers already wrap
// this in try/catch and show e — now they show "403: …" instead of "Unexpected
// token". A 2xx with a text/plain body degrades to {} rather than throwing.
const apiJSON=(path,body,method)=>api(path,{method:method||(body===undefined?"GET":"POST"),body:body===undefined?undefined:JSON.stringify(body)}).then(async r=>{
  if(!r.ok){const t=await r.text().catch(()=>"");throw new Error(r.status+(t?" "+t.trim():" "+r.statusText));}
  return r.json().catch(()=>({}));
});
// fetchJSON is apiJSON with the try/catch every caller was repeating: a thrown
// error (network, non-2xx) comes back as {error:"…"} so a caller only has to test
// d.error, never wrap the call. This is the one place that boilerplate lives now.
const fetchJSON=async(path,body,method)=>{try{return await apiJSON(path,body,method);}catch(e){return {error:String(e.message||e)};}};

// in that host" flow that ~a dozen panels copied by hand. render(d,host) runs only
// on success; an error (or a stale host that changed under an in-flight request)
// paints the host's error box instead. Returns d so a caller can chain if it wants.
async function loadInto(host,path,body,render){
  if(typeof host==="string")host=document.getElementById(host);
  const d=await fetchJSON(path,body);
  if(!host)return d; // the panel was navigated away from before the reply landed
  if(d.error){host.innerHTML=`<div class="err">${esc(d.error)}</div>`;return d;}
  render(d,host);
  return d;
}

const applies=(r,fw)=>!r.appliesTo||!r.appliesTo.length||r.appliesTo.includes(fw)||r.appliesTo.includes("*");
const isDefault=(r,fw)=>r.defaultFor&&r.defaultFor.length?(r.defaultFor.includes(fw)||r.defaultFor.includes("*")):!!r.default;
const ofKind=k=>R.filter(r=>r.kind===k);
const frameworksFor=l=>R.filter(r=>r.kind==="framework"&&(r.lang||"other")===l);
function families(l){
  const seen={},out=[];
  frameworksFor(l).forEach(f=>{const key=f.family||f.id;if(!seen[key]){seen[key]={key,variants:[]};out.push(seen[key]);}seen[key].variants.push(f);});
  out.forEach(F=>{F.primary=F.variants.find(v=>v.id===F.key)||F.variants[0];});
  return out;
}
const forFw=(fw,k)=>ofKind(k).filter(r=>applies(r,fw));
const byId=id=>R.find(x=>x.id===id);
const isWeb=r=>(r.provides||[]).includes("webserver");
const webFor=fw=>forFw(fw,"service").filter(isWeb);
const svcFor=fw=>forFw(fw,"service").filter(r=>!isWeb(r));
const chosenWeb=()=>sel.service.find(id=>{const r=byId(id);return r&&isWeb(r);})||null;
function setWeb(id){sel.service=sel.service.filter(x=>{const r=byId(x);return !(r&&isWeb(r));});if(id)sel.service.push(id);}

function chooseWebSetting(id){setWeb(id);renderSettings(gc());}
function profileBody(name,dir,hosting){
  return JSON.stringify({Name:name,ProjectsDir:dir,Hosting:hosting,
    Framework:sel.framework,Env:sel.env,Database:sel.db,Frontend:sel.frontend||"",
    Webserver:chosenWeb()||"none",
    Services:sel.service.filter(id=>!isWeb(byId(id)||{})).join(","),
    Addons:sel.addon.join(","),Extras:sel.extra.join(",")});

// esc escapes for BOTH HTML text and quoted-attribute contexts: & < > plus the
// two quote characters, so a value interpolated into title="…" / onclick='…' /
// style="…" cannot break out of the attribute. Every untrusted value the page
// reflects (DB cell values, project paths, recipe ids, table/column names, plugin
// text, brand hex) must go through this, in text AND attribute positions alike.
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// jarg renders a value as a JS literal that is ALSO safe inside a single- or
// double-quoted HTML attribute. JSON.stringify gives a valid JS string; esc then
// entity-encodes its quotes/angle-brackets, which the browser decodes back to
// valid JS when it parses the attribute — so `onclick='f(${jarg(x)})'` cannot be
// broken out of, whatever characters x (a recipe id, a table name, a plugin
// value) contains. Use it for EVERY untrusted value passed to an inline handler.
const jarg=x=>esc(JSON.stringify(x));
// safeURL returns the value only if it is an http(s) URL, else "#". A plugin can
// contribute a link (a homepage, a screen item href), and esc() stops it breaking
// the attribute but not a `javascript:`/`data:` scheme that runs on click. Anything
// that is not plainly http(s) becomes an inert "#".
const safeURL=u=>{try{const p=new URL(String(u),location.href);return (p.protocol==="http:"||p.protocol==="https:")?String(u):"#";}catch(e){return "#";}};

function iconSlug(r){
  const s=((r&&r.id||"")+" "+(r&&r.label||"")+" "+(typeof r==="string"?r:"")).toLowerCase();
  // Longest / most specific tokens first so "woocommerce" wins before "woo",
  // "sveltekit" before "svelte", etc. Every framework and language keel offers is
  // mapped to a real brand slug that BRAND_SVG carries an inline logo for.
  const map=[["monorepo","turborepo"],["turbo","turborepo"],
    ["woocommerce","woocommerce"],["woo","woocommerce"],["wordpress","wordpress"],
    ["magento","magento"],["mageos","magento"],["hyva","magento"],
    ["laravel","laravel"],["symfony","symfony"],
    ["django","django"],["fastapi","fastapi"],["flask","flask"],["reflex","reflex"],["streamlit","streamlit"],["gradio","gradio"],["dash","dash"],

    ["sveltekit","svelte"],["svelte","svelte"],["astro","astro"],
    ["nestjs","nestjs"],["nest","nestjs"],["express","express"],["fastify","fastify"],["hono","hono"],["adonisjs","adonisjs"],["adonis","adonisjs"],
    ["sail","docker"],["ddev","docker"],["docker","docker"],
    ["postgres","postgresql"],["mariadb","mariadb"],["mysql","mysql"],["sqlite","sqlite"],
    ["redis","redis"],["opensearch","opensearch"],["elastic","elasticsearch"],["meili","meilisearch"],
    ["typesense","typesense"],["minio","minio"],["rabbit","rabbitmq"],["mongo","mongodb"],
    ["varnish","varnish"],["nginx","nginx"],["apache","apache"],
    // Languages last: single short tokens that must not steal a framework match.
    ["typescript","typescript"],["javascript","javascript"],
    ["node","nodedotjs"],["php","php"],["python","python"],["golang","go"],
    [" go ","go"],["\tgo","go"]];
  for(const [k,slug] of map) if(s.includes(k)) return slug;
  // A bare "go"/"js"/"ts" language token (id or the string form) needs an exact
  // check so it never substring-matches inside another word (e.g. "django").
  const t=s.trim();
  if(t==="go"||t==="go lang")return "go";
  if(t==="js")return "javascript";
  if(t==="ts")return "typescript";
  return "";
}

const iconImg=(slug,size)=>{
  if(!slug)return"";
  const s=size||21,c=iconTint[slug]||"#8b93a1",p=BRAND_SVG[slug];
  const box='width:'+s+'px;height:'+s+'px;border-radius:5px;display:inline-flex;'+
    'align-items:center;justify-content:center;background:'+c+';flex:none;vertical-align:middle;';
  if(p){
    // The real brand logo, drawn white on the brand square. A single monochrome
    // path keeps every logo one self-contained shape — no external font or image.
    const gs=Math.round(s*0.66);
    return '<span class="ic" title="'+esc(slug)+'" style="'+box+'">'+
      '<svg width="'+gs+'" height="'+gs+'" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">'+
      '<path d="'+p+'"/></svg></span>';
  }
  // Fallback monogram for a slug with no packaged logo.
  return '<span class="ic" title="'+esc(slug)+'" style="'+box+'line-height:'+s+'px;text-align:center;'+
    'font-size:'+Math.round(s*0.55)+'px;font-weight:700;color:#0f1218">'+esc(slug[0].toUpperCase())+'</span>';
};

/* ---------- shell: top-level nav (project-first) ---------- */
function renderNav(){
  const n=document.getElementById("navscroll");n.innerHTML="";
  // The built-in items plus one nav entry per plugin Pager page, folded into the
  // "Extend" group — a plugin's global page (a dashboard, a marketplace) becomes a
  // real left-nav destination without the studio knowing what the plugin is.
  const items=NAV.concat(PLUGIN_PAGES.map(pg=>({id:"ppage:"+pg.id,g:pg.icon||"◈",label:pg.title,group:"Extend",page:pg})));
  let group="";
  items.forEach(a=>{
    if(a.group!==group){group=a.group;const cap=document.createElement("div");cap.className="navcap";cap.textContent=group;n.appendChild(cap);}
    const on=(VIEW===a.id||(a.id==="home"&&VIEW==="project")||(a.page&&VIEW==="ppage"&&PPAGE&&PPAGE.id===a.page.id));
    const d=document.createElement("div");d.className="navitem"+(on?" on":"");
    d.title=a.label; // legible when the sidebar collapses to an icon rail
    d.innerHTML=`<span class="g">${esc(a.g)}</span><span>${esc(a.label)}</span>`;
    d.onclick=a.page?(()=>openPluginPage(a.page.id)):(()=>go(a.id));
    n.appendChild(d);
  });
  // Settings is pinned to the bottom of the sidebar (its own slot above the
  // footer), the conventional home for a gear/settings entry.
  const pin=document.getElementById("navpinned");
  if(pin){
    const on=VIEW==="settings";
    pin.innerHTML=`<div class="navitem${on?" on":""}" title="Settings"><span class="g">⚙</span><span>Settings</span></div>`;
    pin.firstChild.onclick=()=>go("settings");
  }
}
// loadPluginPages fetches the global pages plugins contribute (Pager hook), so the
// nav can offer one entry per page under Extend. A build with no such plugin gets
// an empty list and no extra nav entries.
async function loadPluginPages(){try{const d=await apiJSON("/api/plugin-pages");PLUGIN_PAGES=d.pages||[];}catch(e){PLUGIN_PAGES=[];}}
// openPluginPage focuses a plugin's global page. It sets the ppage view and
// remembers which page, so renderContent renders it and the nav highlights it.
function openPluginPage(id){const pg=PLUGIN_PAGES.find(x=>x.id===id);PPAGE=pg?{id:pg.id,title:pg.title}:null;VIEW="ppage";SCREEN=null;renderNav();renderCrumbs();renderContent();syncURL();}
// renderPluginPage draws one plugin Pager page. A data page returns a View that
// keel draws (sections, no markup, so it cannot script into the studio). An
// own-UI page returns its own HTML, which keel hosts in a sandboxed iframe — the
// plugin owns the whole surface and reaches its own back-end through keel.call.
async function renderPluginPage(c){
  if(!PPAGE){go("home");return;}
  const meta=PLUGIN_PAGES.find(x=>x.id===PPAGE.id);
  c.innerHTML=pageHead(PPAGE.title,"A page contributed by a plugin.")+`<div id="ppagehost"><span class="muted">loading…</span></div>`;
  if(meta&&meta.html){return renderPluginWebview(document.getElementById("ppagehost"),meta);}
  await loadInto("ppagehost","/api/plugin/page",{id:PPAGE.id},(d,host)=>{
    const sections=(d.sections||[]);
    host.innerHTML=sections.length?sections.map(renderScreenSection).join(""):'<div class="muted">This page returned nothing.</div>';
  });
}
// _pluginBridge is the parent-side message listener for the current webview, kept
// so it can be torn down before the next one to avoid stacking listeners.
let _pluginBridge=null;
// renderPluginWebview hosts a plugin's own HTML in a sandboxed iframe. The frame
// runs the plugin's UI with allow-scripts but NO allow-same-origin, so it is an
// opaque origin: it can run its own code but cannot read the studio DOM, cookies,
// token or API. Its only channel out is keel.call(action,args), which postMessages
// this parent; the parent (holding the token) runs the plugin's action via
// /api/plugin/call and posts the JSON result back. That inversion is the security
// model — the untrusted-looking frame, host-mediated calls, per-action capability.
async function renderPluginWebview(host,meta){
  if(_pluginBridge){window.removeEventListener("message",_pluginBridge);_pluginBridge=null;}
  let d={};
  try{d=await apiJSON("/api/plugin/page",{id:meta.id});}catch(e){host.innerHTML=`<div class="err">${esc(String(e.message||e))}</div>`;return;}
  if(d.error){host.innerHTML=`<div class="err">${esc(d.error)}</div>`;return;}
  const boot=`<script>(function(){
    var plugin=${JSON.stringify(meta.plugin||"")},seq=0,pending={};
    window.addEventListener("message",function(e){var m=e.data||{};if(m.__keel==="result"&&pending[m.id]){var p=pending[m.id];delete pending[m.id];m.error?p.rej(new Error(m.error)):p.res(m.result);}});
    window.keel={call:function(action,args){return new Promise(function(res,rej){var id=++seq;pending[id]={res:res,rej:rej};parent.postMessage({__keel:"call",id:id,plugin:plugin,action:action,args:args||{}},"*");});}};
  })();<\/script>`;
  const frame=document.createElement("iframe");
  frame.className="pluginframe";
  frame.setAttribute("sandbox","allow-scripts");
  frame.srcdoc=boot+(d.html||"");
  host.innerHTML="";host.appendChild(frame);
  _pluginBridge=async function(e){
    if(e.source!==frame.contentWindow)return;
    const m=e.data||{};if(m.__keel!=="call")return;
    let out;
    try{out=await apiJSON("/api/plugin/call",{plugin:m.plugin,action:m.action,args:m.args||{}});}
    catch(err){frame.contentWindow.postMessage({__keel:"result",id:m.id,error:String(err.message||err)},"*");return;}
    if(out&&out.ok===false){frame.contentWindow.postMessage({__keel:"result",id:m.id,error:out.error||"failed"},"*");return;}
    frame.contentWindow.postMessage({__keel:"result",id:m.id,result:out?out.result:null},"*");
  };
  window.addEventListener("message",_pluginBridge);
}
// Breadcrumb: Projects › <name> › <tab> for a focused project (with a member
// nested under its monorepo), else keel › <top-level item>.
function renderCrumbs(){
  const c=document.getElementById("crumbs");
  let parts;
  if(VIEW==="project"&&PROJ){
    // A focused project is nested under the Projects root (and under its monorepo
    // parent, if any): Projects › [parent ›] name › tab.
    parts=[`<span class="c link" onclick="go('home')">Projects</span>`];
    const parent=parentOf(PROJ);
    if(parent){
      parts.push(`<span class="sep">›</span>`,`<span class="c link" onclick='focusProject(${jarg(parent.path)})'>${esc(parent.name)}</span>`);
    }
    const tabTitle=projTab(PTAB);
    parts.push(`<span class="sep">›</span>`,`<span class="c ${tabTitle?'link':'here'}" ${tabTitle?`onclick='setPTab("overview")'`:""}>${esc(PROJ.name)}</span>`);
    if(tabTitle)parts.push(`<span class="sep">›</span>`,`<span class="c here">${esc(tabTitle)}</span>`);
  }else if(VIEW==="ppage"&&PPAGE){
    // A plugin page lives under Extend, not under Projects.
    parts=[`<span class="c here">Extend</span>`,`<span class="sep">›</span>`,`<span class="c here">${esc(PPAGE.title)}</span>`];
  }else{
    // Every other top-level view (home/build/packs/settings/plugins) is its own
    // root: it must NOT be prefixed with "Projects" — Plugins/Packs/Settings are
    // siblings of Projects, not children of it. home IS the Projects landing, so
    // its own label ("Projects") is the single crumb.

/* ---------- project focus + lookup ---------- */
// focusProject opens a project (or member) detail view. It refreshes the list,
// resolves the row, resets to Overview, then fetches the effective shared
// backend so the header and Data tab know which DB the (possibly inherited)
// project talks to. A lib member is focusable (to show it exists) but its
// runnable tabs stay disabled.
async function focusProject(path){
  await loadProjects();
  PROJ=findProject(path)||PROJ;
  if(!PROJ)return;
  VIEW="project";PTAB="overview";SCREEN=null;PROJ_BACKEND=null;
  renderNav();renderCrumbs();renderContent();syncURL();
  loadBackend(PROJ.path);   // async — refreshes the header + Data tab when it lands
}
// loadBackend fetches a project/member's effective (inherited) backend and
// re-renders once it arrives, so the shared-backend banner and the resolved DB
// engine appear without blocking the first paint. A member of a monorepo learns
// its shared DB here (the per-member Supabase/MySQL bug); a standalone project
// gets a non-inherited answer and no banner.
async function loadBackend(path){
  let d=null;try{d=await apiJSON("/api/member/backend?dir="+encodeURIComponent(path));}catch(e){d=null;}
  if(!PROJ||PROJ.path!==path)return;           // focus moved on while we waited
  PROJ_BACKEND=(d&&!d.error)?d:null;
  // The tab set and the Run/Overview bodies all depend on whether this member is
  // root-launched (it drops per-member env/deploy and its Run is the root
  // command), so re-render the tabs and the active body once the answer lands.
  if(VIEW==="project"){renderProjHeader();if(!isMono(PROJ)){renderProjTabs();renderProjTabBody();}}
}
// isRootLaunch reports whether the focused project/member runs from its workspace
// root (pnpm/turbo dev). Read off the effective-backend answer so the whole UI —
// tabs, header, Run — agrees on one signal.
function isRootLaunch(){return !!(PROJ_BACKEND&&PROJ_BACKEND.rootLaunch);}
function setPTab(id){
  if(!id.startsWith("screen:"))SCREEN=null; // leaving a plugin screen tab
  PTAB=id;renderCrumbs();
  document.querySelectorAll(".ptab").forEach(el=>el.classList.toggle("on",el.dataset.tab===id));
  renderProjTabBody();syncURL();
}
// parentOf returns the monorepo project a member belongs to, or null for a
// top-level project. Used for the breadcrumb and "back to monorepo" affordance.
function parentOf(row){
  for(const p of PROJECTS){
    if(p===row)return null;
    for(const m of (p.members||[]))if(m===row||m.path===row.path)return p;
  }
  return null;
}
function findProject(path){
  for(const p of PROJECTS){
    if(p.path===path)return p;
    for(const m of (p.members||[]))if(m.path===path)return m;
  }
  return null;
}

/* ---------- design-system primitives (shared: wizard + generate) ----------
   One vocabulary of controls so "same weird pills, not clean" reads identically
   wherever it appears: an accordion, a real single-select radio list, a
   multi-select checkbox list, and an add-row. Every builder returns an HTML
   string (or appends a node) and takes plain data — no framework, no per-surface
   variant. The .opt pill is no longer a selection control. */

// accHTML renders one accordion section: a numbered badge, a title, a collapsed
// summary and a chevron, in one of the states open/done/locked. `onToggle` is a
// JS expression run when the header is activated (click / Enter / Space); a
// locked section ignores it. bodyHTML is only meaningful when open, but is always
// emitted so the pure-CSS 0fr→1fr expand can animate.
function accHTML(n,title,summary,state,onToggle,bodyHTML){
  const open=state==="open",done=state==="done",locked=state==="locked";
  const cls="acc"+(open?" open":"")+(done?" done":"")+(locked?" locked":"");
  const badge=done?"✓":String(n);
  const tog=locked?"":onToggle;
  return `<div class="${cls}">
    <div class="acc-h" tabindex="${locked?-1:0}" role="button" aria-expanded="${open}"
      ${locked?"":`onclick='${tog}' onkeydown='if(event.key==="Enter"||event.key===" "){event.preventDefault();${tog}}'`}>
      <span class="acc-badge">${badge}</span>
      <span class="acc-t"><b>${esc(title)}</b>${summary?`<small>${esc(summary)}</small>`:""}</span>
      <span class="acc-chev">▸</span>
    </div>
    <div class="acc-body-wrap"><div class="acc-body-inner"><div class="acc-body">${bodyHTML||""}</div></div></div>
  </div>`;
}
// rlistHTML renders a single-select radio list. items:[{on,label,sub,slug,call}].
function rlistHTML(items){
  return `<div class="rlist">${items.map(it=>`
    <div class="ritem${it.on?" on":""}" tabindex="0" role="radio" aria-checked="${!!it.on}"
      onclick='${it.call}' onkeydown='if(event.key==="Enter"||event.key===" "){event.preventDefault();${it.call}}'>
      <span class="dot"></span>${it.slug?iconImg(it.slug,20):""}
      <span class="rl"><b>${esc(it.label)}</b>${it.sub?`<small>${esc(it.sub)}</small>`:""}</span>
    </div>`).join("")}</div>`;
}
// mitemHTML renders one checkbox row of a multi-select. mlistHTML groups them
// under category subheads when the items carry a category.
function mitemHTML(it){
  return `<div class="mitem${it.on?" on":""}" tabindex="0" role="checkbox" aria-checked="${!!it.on}"
    onclick='${it.call}' onkeydown='if(event.key==="Enter"||event.key===" "){event.preventDefault();${it.call}}'>
    <span class="box"></span>${it.slug?iconImg(it.slug,20):""}
    <span class="ml"><b>${esc(it.label)}</b>${it.sub?`<small>${esc(it.sub)}</small>`:""}</span>
  </div>`;
}

// opt builds the retired-for-selection passive chip (still used for quick-jump

function opt(on,text,sub,onclick,icon){

function group(title,nodes){

// envProvidesDb reports the database an environment brings up itself, as its
// `db-<name>` provide (laravel-docker provides db-mysql). When an env does that,
// the project's database is fixed by the env, so offering a Database step lets a
// user pick a conflicting one (postgres on a mysql env) that the resolver then
// refuses. Returns the db name (e.g. "mysql") or "".
function envProvidesDb(){
  const e=sel.env&&byId(sel.env);if(!e)return "";
  const cap=(e.provides||[]).find(p=>p.indexOf("db-")===0);
  return cap?cap.slice(3):"";
}
function buildSteps(){
  const steps=[{key:"lang",title:"Language"},{key:"framework",title:"Framework"}];
  const fw=sel.framework;
  if(fw){
    steps.push({key:"env",title:"Local dev environment",kind:"env"});
    if(webFor(fw).length)steps.push({key:"web",title:"Web server",kind:"web"});
    // Skip the Database step when the environment already brings one: the choice
    // would be a trap (its alternatives conflict with the env's db).
    if(forFw(fw,"db").length&&!envProvidesDb())steps.push({key:"db",title:"Database",kind:"db"});
    if(forFw(fw,"frontend").length)steps.push({key:"frontend",title:"Frontend",kind:"frontend",optional:true});
    if(svcFor(fw).length)steps.push({key:"service",title:"Services",kind:"service",multi:true});
    if(forFw(fw,"addon").length)steps.push({key:"addon",title:"Add-ons",kind:"addon",multi:true});
    if(forFw(fw,"extra").length)steps.push({key:"extra",title:"Extras",kind:"extra",multi:true});
    if(PLUGIN_OPTS.length)steps.push({key:"plugopts",title:"AI & assistants",kind:"plugopts"});
    steps.push({key:"review",title:"Review & build"});
  }
  return steps;
}
function goStep(i){const n=buildSteps().length;buildStep=Math.max(0,Math.min(i,n-1));renderBuild(gc());syncURL();}
function chooseSingle(key,val,advance){sel[key]=val;if(key==="lang"){sel.framework=null;resetDeps();PLUGIN_OPTS=[];pluginOptsFw=null;}if(key==="framework"){resetDeps();defaults();loadPluginOpts();}if(key==="env"&&envProvidesDb())sel.db=null;/* the env brings its own db; drop any picked one so it can't conflict */
  /* Selecting an option no longer jumps to the next step (advance is kept for
     call-site compatibility but ignored): the step stays open with the choice
     highlighted, and the user clicks Next when ready. */
  void advance;renderBuild(gc());resolve();}
function chooseFramework(F){if(F.variants.length===1){chooseSingle("framework",F.primary.id,true);return;}sel.framework=F.primary.id;resetDeps();defaults();loadPluginOpts();renderBuild(gc());resolve();}
function chooseVariant(id){sel.framework=id;resetDeps();defaults();loadPluginOpts();renderBuild(gc());resolve();}
function applyBuildFilter(){
  const q=svcFilter.trim().toLowerCase();
  const host=document.getElementById("buildmlist");if(!host)return;
  host.querySelectorAll(".msub").forEach(h=>{
    let any=false,el=h.nextElementSibling;
    while(el&&el.classList.contains("mitem")){
      const show=!q||el.textContent.toLowerCase().includes(q);el.style.display=show?"":"none";if(show)any=true;el=el.nextElementSibling;
    }
    h.style.display=any?"":"none";
  });
  host.querySelectorAll(":scope > .mitem").forEach(el=>{const show=!q||el.textContent.toLowerCase().includes(q);el.style.display=show?"":"none";});

// buildStepChosen reports whether a step's requirement is met (drives done-state,
// the collapsed summary, and whether later steps unlock).
function buildStepChosen(st){
  if(st.key==="lang")return !!sel.lang;
  if(st.key==="framework")return !!sel.framework;
  if(st.key==="web")return true;             // "None" is a valid choice
  if(st.key==="plugopts"||st.key==="review")return true;
  if(st.multi||st.optional)return true;      // an empty multi/optional is legitimate
  return !!sel[st.key];
}
// buildStepSummary is the one-line collapsed summary shown on a done accordion.
function buildStepSummary(st){
  const fw=sel.framework,nameOf=(k,id)=>{const r=byId(id);return r?(r.label||r.id):id;};
  if(st.key==="lang")return sel.lang?(label[sel.lang]||sel.lang):"";
  if(st.key==="framework")return sel.framework?nameOf("framework",sel.framework):"";
  if(st.key==="env")return sel.env?nameOf("env",sel.env):"";
  if(st.key==="db")return sel.db?nameOf("db",sel.db):"";
  if(st.key==="frontend")return sel.frontend?nameOf("frontend",sel.frontend):"none";
  if(st.key==="web"){const wsel=chosenWeb();return wsel?nameOf("service",wsel):"none";}
  if(st.multi){const a=sel[st.key]||[];return a.length?a.map(id=>nameOf(st.kind,id)).join(", "):"none";}
  if(st.key==="plugopts"){const n=Object.values(pluginChoices).reduce((s,a)=>s+(a?a.length:0),0);return n?n+" selected":"defaults";}
  return "";
}
// buildStepBody returns the accordion body HTML for the open step — a radio list
// for a single-select, a checkbox list (with a filter + subheads) for a multi, or
// the review/plugin-opts form. This is the same buildSteps()/chooseSingle logic;
// only the presentation moved from pill clouds to the shared primitives.
function buildStepBody(st){
  const fw=sel.framework;
  if(st.key==="lang"){
    return rlistHTML(LANGS.map(l=>({on:sel.lang===l,label:label[l]||l,slug:iconSlug(l),call:`chooseSingle("lang",${jarg(l)},true)`})));
  }
  if(st.key==="framework"){
    const fams=families(sel.lang);
    let h=rlistHTML(fams.map(F=>({on:F.variants.some(v=>v.id===sel.framework),label:F.primary.label,slug:iconSlug(F.primary),call:`chooseFramilyByKey(${jarg(F.key)})`})));
    const cur=fams.find(F=>F.variants.some(v=>v.id===sel.framework));
    if(cur&&cur.variants.length>1){
      h+=`<div class="msub">Framework type</div>`+rlistHTML(cur.variants.map(v=>({on:sel.framework===v.id,label:v.variant||v.label,slug:iconSlug(v),call:`chooseVariant(${jarg(v.id)})`})));
    }
    return h;
  }
  if(st.key==="web"){
    const items=webFor(fw).map(e=>({on:chosenWeb()===e.id,label:e.label,slug:iconSlug(e),call:`chooseWeb(${jarg(e.id)})`}));
    items.push({on:!chosenWeb(),label:"None (I'll front it myself)",call:`chooseWeb(null)`});
    return rlistHTML(items);
  }
  if(st.multi){
    const items=st.kind==="service"?svcFor(fw):forFw(fw,st.kind);
    const mk=e=>mitemHTML({on:sel[st.key].includes(e.id),label:e.label,slug:iconSlug(e),call:`toggleBuild(${jarg(st.key)},${jarg(e.id)})`});
    if(items.some(e=>e.category)){
      const cats={};items.forEach(e=>{const k=e.category||"Other";(cats[k]=cats[k]||[]).push(e);});
      const groups=Object.keys(cats).sort().map(cat=>`<div class="msub">${esc(cat)}</div>`+cats[cat].map(mk).join("")).join("");
      return `<input class="mfilter" placeholder="Filter ${esc(st.title.toLowerCase())}…  (try: search, cache, queue)" value="${esc(svcFilter)}" oninput="svcFilter=this.value;applyBuildFilter()">
        <div class="mlist" id="buildmlist">${groups}</div>`;
    }
    return `<div class="mlist" id="buildmlist">${items.map(mk).join("")}</div>`;
  }
  if(st.optional){
    const items=[{on:!sel[st.key],label:"None",call:`chooseSingle(${jarg(st.key)},null,true)`}]
      .concat(forFw(fw,st.kind).map(e=>({on:sel[st.key]===e.id,label:e.label,slug:iconSlug(e),call:`chooseSingle(${jarg(st.key)},${jarg(e.id)},true)`})));
    return rlistHTML(items);
  }
  // plain single-select (env, db)
  return rlistHTML(forFw(fw,st.kind).map(e=>({on:sel[st.key]===e.id,label:e.label,slug:iconSlug(e),call:`chooseSingle(${jarg(st.key)},${jarg(e.id)},true)`})));
}
// toggleBuild / chooseFramilyByKey are the accordion-friendly wrappers around the
// existing toggle()/chooseFramework() so the rlist/mlist call strings stay simple.
// conflictsWith reports whether two recipes exclude each other, by capability:
// one's conflicts meeting the other's provides (two search engines both provide
// and conflict on "search").
function conflictsWith(a,b){
  if(!a||!b)return false;
  const ap=a.provides||[],ac=a.conflicts||[],bp=b.provides||[],bc=b.conflicts||[];
  return ac.some(c=>bp.includes(c))||bc.some(c=>ap.includes(c));
}
function toggleBuild(k,id){
  const arr=sel[k]||(sel[k]=[]);
  // Adding a service that excludes an already-picked one (a second search
  // engine, a second queue) would only fail at resolve. Swap instead, and say so
  // with a toast, so "one of these at a time" is enforced up front.
  if(k==="service"&&arr.indexOf(id)<0){
    const s=byId(id);
    const clash=arr.map(byId).find(o=>conflictsWith(s,o));
    if(clash){
      // Hard conflict (Elasticsearch and OpenSearch share a port): swap, do not stack.
      toggle(k,clash.id);toggle(k,id);
      toast(`Only one ${clash.category||"of these"} at a time: replaced ${clash.label} with ${s.label}.`,{kind:"info",id:"svcSwap"});
      renderBuild(gc());resolve();return;
    }
    // Soft warning: a second service in a role a project almost always wants one
    // of (a search engine). Allowed, but flagged so it is a choice, not a slip.
    for(const role of ["search"]){
      if((s.provides||[]).includes(role)){
        const other=arr.map(byId).find(o=>o&&(o.provides||[]).includes(role));
        if(other)toast(`You already added ${other.label}. Most projects need one ${role} engine, not two.`,{kind:"info",id:"svcDup"});
      }
    }
  }
  toggle(k,id);renderBuild(gc());resolve();
}
function chooseFramilyByKey(key){const F=families(sel.lang).find(x=>x.key===key);if(F)chooseFramework(F);}
function renderBuild(c){

  // column jumped back to the top on every click (the "bounce"). Capture the
  // column's scroll first and restore it after the rebuild.
  const prevTree=document.getElementById("tree");const savedScroll=prevTree?prevTree.scrollTop:0;
  c.innerHTML=pageHead("Build a stack","Compose a new project step by step: keel wires the env, database, services and add-ons, then runs the real installers. Each step opens in turn; earlier ones collapse to a summary, later ones unlock as their prerequisites are met. The plan on the right updates live.")
    +`<div class="wrap2" style="height:calc(100% - 84px)"><div class="colL" id="tree"></div><div class="colR" id="plan"></div></div>`;
  const t=document.getElementById("tree");
  // One accordion per step. A step before the cursor is "done" (collapses to a
  // summary), the cursor step is "open", and a later step is "locked" until the
  // step before it is satisfied — a real prereq gate, not just visual.
  let firstUnmet=steps.findIndex(s=>!buildStepChosen(s));
  if(firstUnmet<0)firstUnmet=steps.length-1;
  const html=steps.map((st,i)=>{
    let state;
    if(i===buildStep)state="open";
    else if(i>firstUnmet)state="locked";
    else state=buildStepChosen(st)?"done":"open";
    const body=state==="open"?buildStepBody(st):"";
    const summary=state==="done"?buildStepSummary(st):(state==="locked"?"complete the step above first":"");
    return accHTML(i+1,st.title,summary,state,`goStep(${i})`,state==="open"?body:"");
  }).join("");
  t.innerHTML=html;
  // The review step (always the last, always open when reached) carries its own
  // Build/Preview buttons via reviewStep(); other steps get Back/Next.
  const st=steps[buildStep];
  if(st.key==="review"){
    const holder=document.createElement("div");holder.appendChild(reviewStep());
    // reviewStep builds credential inputs + name + build buttons; mount it into the
    // open review accordion's body.
    const openBody=t.querySelector(".acc.open .acc-body");
    if(openBody){openBody.innerHTML="";openBody.appendChild(holder);}
  }else if(st.key==="plugopts"){
    const openBody=t.querySelector(".acc.open .acc-body");
    if(openBody){openBody.innerHTML="";openBody.appendChild(pluginOptsStep());}
  }

  // reachable without scrolling to the end of a long service list.

  // A floating bar, lifted clear of the console drawer below (bottom gap + a
  // shadow) so it reads as hovering over the step list, not buried under the seam.
  nav.style.cssText="position:sticky;bottom:14px;margin-top:var(--s4);padding:11px 14px;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 28px -10px rgba(0,0,0,.7)";
  const back=document.createElement("button");back.className="btn ghost";back.textContent="← Back";back.disabled=buildStep===0;back.onclick=()=>goStep(buildStep-1);
  nav.appendChild(back);
  if(st.key!=="review"){
    const next=document.createElement("button");next.className="btn";next.textContent="Next →";
    next.disabled=!buildStepChosen(st);next.onclick=()=>goStep(buildStep+1);
    nav.appendChild(next);
  }
  t.appendChild(nav);
  t.scrollTop=savedScroll; // restore the column scroll captured before the rebuild
  resolve();
}

// pluginOptsStep renders the applicable plugins' wizard options (fetched from

// defaults. The picks are posted with the build and applied by the same plugin

function pluginOptsStep(){
