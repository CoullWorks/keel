  - path: frontend/app/page.tsx
    content: |
      // keel: a production-ready landing page that proves the environment works -
      // a headless Next.js frontend that consumes the Django REST API. Click
      // "Call the Django API" to hit the backend through the credentialed client.
      "use client";

      import { useState } from "react";
      import { api } from "@/lib/api";

      const features: [string, string][] = [
        ["Headless Next.js", "React Server + Client Components, App Router."],
        ["Django REST API", "Same host, shared session cookie, no token in JS."],
        ["keel-managed", "keel run dev · test · build, one vocabulary."],
      ];

      export default function Home() {
        const [out, setOut] = useState("Not called yet.");

        async function callApi() {
          setOut("Calling…");
          try {
            const res = await api("/api/");
            setOut(res.ok ? await res.text() : `Error ${res.status}`);
          } catch (err) {
            setOut(`Request failed: ${String(err)}`);
          }
        }

        return (
          <main className="min-h-screen bg-slate-950 text-slate-100">
            <div className="mx-auto max-w-3xl px-6 py-20">
              <span className="inline-flex items-center gap-2 rounded-full border border-emerald-500/30 bg-emerald-500/10 px-3 py-1 text-xs font-medium text-emerald-300">
                <span className="size-1.5 rounded-full bg-emerald-400" /> running
              </span>
              <h1 className="mt-6 text-4xl font-bold tracking-tight sm:text-5xl">
                Your Django app is running
              </h1>
              <p className="mt-4 text-lg text-slate-400">
                A headless Next.js frontend, styled with Tailwind and scaffolded by keel,
                consuming the Django REST API. Edit{" "}
                <code className="rounded bg-slate-800 px-1.5 py-0.5 text-sm">app/page.tsx</code>{" "}
                to make it yours.
              </p>
              <div className="mt-8 flex flex-wrap gap-3">
                <a
                  href="https://coullworks.com/tools/keel"
                  className="rounded-lg bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-emerald-400"
                >
                  keel docs
                </a>
                <a
                  href="https://nextjs.org/docs"
                  className="rounded-lg border border-slate-700 px-4 py-2 text-sm font-semibold hover:bg-slate-900"
                >
                  Next.js docs
                </a>
              </div>

              <div className="mt-10 rounded-xl border border-slate-800 bg-slate-900/50 p-5">
                <p className="text-sm text-slate-400">
                  API: <code className="rounded bg-slate-800 px-1.5 py-0.5 text-sm">{process.env.NEXT_PUBLIC_API_URL}</code>
                </p>
                <button
                  onClick={callApi}
                  className="mt-3 rounded-lg border border-slate-700 px-4 py-2 text-sm font-semibold hover:bg-slate-800"
                >
                  Call the Django API
                </button>
                <pre className="mt-4 overflow-x-auto rounded-lg bg-slate-950 p-4 text-sm text-slate-300 ring-1 ring-slate-800">
                  {out}
                </pre>
              </div>

              <div className="mt-12 grid gap-4 sm:grid-cols-3">
                {features.map(([title, body]) => (
                  <div
                    key={title}
                    className="rounded-xl border border-slate-800 bg-slate-900/50 p-5"
                  >
                    <h2 className="font-semibold">{title}</h2>
                    <p className="mt-1 text-sm text-slate-400">{body}</p>
                  </div>
                ))}
              </div>
            </div>
          </main>
        );
      }
