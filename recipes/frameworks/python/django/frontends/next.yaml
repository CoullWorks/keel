id: django-next
kind: frontend
label: Next.js SPA (DRF session auth + login/register/reset)
appliesTo: [django]
requires: [python]
provides: [frontend, next, auth]
priority: 60 # after backend + env + db + services
install:
  - "{{restart}}"
smoke:
  # The frontend still has to build...
  - "{{exec}} bash -lc 'cd frontend && npm run build'"
  # ...and the backend has to accept the auth wiring: `check` imports every
  # settings.d/urls.d fragment and every view referenced by a URL, so a typo in
  # the accounts app fails here. This proves the login endpoints are real, the
  # DRF equivalent of breeze.yaml curling GET /login.
  - "{{manage}} check"
files:
  - path: .ddev/config.frontend.yaml
    content: |
      # Injects the SPA origin into the backend (django-cors-headers reads these)
      # and runs the Next dev server in the web container, exposed on :3001 (https).
      # Same host as the API → the session cookie is shared (SameSite=Lax is fine).
      web_environment:
        - CORS_ALLOWED_ORIGINS=https://{{project}}.ddev.site:3001
        - CSRF_TRUSTED_ORIGINS=https://{{project}}.ddev.site:3001
      web_extra_exposed_ports:
        - name: nextjs
          container_port: 3000
          http_port: 3000
          https_port: 3001
      web_extra_daemons:
        - name: nextjs
          command: "bash -lc 'npm install && npm run dev -- -H 0.0.0.0 -p 3000'"
          directory: /var/www/html/frontend
  - path: AUTH-SETUP.md
    content: |
      <!-- keel-generated -->
      # Frontend + auth wiring (Next.js + Django REST Framework)

      keel scaffolded a Next.js SPA in `frontend/`, running in DDEV at
      **https://{{project}}.ddev.site:3001**, talking to the Django API at
      **https://{{project}}.ddev.site**. Same host → the session cookie is shared,
      so this uses **DRF SessionAuthentication** (the most secure option when the
      constraint holds - no token in JS).

      ## Already wired - no manual step
      The login endpoints are scaffolded and live under `/api/auth/`:

      | Method & path                       | Does                                            |
      |-------------------------------------|-------------------------------------------------|
      | `GET  /api/auth/csrf/`              | Primes the `csrftoken` cookie (call on load)    |
      | `POST /api/auth/register/`          | Create an account (username, email, password)   |
      | `POST /api/auth/login/`             | Session login (sets the session cookie)         |
      | `POST /api/auth/logout/`            | End the session                                 |
      | `POST /api/auth/password/reset/`    | Request a reset token (enumeration-safe)        |
      | `POST /api/auth/password/reset/confirm/` | Set a new password with the token          |
      | `GET  /api/auth/me/`                | The signed-in user (401 if not authenticated)   |

      These live in the `accounts/` app and are mounted by
      `config/urls.d/50-accounts.py`; the app is registered by
      `config/settings.d/50-accounts.py`. Both use only Django's built-in auth and
      DRF - no extra dependency.

      - `settings.py` - `corsheaders` + `CorsMiddleware` (first), `CORS_ALLOW_CREDENTIALS`,
        and `CORS_ALLOWED_ORIGINS` / `CSRF_TRUSTED_ORIGINS` read from the env vars this
        recipe injects via DDEV `web_environment`.
      - `frontend/lib/api.ts` - primes CSRF and sends `credentials` + the
        `X-CSRFToken` header (from the `csrftoken` cookie) on mutating requests.

      ## Before you ship
      - The reset endpoint returns the token in the JSON response in DEBUG so you
        can test the flow. In production, email the token instead (wire a mailer)
        and stop returning it - the fragment already guards on `settings.DEBUG`.

      ## Going cross-domain / independent?
      If the SPA and API can't share a host (e.g. Vercel + separate API), switch to
      **JWT** (add the `django-simplejwt` add-on + Auth.js) and carry the token in
      `Authorization: Bearer` - no shared cookie needed.
  # --- the DRF session-auth login/register/reset endpoints keel owns ---
  # A dedicated app so the views, serializers and URLs are namespaced and easy to
  # replace. It uses only Django's built-in auth + DRF, so there is no new model
  # and no migration to run.
  - path: accounts/__init__.py
    content: |
      # keel-generated.
  - path: accounts/serializers.py
    content: |
      # keel-generated. Serializers for the DRF session-auth endpoints. The
      # built-in User model is used as-is, so registration creates a standard
      # Django user (password hashed by create_user).
      from django.contrib.auth import get_user_model
      from django.contrib.auth.password_validation import validate_password
      from rest_framework import serializers

      User = get_user_model()


      class RegisterSerializer(serializers.ModelSerializer):
          password = serializers.CharField(write_only=True, validators=[validate_password])

          class Meta:
              model = User
              fields = ["username", "email", "password"]

          def create(self, validated_data: dict) -> "User":
              return User.objects.create_user(
                  username=validated_data["username"],
                  email=validated_data.get("email", ""),
                  password=validated_data["password"],
              )


      class LoginSerializer(serializers.Serializer):
          username = serializers.CharField()
          password = serializers.CharField(write_only=True)


      class PasswordResetSerializer(serializers.Serializer):
          email = serializers.EmailField()


      class PasswordResetConfirmSerializer(serializers.Serializer):
          uid = serializers.CharField()
          token = serializers.CharField()
          password = serializers.CharField(write_only=True, validators=[validate_password])
  - path: accounts/views.py
    content: |
      # keel-generated. DRF session-auth views: CSRF prime, register, login,
      # logout, password reset request/confirm, and the protected `me`. Session
      # auth means login sets the session cookie the SPA already sends with
      # credentials - no token handling in JS.
      from django.conf import settings
      from django.contrib.auth import authenticate, get_user_model, login, logout
      from django.contrib.auth.tokens import default_token_generator
      from django.utils.encoding import force_bytes, force_str
      from django.utils.http import urlsafe_base64_decode, urlsafe_base64_encode
      from django.views.decorators.csrf import ensure_csrf_cookie
      from django.utils.decorators import method_decorator
      from rest_framework import permissions, status
      from rest_framework.request import Request
      from rest_framework.response import Response
      from rest_framework.views import APIView

      from .serializers import (
          LoginSerializer,
          PasswordResetConfirmSerializer,
          PasswordResetSerializer,
          RegisterSerializer,
      )

      User = get_user_model()


      @method_decorator(ensure_csrf_cookie, name="get")
      class CSRFView(APIView):
          """Sets the csrftoken cookie so the SPA can send X-CSRFToken."""

          permission_classes = [permissions.AllowAny]

          def get(self, request: Request) -> Response:
              return Response({"detail": "CSRF cookie set"})


      class RegisterView(APIView):
          permission_classes = [permissions.AllowAny]

          def post(self, request: Request) -> Response:
              serializer = RegisterSerializer(data=request.data)
              serializer.is_valid(raise_exception=True)
              user = serializer.save()
              return Response(
                  {"id": user.pk, "username": user.get_username()},
                  status=status.HTTP_201_CREATED,
              )


      class LoginView(APIView):
          permission_classes = [permissions.AllowAny]

          def post(self, request: Request) -> Response:
              serializer = LoginSerializer(data=request.data)
              serializer.is_valid(raise_exception=True)
              user = authenticate(request, **serializer.validated_data)
              if user is None:
                  return Response(
                      {"detail": "Invalid credentials"},
                      status=status.HTTP_401_UNAUTHORIZED,
                  )
              login(request, user)
              return Response({"id": user.pk, "username": user.get_username()})


      class LogoutView(APIView):
          permission_classes = [permissions.IsAuthenticated]

          def post(self, request: Request) -> Response:
              logout(request)
              return Response(status=status.HTTP_204_NO_CONTENT)


      class PasswordResetView(APIView):
          permission_classes = [permissions.AllowAny]

          def post(self, request: Request) -> Response:
              serializer = PasswordResetSerializer(data=request.data)
              serializer.is_valid(raise_exception=True)
              email = serializer.validated_data["email"]
              user = User.objects.filter(email=email).first()
              body: dict = {"detail": "If that email exists, a reset link was sent."}
              if user is not None:
                  uid = urlsafe_base64_encode(force_bytes(user.pk))
                  token = default_token_generator.make_token(user)
                  # In production, EMAIL the uid+token as a link and remove this.
                  # Returning it only under DEBUG lets you test the flow locally
                  # without a mailer, and never leaks a token in production.
                  if settings.DEBUG:
                      body["uid"] = uid
                      body["token"] = token
              # Always 200, so an attacker cannot tell which emails have accounts.
              return Response(body)


      class PasswordResetConfirmView(APIView):
          permission_classes = [permissions.AllowAny]

          def post(self, request: Request) -> Response:
              serializer = PasswordResetConfirmSerializer(data=request.data)
              serializer.is_valid(raise_exception=True)
              data = serializer.validated_data
              try:
                  uid = force_str(urlsafe_base64_decode(data["uid"]))
                  user = User.objects.get(pk=uid)
              except (TypeError, ValueError, OverflowError, User.DoesNotExist):
                  user = None
              if user is None or not default_token_generator.check_token(user, data["token"]):
                  return Response(
                      {"detail": "Invalid or expired token"},
                      status=status.HTTP_400_BAD_REQUEST,
                  )
              user.set_password(data["password"])
              user.save(update_fields=["password"])
              return Response({"detail": "Password updated"})


      class MeView(APIView):
          permission_classes = [permissions.IsAuthenticated]

          def get(self, request: Request) -> Response:
              u = request.user
              return Response({"id": u.pk, "username": u.get_username(), "email": u.email})
  - path: accounts/urls.py
    content: |
      # keel-generated. The auth endpoints, mounted under /api/auth/ by
      # config/urls.d/50-accounts.py.
      from django.urls import path

      from .views import (
          CSRFView,
          LoginView,
          LogoutView,
          MeView,
          PasswordResetConfirmView,
          PasswordResetView,
          RegisterView,
      )

      urlpatterns = [
          path("csrf/", CSRFView.as_view(), name="csrf"),
          path("register/", RegisterView.as_view(), name="register"),
          path("login/", LoginView.as_view(), name="login"),
          path("logout/", LogoutView.as_view(), name="logout"),
          path("password/reset/", PasswordResetView.as_view(), name="password_reset"),
          path(
              "password/reset/confirm/",
              PasswordResetConfirmView.as_view(),
              name="password_reset_confirm",
          ),
          path("me/", MeView.as_view(), name="me"),
      ]
  - path: accounts/tests.py
    content: |
      # keel-generated. Proves the session-auth flow end to end against the built
      # DRF endpoints: register → login → protected me → logout. Runs under the
      # framework's pytest-django (`keel run test`).
      import pytest
      from django.contrib.auth import get_user_model
      from rest_framework.test import APIClient

      User = get_user_model()


      @pytest.mark.django_db
      def test_register_login_me_logout() -> None:
          client = APIClient()

          r = client.post(
              "/api/auth/register/",
              {"username": "alice", "email": "a@example.com", "password": "sup3rs3cret!"},
              format="json",
          )
          assert r.status_code == 201

          # Not logged in yet: the protected endpoint refuses.
          assert client.get("/api/auth/me/").status_code in (401, 403)

          r = client.post(
              "/api/auth/login/",
              {"username": "alice", "password": "sup3rs3cret!"},
              format="json",
          )
          assert r.status_code == 200

          me = client.get("/api/auth/me/")
          assert me.status_code == 200
          assert me.json()["username"] == "alice"

          assert client.post("/api/auth/logout/").status_code == 204
          assert client.get("/api/auth/me/").status_code in (401, 403)


      @pytest.mark.django_db
      def test_password_reset_is_enumeration_safe() -> None:
          client = APIClient()
          # An address with no account still gets a 200 and no token.
          r = client.post(
              "/api/auth/password/reset/", {"email": "nobody@example.com"}, format="json"
          )
          assert r.status_code == 200
          assert "token" not in r.json()
  # Registers the accounts app so Django loads its views. It contributes no model,
  # so there is nothing to migrate.
  - path: config/settings.d/50-accounts.py
    content: |
      # keel-generated. Enables the accounts app that ships the auth endpoints.
      # Installing an app is not the same as enabling it - without this line the
      # views exist but Django never loads the app.
      INSTALLED_APPS += ["accounts"]
  # Mounts the endpoints under /api/auth/. Appends to urlpatterns via the urls.d
  # loader, so it coexists with any other add-on that mounts routes.
  - path: config/urls.d/50-accounts.py
    content: |
      # keel-generated. Mounts the session-auth endpoints. The views do nothing
      # until a URL reaches them, which is what config/urls.d is for.
      from django.urls import include

      urlpatterns += [path("api/auth/", include("accounts.urls"))]
