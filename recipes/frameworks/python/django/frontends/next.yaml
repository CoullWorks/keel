  - path: frontend/lib/api.ts
    content: |
      // keel-generated. Minimal DRF session client: send credentials, and the
      // X-CSRFToken header (from Django's csrftoken cookie) on mutating requests.
      const API = process.env.NEXT_PUBLIC_API_URL ?? "";

      function cookie(name: string): string | undefined {
        return document.cookie
          .split("; ")
          .find((c) => c.startsWith(name + "="))
          ?.split("=")[1];
      }

      export async function api(path: string, init: RequestInit = {}): Promise<Response> {
        const method = (init.method ?? "GET").toUpperCase();
        const csrf = cookie("csrftoken");
        return fetch(`${API}${path}`, {
          ...init,
          credentials: "include",
          headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
            ...(csrf && method !== "GET" ? { "X-CSRFToken": csrf } : {}),
            ...(init.headers ?? {}),
          },
        });
      }

      // Prime the csrftoken cookie before the first mutating request. Call this
      // once on app load (Django sets the cookie on this GET).
      export function primeCsrf(): Promise<Response> {
        return api("/api/auth/csrf/");
      }

      // Thin wrappers over the endpoints the django-next recipe scaffolds. Session
      // auth means a successful login sets the cookie and every later `api()` call
      // is authenticated automatically.
      export const auth = {
        register: (username: string, email: string, password: string) =>
          api("/api/auth/register/", { method: "POST", body: JSON.stringify({ username, email, password }) }),
        login: (username: string, password: string) =>
          api("/api/auth/login/", { method: "POST", body: JSON.stringify({ username, password }) }),
        logout: () => api("/api/auth/logout/", { method: "POST" }),
        me: () => api("/api/auth/me/"),
        requestReset: (email: string) =>
          api("/api/auth/password/reset/", { method: "POST", body: JSON.stringify({ email }) }),
        confirmReset: (uid: string, token: string, password: string) =>
          api("/api/auth/password/reset/confirm/", { method: "POST", body: JSON.stringify({ uid, token, password }) }),
      };
  - path: frontend/postcss.config.mjs
