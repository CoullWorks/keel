id: flask
kind: framework
label: Flask (micro web framework)
lang: python
provides: [python, flask]
default: false
updated: 2026-08-07
pins:
  flask: ">=3.1"
  python: "3.13"
# The Python line is a choice. This framework supports a range, so keel
# recommends one and offers the rest. The Dockerfile reads the answer as
# {{pin.python_version}}.
versions:
  python_version:
    label: Python version
    # The values are full patch versions, not 3.13: the Dockerfiles pin a
    # patch on purpose, so that an unrelated rebuild cannot become an
    # unreviewed Python upgrade. Choosing a line must not give that up.
    recommended: "3.13.15"
    options:
      - value: "3.11.14"
        label: "Python 3.11"
        note: "security fixes to Oct 2027"
      - value: "3.12.12"
        label: "Python 3.12"
        note: "security fixes to Oct 2028"
      - value: "3.13.15"
        label: "Python 3.13"
        note: "current stable, widest wheel coverage"
      - value: "3.14.2"
        label: "Python 3.14"
        note: "newest; check your C-extension deps have wheels"
install:
  # The stack has to be up before anything can exec into it. Under a native
  # env {{start}} renders empty and the engine drops the no-op step.
  - "{{start}}"
  - "{{exec}} uv sync"
  # The app started before its dependencies existed, so bring it back up now
  # that they are installed. Renders empty, and is dropped, on a native env.
  - "{{restart}}"
smoke:
  - "{{exec}} uv run python -c 'import app'"
files:
  - path: pyproject.toml
    content: |
      [project]
      name = "app"
      version = "0.1.0"
      requires-python = ">=3.11"
      # gunicorn is a dependency, not an afterthought: Flask is "a WSGI
      # application", not a server, and its own deployment page is explicit that
      # the development server is not for production. Declaring it here rather
      # than installing it in the Docker image means a later `uv sync`, which
      # makes the environment match the lockfile exactly, cannot prune the very
      # process that serves the app.
      dependencies = ["flask>=3.1", "gunicorn>=26.0"]
  - path: app.py
    content: |
      import os

      from flask import Flask

      app = Flask(__name__)


      # The route keel's own URL points at. Without it a freshly built project
      # answered 404 at the address the build printed, which reads as a broken
      # stack rather than an empty one - and the FastAPI skeleton beside this
      # one has always had it, so the two disagreed about what "new project"
      # means.
      @app.get("/")
      def index():
          return {"app": "keel Flask", "db": os.environ.get("KEEL_DB", "sqlite")}


      @app.get("/health")
      def health():
          return {"status": "healthy"}


      if __name__ == "__main__":
          app.run(debug=True)
  - path: .env.example
    content: |
      # Copy to .env. Generate secrets with: keel secrets sync
      FLASK_SECRET_KEY=change-me
  - path: .gitignore
    content: |
      .venv/
      __pycache__/
      .env
tasks:
  test: "{{exec}} uv run pytest"
  lint: "{{exec}} uv run ruff check ."
  dev: "{{exec}} uv run flask --app app run --debug"
  run: "{{exec}} uv run python app.py"
