id: streamlit
kind: framework
label: Streamlit (data apps / dashboards)
lang: python
provides: [python, streamlit]
default: false
updated: 2026-08-07
pins:
  streamlit: ">=1.40"
  python: "3.13"
# The Python line is a choice. This framework supports a range, so keel
# recommends one and offers the rest. The Dockerfile reads the answer as
# {{pin.python_version}}.
versions:
  python_version:
    label: Python version
    # The values are full patch versions, not 3.13: the Dockerfiles pin a
    # patch on purpose, so that an unrelated rebuild cannot become an
    # unreviewed Python upgrade. Choosing a line must not give that up.
    recommended: "3.13.15"
    options:
      - value: "3.11.14"
        label: "Python 3.11"
        note: "security fixes to Oct 2027"
      - value: "3.12.12"
        label: "Python 3.12"
        note: "security fixes to Oct 2028"
      - value: "3.13.15"
        label: "Python 3.13"
        note: "current stable, widest wheel coverage"
      - value: "3.14.2"
        label: "Python 3.14"
        note: "newest; check your C-extension deps have wheels"
install:
  # The stack has to be up before anything can exec into it. Under a native
  # env {{start}} renders empty and the engine drops the no-op step.
  - "{{start}}"
  - "{{exec}} uv sync"
  # The app started before its dependencies existed, so bring it back up now
  # that they are installed. Renders empty, and is dropped, on a native env.
  - "{{restart}}"
smoke:
  - "{{exec}} uv run python -c 'import streamlit'"
files:
  - path: pyproject.toml
    content: |
      [project]
      name = "app"
      version = "0.1.0"
      requires-python = ">=3.11"
      dependencies = ["streamlit>=1.40"]
  - path: streamlit_app.py
    content: |
      import streamlit as st

      st.set_page_config(page_title="app")
      st.title("Streamlit")
      st.write("Scaffolded by keel. Edit streamlit_app.py to get started.")

      name = st.text_input("Your name", "world")
      st.write(f"Hello, {name}!")
  - path: .gitignore
    content: |
      .venv/
      __pycache__/
      .env
tasks:
  test: "{{exec}} uv run pytest"
  lint: "{{exec}} uv run ruff check ."
  dev: "{{exec}} uv run streamlit run streamlit_app.py"
  run: "{{exec}} uv run streamlit run streamlit_app.py"
