id: reflex
kind: framework
label: Reflex (pure-Python full-stack web)
lang: python
provides: [python, reflex]
default: false
updated: 2026-08-07
pins:
  reflex: ">=0.6"
  python: "3.13"
# The Python line is a choice. This framework supports a range, so keel
# recommends one and offers the rest. The Dockerfile reads the answer as
# {{pin.python_version}}.
versions:
  python_version:
    label: Python version
    # The values are full patch versions, not 3.13: the Dockerfiles pin a
    # patch on purpose, so that an unrelated rebuild cannot become an
    # unreviewed Python upgrade. Choosing a line must not give that up.
    recommended: "3.13.15"
    options:
      - value: "3.11.14"
        label: "Python 3.11"
        note: "security fixes to Oct 2027"
      - value: "3.12.12"
        label: "Python 3.12"
        note: "security fixes to Oct 2028"
      - value: "3.13.15"
        label: "Python 3.13"
        note: "current stable, widest wheel coverage"
      - value: "3.14.2"
        label: "Python 3.14"
        note: "newest; check your C-extension deps have wheels"
# Minimal Reflex app in the conventional layout (rxconfig app_name == module dir).
# `reflex run` fetches its frontend template on first run.
install:
  # The stack has to be up before anything can exec into it. Under a native
  # env {{start}} renders empty and the engine drops the no-op step.
  - "{{start}}"
  - "{{exec}} uv sync"
  # The app started before its dependencies existed, so bring it back up now
  # that they are installed. Renders empty, and is dropped, on a native env.
  - "{{restart}}"
smoke:
  - "{{exec}} uv run python -c 'import reflex'"
files:
  # Docker creates any missing parent of a mount point, and it creates it as
  # root. compose mounts the `upload-data` named volume at /app/uploaded_files, which sits
  # inside the project bind mount, so without this the daemon creates
  # uploaded_files on your host owned by root: it turns up in `git status`,
  # the application cannot write to it, and you need sudo to delete your own
  # project.
  #
  # Writing this placeholder makes keel create the directory as the invoking
  # user first, leaving only the volume mount itself to the daemon.
  - path: uploaded_files/.gitkeep
    content: |
  # There is deliberately no .web/ placeholder here. One used to be needed:
  # compose mounted a named volume at .web/build/client, inside the project bind
  # mount, so Docker created .web and .web/build as root and `reflex run` died
  # with `PermissionError: [Errno 13] Permission denied: '.web/nocompile'`. That
  # volume is gone - the dev stack serves the frontend live rather than from an
  # export that never existed - so .web is now created by reflex itself, inside
  # the container, as the same uid that owns the bind mount.
  - path: pyproject.toml
    content: |
      [project]
      name = "app"
      version = "0.1.0"
      requires-python = ">=3.11"
      dependencies = ["reflex>=0.6"]
  - path: rxconfig.py
    content: |
      import reflex as rx

      config = rx.Config(app_name="app")
  - path: app/__init__.py
    content: |
  - path: app/app.py
    content: |
      import reflex as rx


      def index() -> rx.Component:
          return rx.center(
              rx.vstack(
                  rx.heading("Reflex"),
                  rx.text("Scaffolded by keel. Edit app/app.py to get started."),
                  spacing="4",
              ),
              height="100vh",
          )


      app = rx.App()
      app.add_page(index)
  - path: .gitignore
    content: |
      .venv/
      __pycache__/
      .env
      .web/
tasks:
  test: "{{exec}} uv run pytest"
  lint: "{{exec}} uv run ruff check ."
  dev: "{{exec}} uv run reflex run"
  run: "{{exec}} uv run reflex run"
