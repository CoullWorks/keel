id: magento-alokai
kind: frontend
label: Alokai (Vue Storefront) - guided setup, not scaffolded
appliesTo: [magento, magento-mageos]
requires: [magento]
provides: [frontend, headless, alokai]
conflicts: [hyva, pwa-studio, scandipwa, magento-headless-next]
default: false
priority: 60
updated: 2026-08-13
# A Nuxt storefront in front of Magento, generated by Alokai's own CLI.
#
# Alokai is Vue Storefront renamed: same project, same integrations, new name
# since 2024. Its Magento 2 integration is a first-party template rather than a
# community one, which is why the CLI can scaffold a working store rather than
# leaving you to wire GraphQL yourself [1][2].
#
# What it costs you, said plainly: the storefront becomes a second application
# with its own build, its own deployment and its own release cycle. That is the
# point of headless, and it is also the bill. Choose Hyvä instead if you want
# Magento to keep owning the front end.
#
# The Magento integration is an Enterprise-tier product [1]. The CLI and the
# open-source storefront are free; the supported integration is not, so check
# what your project is entitled to before building on it.
#
# Sources:
#   [1] Alokai integrations       https://docs.alokai.com/integrations/
#   [2] Magento getting started   https://docs.alokai.com/integrations/magento/getting-started/magento/
#   [3] CLI announcement          https://alokai.com/blog/alokai-and-magento-2-instance-running-locally-in-minutes-with-the-new-cli-tool
#   [4] Storefront docs           https://docs.alokai.com/storefront
#   [5] Magento GraphQL           https://developer.adobe.com/commerce/webapi/graphql/
pins:
  alokai-cli: "latest"
versions:
  node_version:
    label: Node.js version (storefront)
    recommended: "22"
    options:
      - value: "20"
        label: "Node 20 LTS"
        note: "maintenance only, ends Apr 2026"
      - value: "22"
        label: "Node 22 LTS"
        note: "recommended: active LTS"
install:
  # `generate store` is interactive by design: it asks for a project name and an
  # integration, then for the Magento API credentials [3]. keel cannot answer
  # those for you, so it scaffolds nothing and writes the instructions instead.
  #
  # This is deliberate. A recipe that guessed at credentials would produce a
  # storefront that builds and cannot talk to anything, which is worse than one
  # that tells you the two commands to run.
  - "true"
smoke:
  - "{{exec}} test -f .keel/ALOKAI.md"
files:
  - path: .keel/ALOKAI.md
    content: |
      # Alokai storefront (Magento 2)

      keel has not scaffolded this for you, on purpose: the Alokai CLI is
      interactive and asks for Magento API credentials it cannot invent.

      ## Generating it

          npx @vue-storefront/cli generate store

      Answer the prompts:

      * **project name**: becomes the directory, e.g. `storefront`
      * **integration**: choose **Magento 2**
      * **credentials**: the Magento integration tokens

      Create the tokens in Admin → System → Extensions → Integrations: add an
      integration, grant it the resources the storefront needs, activate it, and
      copy the access token.

      ## Pointing it at this stack

      The generated project keeps its backend URL in its own environment file.
      This Magento is at:

          {{site_url}}/graphql

      ## What you are taking on

      The storefront is a separate application: its own build, its own deploy,
      its own release cycle, and its own uptime. That separation is the reason
      to go headless and it is also the cost. If the goal is only a faster
      storefront, Hyvä gets you most of the performance with none of the second
      deployment (`keel new magento --with magento-hyva`).

      The Magento integration is Alokai Enterprise. The CLI and the open-source
      storefront are free; the supported Magento integration is not.
