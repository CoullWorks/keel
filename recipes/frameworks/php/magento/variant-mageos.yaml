id: magento-mageos
kind: framework
label: Magento (Mage-OS community distribution)
lang: php
provides: [php, magento]
default: false
family: magento
variant: Mage-OS (community fork, no keys needed)
updated: 2026-08-13
# The same product from a repository that does not ask who you are.
#
# Adobe's repo.magento.com refuses anonymous Composer requests, so building
# Magento Open Source needs Marketplace access keys - which means keel's own
# Magento path could not be built or tested by anyone who is not an Adobe
# customer, including keel's CI. Mage-OS is the community distribution of the
# same codebase, published openly at repo.mage-os.org, and it installs, upgrades
# and runs through the identical command set.
#
# Everything except the two variables below is shared with the Adobe variant:
# the install sequence (install.yaml), the environments, the web servers, the
# add-ons and the storefronts all apply to both.
#
# Sources:
#   https://mage-os.org/  (the distribution)
#   https://repo.mage-os.org/  (the Composer repository, no auth)
pins:
  # Mage-OS numbers its own releases; 3.x is the line that tracks Magento 2.4.8
  # and carries the same PHP constraint, which is why the version choice below
  # is identical to Adobe's.
  mage-os: "^3.4"
  php: "~8.3.0 || ~8.4.0 || ~8.5.0"
versions:
  # Identical to the Adobe variant on purpose: Mage-OS 3.4 carries the same
  # "~8.3.0||~8.4.0||~8.5.0" constraint as Magento 2.4.8, so the same two lines
  # are the sensible ones to offer.
  php_version:
    label: PHP version
    recommended: "8.3"
    options:
      - value: "8.3"
        label: "PHP 8.3"
        note: "active support ended Dec 2025, security to Dec 2027"
      - value: "8.4"
        label: "PHP 8.4"
        note: "current, widest extension support"
schema_version: 2
# No credentials block, and that is the entire point of this variant: nothing
# here needs an account.
vars:
  magento.repo: "https://repo.mage-os.org/"
  magento.package: "mage-os/project-community-edition"
create:
  # Built in keeltmp and moved in: by the time the framework runs, keel has
  # already written config under .keel/, and `ddev composer create-project`
  # refuses a project root holding anything but public/. ddev exec runs composer
  # inside the web container without that wrapper. Same as the other envs here.
  magento-ddev: "ddev exec 'rm -rf keeltmp && composer create-project --repository {{magento.repo}} {{magento.package}} keeltmp && cp -a keeltmp/. . && rm -rf keeltmp'"
  # Created inside the project's own php image, so the dependency tree resolves
  # against the PHP version that will run it, and into /tmp because
  # create-project refuses a non-empty target.
  # Created inside the project's own php image so the dependency tree resolves
  # against the PHP version that will run it, and via `run --rm` so it works
  # before anything has been brought up - which matters here, because this is
  # the first step of the build and there is no stack yet.
  #
  # `build php` first: the dev stage COPYs no application files, so it builds
  # happily before composer.json exists. Into /tmp because create-project
  # refuses a non-empty target and the compose files are already written.
  magento-docker: "docker compose build php && docker compose run --rm -T --user \"$(id -u):$(id -g)\" -e COMPOSER_HOME=/tmp -e HOME=/tmp php sh -c 'composer create-project --repository={{magento.repo}} {{magento.package}} /tmp/m && cp -a /tmp/m/. /var/www/html/ && rm -rf /tmp/m'"
install:
  - "{{create}}"
  # The stack has to be up before anything can exec into it, and nothing else
  # brings it up: every step below is a `docker compose exec`. Without this the
  # build's first command failed with `service "php" is not running` - and it
  # failed the same way with Adobe's distribution, so Magento could not be built
  # by anyone, keys or not.
  - "{{start}}"
  - "{{exec}} rm -f app/etc/env.php"
  - >-
    {{magento}} setup:install
    --base-url="{{site_url}}/"
    --cleanup-database
    --db-host=db --db-name=db --db-user=db --db-password=db
    --search-engine=opensearch --opensearch-host=opensearch --opensearch-port=9200
    --opensearch-index-prefix=magento --opensearch-timeout=15
    --session-save=redis --session-save-redis-host=redis --session-save-redis-port=6379 --session-save-redis-db=2
    --cache-backend=redis --cache-backend-redis-server=redis --cache-backend-redis-port=6379 --cache-backend-redis-db=0
    --page-cache=redis --page-cache-redis-server=redis --page-cache-redis-port=6379 --page-cache-redis-db=1
    --admin-firstname=Magento --admin-lastname=User --admin-email=admin@example.com
    --admin-user=admin --admin-password=Password123
    --language=en_GB --currency=GBP --timezone=Europe/London --use-rewrites=1
  - "{{magento}} deploy:mode:set developer"
  - "{{magento}} module:disable Magento_AdminAdobeImsTwoFactorAuth Magento_TwoFactorAuth || true"
  - "{{settings_reenable}}"
  - "{{magento}} setup:config:set --backend-frontname=admin --no-interaction"
  # Apply the module state changed two steps up. `module:disable` writes
  # app/etc/config.php; the schema and data those modules own are only removed
  # once setup:upgrade runs, and until then the admin reports the setup version
  # as out of date on every page load.
  #
  # Note that setup:upgrade is deliberately absent from Adobe's documented
  # deployment flow (docs/infra/magento.md, open question 3). That flow is for
  # deploying code to a store that already exists; this is a fresh install whose
  # enabled-module set has just changed, which is the case it does cover.
  - "{{magento}} setup:upgrade"
  # Update by Schedule, not Update on Save.
  #
  # Update on Save is the default and reindexes inside the request that saved
  # the entity, so saving one product can block for minutes on a real catalogue.
  # Update by Schedule moves that to cron, which is exactly what the cron
  # container in this stack exists to run.
  - "{{magento}} indexer:set-mode schedule"
  # A fresh install leaves every index invalid, and an invalid index means the
  # storefront renders no products and no category pages: the store looks empty
  # rather than broken, which is worse. Building them here is the difference
  # between a store you can open and a store you have to debug.
  - "{{magento}} indexer:reindex"
  # Last, because everything above changed configuration or schema.
  - "{{magento}} cache:flush"
  # Cron starts only now the store exists, which is both Adobe's order and the
  # only way the steps above can run without a second bin/magento writing into
  # generated/ underneath them. See the cron service in magento/infra/php-fpm.yaml.
  - "{{cron_start}}"
tasks:
  lint: '{{exec}} vendor/bin/phpcs --standard=Magento2 app/code'
  dev: '{{start}}'
  test: '{{magento}} dev:tests:run unit'
  flush: '{{magento}} cache:flush'
  reindex: '{{magento}} indexer:reindex'
  build: '{{magento}} setup:static-content:deploy -f'
smoke:
  # Proves the database the install just built is reachable and current.
  - "{{magento}} setup:db:status"
