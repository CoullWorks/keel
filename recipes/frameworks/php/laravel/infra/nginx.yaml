id: nginx-laravel
schema_version: 2
kind: config
label: Laravel server block for NGINX
updated: 2026-08-12
# Division of labour, and it is the point of this file. The shared NGINX service
# (recipes/infra/web/nginx.yaml) owns .keel/nginx/nginx.conf: worker and
# http-level tuning, the log format, gzip and its type list, server_tokens off,
# the default security headers, real_ip from the trusted proxy, the default
# client_max_body_size and the default fastcgi buffer sizes. This recipe owns one
# server block and the compose wiring, nothing else. Nothing here redeclares a
# shared directive except where it deliberately overrides one, and where it does
# the comment says which and why.
#
# Source: laravel.com/docs/13.x/deployment publishes this block.
when:
  framework: laravel
  uses: nginx
provision:
  compose:
    files:
      - path: docker/nginx/conf.d/app.conf
        verbatim: true
        content: |
          # keel-generated. Laravel server block. Included by the shared nginx.conf
          # from /etc/nginx/conf.d/*.conf, so every http-level directive lives
          # there and not here.
          #
          # Deltas from Laravel's published block, all deliberate:
          #   - fastcgi_pass targets the compose service php:9000 rather than
          #     unix:/var/run/php/php8.3-fpm.sock. Same pool, different transport.
          #   - Laravel's block sets X-Frame-Options and X-Content-Type-Options
          #     here. The shared config sets them for every site, and add_header at
          #     two levels emits the header twice, so they are dropped.
          #   - the .php catch-all deny and the fpm-status / fpm-ping locations are
          #     keel's additions, not Laravel's.
          server {
              listen 80;
              listen [::]:80;
              server_name _;

              # public/, never the project root. Laravel, verbatim: "You should
              # never attempt to move the index.php file to your project's root, as
              # serving the application from the project root will expose many
              # sensitive configuration files to the public Internet."
              root /var/www/html/public;
              index index.php;
              charset utf-8;

              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }

              location = /favicon.ico { access_log off; log_not_found off; }
              location = /robots.txt  { access_log off; log_not_found off; }

              error_page 404 /index.php;

              # Anchored at the front controller. Only index.php is ever executed,
              # so a .php file that lands anywhere else under public/ is refused by
              # the catch-all below instead of being run.
              location ~ ^/index\.php(/|$) {
                  fastcgi_pass php:9000;
                  # $realpath_root, not $document_root: it resolves the symlink,
                  # which is what makes OPcache see a symlinked release directory
                  # correctly. It relies on nginx and FPM seeing the same tree at
                  # the same path, which they do here. Split them across hosts and
                  # you must switch to $document_root.
                  fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
                  include fastcgi_params;
                  # OVERRIDES the shared default fastcgi buffer sizes. Laravel 13
                  # added these three to its published block; 12.x had none.
                  # Without them a response with large headers, typically a long
                  # Set-Cookie session payload, spills to a temporary file on every
                  # single request.
                  fastcgi_buffer_size 32k;
                  fastcgi_buffers 8 32k;
                  fastcgi_busy_buffers_size 64k;
                  # The pool answers with its own PHP version otherwise.
                  fastcgi_hide_header X-Powered-By;
              }

              # FPM's status and ping pages, declared in
              # docker/php/php-fpm.d/zzz-laravel-pool.conf. Never public: the
              # status page lists live workers, the request queue and the slowest
              # request. 172.16.0.0/12 is Docker's default bridge range; narrow it
              # once you have a real monitoring network.
              location ~ ^/(fpm-status|fpm-ping)$ {
                  allow 127.0.0.1;
                  allow 172.16.0.0/12;
                  deny all;
                  fastcgi_pass php:9000;
                  fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
                  include fastcgi_params;
                  access_log off;
              }

              # Everything else with a .php extension. Laravel's published block
              # has no equivalent, so a file dropped into public/ would be run.
              location ~ \.php$ { return 404; }

              # Verbatim from Laravel's block: hide dotfiles, but keep /.well-known
              # reachable so ACME HTTP-01 certificate challenges still work.
              location ~ /\.(?!well-known).* { deny all; }
          }
      - path: compose.override.yaml
        verbatim: true
        content: |
          # keel-generated. Compose merges compose.override.yaml over compose.yaml
          # with no extra flags, so the php service written by the env recipe is
          # untouched and this file only adds the web tier.
          services:
            nginx:
              # Pinned to a minor. WordPress's hosting handbook lists 1.26 and 1.27
              # as recommended lines, which is the closest thing to a vendor
              # statement any of these frameworks make about nginx versions.
              image: nginx:1.27-alpine
              restart: unless-stopped
              depends_on:
                php:
                  condition: service_healthy
              ports:
                - "${HTTP_PORT:-8080}:80"
              volumes:
                # nginx serves public/ directly, and read-only because it has no
                # business writing into the application tree.
                - .:/var/www/html:ro
                # Shared, owned by recipes/infra/web/nginx.yaml.
                - ./.keel/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                # This framework's server block, owned by this recipe.
                - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
              healthcheck:
                # /up is Laravel's built-in health route: it "will return a 200
                # HTTP response if the application has booted without exceptions.
                # Otherwise, a 500 HTTP response will be returned."
                test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
                interval: 15s
                timeout: 5s
                retries: 5
                start_period: 60s
  # DDEV already runs nginx-fpm and ships a Laravel-aware config; the service
  # recipe only flips ddev's webserver type. Nothing to add here.
  ddev: {}
  # Sail runs its own nginx-free PHP image with the built-in server; swapping that
  # is a Sail concern, not this recipe's.
  sail: {}
  # Native env: no container. The server block above still applies if you run
  # nginx on the host, with fastcgi_pass pointing at your own FPM socket.
  local: {}
