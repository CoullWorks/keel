id: wordpress-php-fpm
schema_version: 2
kind: config
label: WordPress and WooCommerce production PHP-FPM image, php.ini and pool
# The INDIVIDUAL PHP half for the WordPress stack. The shared baseline
# (recipes/frameworks/php/shared/php-production.yaml) supplies expose_php,
# display_errors, the session hardening and the FPM [global] block, and is read
# first; nothing from it is repeated here.
#
# Two things make this stack unlike the other three, and both are load-bearing:
#
#   1. opcache.validate_timestamps stays at 1. Every other production PHP recipe
#      in keel sets it to 0. WordPress rewrites its own codebase at runtime when
#      it updates core, a plugin or a theme, so cached opcode would go stale on
#      an update nobody triggered by hand. See docker/php/conf.d/10-wordpress.ini.
#   2. There is no build step at all. No compiled container, no autoloader to
#      optimise, no static assets to deploy, so there is no vendor stage in the
#      Dockerfile. A deployment is a file sync plus a database update WordPress
#      runs itself.
#
# Also owns compose.yaml: PHP, MariaDB, Redis and the cron runner are the
# same whichever web server you picked. The web server arrives as a compose
# override from the env recipe.
when:
  # Both layouts: the docroot and content directory are variables the
  # framework recipes set, so Bedrock reuses this tier rather than copying it.
  frameworks: [woocommerce, woocommerce-bedrock]
  env: compose
priority: -20
updated: 2026-08-12
# The PHP line chosen in the wizard, written where compose will read it.
# It goes through .env rather than into the Dockerfile because the Dockerfile
# is verbatim: it is full of ${...} that must reach Docker untouched.
patch:
  - file: .env
    set:
      PHP_VERSION: "{{pin.php_version}}"
      # Your uid and gid, so the dev image can give its application user the
      # same ones. Without this, FPM writes as uid 33 into a tree you own and
      # neither side can write the other's files. Committed to .env rather than
      # compose.yaml because they are specific to this machine.
      APP_UID: "{{uid}}"
      APP_GID: "{{gid}}"
      # Where uploads live, which differs between the classic layout and
      # Bedrock. Read by the Dockerfile through compose as a build arg.
      WP_UPLOADS: "{{wp.uploads}}"
files:
  - path: Dockerfile
    verbatim: true
    content: |
      # syntax=docker/dockerfile:1
      # keel-generated. Production WordPress and WooCommerce image: PHP-FPM behind
      # nginx or Apache.
      #
      # Three stages, not four. There is no vendor or build stage because
      # WordPress has nothing to compile, no autoloader to optimise and no static
      # asset pipeline. That is the largest structural difference between this
      # stack and the Laravel, Symfony and Magento ones.
      #
      # Build the deployable image explicitly:
      #   docker build --target prod -t mystore:1.2.3 .

      # WordPress's requirements page says "Version 8.3 or greater"; the hosting
      # team handbook frames 8.3 as the recommendation over a supported 7.4 to 8.5
      # range, with 7.4 and 8.0 to 8.1 kept "for backward compatibility only".
      # WooCommerce asks for "PHP version 8.3 or greater (tested up to PHP 8.4)".
      # 8.3 is the floor both agree on. docs/infra/wordpress.md sources 1 and 2,
      # docs/infra/woocommerce.md source 1.
      ARG PHP_VERSION=8.3
      ARG PHP_BASE=php:${PHP_VERSION}-fpm-bookworm

      # ---------------------------------------------------------------- base ---
      FROM ${PHP_BASE} AS base

      # The hosting team handbook lists exactly TWO extensions as required: json
      # and mysqli. mysqli, not pdo_mysql: WordPress does not use PDO, so an image
      # built with only pdo_mysql will not run WordPress at all. That is the trap
      # here. Everything else below is from the handbook's "highly recommended"
      # list. docs/infra/wordpress.md, source 2.
      #
      # fileinfo is only "recommended" but media uploads fail MIME detection
      # without it, and exif reads the metadata WordPress stores against images.
      # libfcgi-bin supplies cgi-fcgi for the healthcheck; cron drives wp-cron.
      RUN set -eux; \
          apt-get update; \
          # git and unzip are for Composer, not for you. Without unzip it falls
          # back to PHP's zip extension and says so on every install: "any UNIX
          # permissions (e.g. executable) defined in the archives will be lost",
          # which is how a vendor/bin binary arrives without its execute bit. git
          # is what it uses for a package required from a VCS repository, which
          # is every private or forked dependency.
          apt-get install -y --no-install-recommends \
            libicu-dev libzip-dev libpng-dev libjpeg62-turbo-dev \
            libfreetype6-dev libwebp-dev libonig-dev libfcgi-bin cron less git unzip; \
          docker-php-ext-configure gd --with-freetype --with-jpeg --with-webp; \
          docker-php-ext-install -j"$(nproc)" \
            exif gd intl mysqli zip; \
          pecl install redis; \
          docker-php-ext-enable redis; \
          # purge WITHOUT --auto-remove. The -dev packages are safe to drop, but
          # --auto-remove also takes the runtime libraries they pulled in - libzip4,
          # libicu and friends - which the extensions compiled a line earlier are
          # dynamically linked against. The image still builds; PHP then warns
          # "Unable to load dynamic library" on every start and FPM exits 78.
          apt-get purge -y libicu-dev libzip-dev libpng-dev \
            libjpeg62-turbo-dev libfreetype6-dev libwebp-dev libonig-dev; \
          rm -rf /var/lib/apt/lists/* /tmp/pear

      # imagick is on the recommended list (it needs ImageMagick >= 6.2.4) and
      # WordPress silently degrades to GD when it is absent, which changes image
      # output quality with nothing reporting it. It is not installed by default
      # here because the pecl build against recent PHP is fragile and a failed
      # base image is worse than slightly different JPEG quality. To add it:
      #   RUN apt-get update && apt-get install -y libmagickwand-dev \
      #    && pecl install imagick && docker-php-ext-enable imagick
      RUN docker-php-ext-enable opcache

      # WP-CLI. Used by keel's own install steps, by the cron container and by
      # anything scripted afterwards. Fetched from the project's tagged release
      # rather than the floating wp-cli.phar URL, so the same Dockerfile builds the
      # same tool a year from now. Verify it against the .sha512 published beside
      # the release if your build policy requires it.
      ADD --chmod=0755 https://github.com/wp-cli/wp-cli/releases/download/v2.11.0/wp-cli-2.11.0.phar /usr/local/bin/wp

      # The stock pool is a 5-child development pool. docker.conf and
      # zz-docker.conf stay: they set listen = 9000, clear_env,
      # catch_workers_output and daemonize = no.
      RUN rm -f /usr/local/etc/php-fpm.d/www.conf /usr/local/etc/php-fpm.d/www.conf.default

      # 00-php-production.ini (shared) then 10-wordpress.ini (this stack's values).
      COPY docker/php/conf.d/ /usr/local/etc/php/conf.d/
      # zz-global.conf (shared [global]) then zzz-wordpress-pool.conf (our [www]).
      COPY docker/php/php-fpm.d/ /usr/local/etc/php-fpm.d/

      # Baked in, not bind-mounted: cron ignores anything in /etc/cron.d that root
      # does not own, and a host bind mount carries your uid.
      COPY docker/php/cron/wordpress.cron /etc/cron.d/wordpress
      RUN chmod 0644 /etc/cron.d/wordpress

      WORKDIR /var/www/html

      # php-fpm.8: SIGQUIT is the graceful stop, SIGTERM and SIGINT terminate
      # immediately. Docker sends SIGTERM by default.
      STOPSIGNAL SIGQUIT

      HEALTHCHECK --interval=15s --timeout=5s --start-period=45s --retries=3 \
        CMD SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET \
            cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1

      EXPOSE 9000
      CMD ["php-fpm"]

      # ----------------------------------------------------------------- dev ---
      # What compose.yaml builds. Root, deliberately: the project is
      # bind-mounted from the host, and WP-CLI, plugin installs and media uploads
      # all write into it.
      FROM base AS dev
      # Composer, dev stage only. Classic WordPress is installed by WP-CLI and
      # never needs it, but the Bedrock layout IS Composer-managed - core,
      # plugins and themes are all dependencies - and without it every composer
      # step exited 127 inside the container. The production image keeps only
      # the vendor tree, never the tool that built it.
      COPY --from=composer:2 /usr/bin/composer /usr/bin/composer
      ENV COMPOSER_ALLOW_SUPERUSER=1
      # Development overrides, dev stage only: opcache timestamp validation back
      # on, realpath cache short, errors on screen. Without the first of these,
      # the bind-mounted code you are editing is not the code being run.
      COPY docker/php/dev/95-dev.ini /usr/local/etc/php/conf.d/95-dev.ini
      # The one thing the dev image must agree with the host about: who you are.
      #
      # The project is bind-mounted, so the tree inside the container is the tree
      # in your editor, with your uid on every file. FPM's pool runs as www-data,
      # which is uid 33 in this image, and uid 33 cannot write a file owned by
      # uid 1000. The two then take turns losing: the application could not append
      # to storage/logs/laravel.log, and once it had created that log itself,
      # composer running as you could not append to it either. Both failures
      # surface as something unrelated - a 500 with a tempnam() notice, or a
      # composer post-install script exiting 1.
      #
      # So www-data adopts your uid here. This is what Laravel Sail does with
      # WWWUSER, and it is confined to the dev stage: the prod image below has no
      # bind mount and keeps the distribution's own uid 33.
      #
      # `|| true`: the numbers may already be taken in the base image, and on a
      # rootless or Docker Desktop setup the host uid may already map to the
      # container user, in which case there is nothing to change and nothing
      # wrong. The chown afterwards catches the files the image itself created.
      ARG APP_UID=1000
      ARG APP_GID=1000
      RUN if [ "$APP_UID" != "33" ]; then \
            groupmod -o -g "$APP_GID" www-data || true; \
            usermod -o -u "$APP_UID" -g "$APP_GID" www-data || true; \
            chown -R "$APP_UID:$APP_GID" /var/www/html || true; \
          fi

      # ---------------------------------------------------------------- prod ---
      FROM base AS prod
      COPY --chown=www-data:www-data . /var/www/html
      # WordPress's own permission guidance: "All directories should be 755 or
      # 750", "All files should be 644 or 640. Exception: wp-config.php should be
      # 440 or 400", and files should "never be owned by the webserver process
      # itself" on shared hosting. In a container the runtime user is the only
      # user, so ownership goes to www-data and the modes carry the intent.
      # docs/infra/wordpress.md, sources 7 and 9.
      RUN set -eux; \
          find /var/www/html -type d -exec chmod 755 {} + ; \
          find /var/www/html -type f -exec chmod 644 {} + ; \
          if [ -f /var/www/html/wp-config.php ]; then chmod 440 /var/www/html/wp-config.php; fi
      # wp-content/uploads is the one directory that genuinely must be writable by
      # the web server, and it is also the one the nginx and Apache configs deny
      # PHP execution inside. Both halves are required: writable and inert.
      # A build arg, not a keel token: this file is verbatim (its ${...} and
      # $(...) must survive untouched), so the path arrives the same way
      # PHP_VERSION and APP_UID do - written to .env by this recipe and passed
      # through compose. Classic WordPress keeps uploads in wp-content/uploads;
      # Bedrock renames wp-content to app and moves it under web/.
      ARG WP_UPLOADS=wp-content/uploads
      RUN mkdir -p "/var/www/html/${WP_UPLOADS}" \
       && chown -R www-data:www-data "/var/www/html/${WP_UPLOADS}" \
       && chmod 755 "/var/www/html/${WP_UPLOADS}"
      USER www-data

  - path: .dockerignore
    verbatim: true
    content: |
      # keel-generated.
      .git
      .gitignore
      .github
      .keel
      .idea
      .vscode
      docker-compose*.yml
      Dockerfile
      .dockerignore
      # Site content and secrets. wp-config.php holds the database credentials and
      # the authentication salts; it belongs in the runtime environment, not in an
      # image layer that anybody who can pull the tag can read.
      wp-config.php
      # User uploads are data, not code. Baking gigabytes of media into an image
      # makes every deploy slower and every rollback bigger.
      wp-content/uploads
      wp-content/cache
      wp-content/upgrade
      wp-content/debug.log
      # WooCommerce writes order exports and logs here.
      wp-content/uploads/wc-logs

  - path: docker/php/dev/95-dev.ini
    verbatim: true
    content: |
      ; keel-generated, and copied ONLY into the dev stage of the Dockerfile.
      ;
      ; The production baseline sets opcache.validate_timestamps = 0, which is
      ; correct for an immutable image: the code cannot change under a running
      ; container, so checking every file on every request is pure overhead.
      ;
      ; The dev stage bind-mounts your working tree, where the code changes
      ; constantly, and there the same setting is a trap. PHP keeps serving the
      ; version of every file it compiled when the container started: you edit a
      ; controller, reload, and see the old page. Nothing errors and nothing in
      ; the logs mentions it. It also hides new code entirely - a package
      ; installed after boot stays invisible until the container is restarted,
      ; which is how a freshly installed Telescope answered 404 on a route that
      ; `artisan route:list` could see perfectly well.
      ;
      ; Read last (95- sorts after 00- and 10-), so it overrides the baseline.
      opcache.validate_timestamps = 1
      ; Check on every request. The stat() is cheap next to being served code
      ; that is one edit out of date.
      opcache.revalidate_freq = 0

      ; The realpath cache has exactly the same problem: a stale entry means a
      ; file you just created is reported as missing. 
      realpath_cache_ttl = 10

      ; Development display settings. The production baseline sends errors to the
      ; log and shows the user nothing, which is right in production and useless
      ; on your own machine.
      display_errors = On
      display_startup_errors = On
      error_reporting = E_ALL
  - path: docker/php/conf.d/10-wordpress.ini
    verbatim: true
    content: |
      ; keel-generated. WordPress and WooCommerce PHP values.
      ; Read after docker/php/conf.d/00-php-production.ini (shared baseline), so anything
      ; here wins.
      ;
      ; Sourcing: WordPress's hosting team handbook publishes NO php.ini values at
      ; all, for memory_limit, max_execution_time, upload_max_filesize,
      ; post_max_size or max_input_vars (docs/infra/wordpress.md, open question 1).
      ; WooCommerce publishes exactly one number, the 256 MB memory limit
      ; (docs/infra/woocommerce.md, source 1). Everything else below is keel's and
      ; says so.

      [PHP]
      ; WooCommerce's server requirements, verbatim: "WordPress memory limit of
      ; 256 MB or greater". The WP_MEMORY_LIMIT constant in wp-config.php asks
      ; PHP for memory; it can never exceed what php.ini permits, so this is the
      ; value that actually decides the ceiling. WordPress core alone only attempts
      ; 40M single site and 64M multisite, which no real store fits inside.
      memory_limit = 256M

      ; Neither WordPress nor WooCommerce publishes a value. 60 rather than the
      ; usual 30 because a WooCommerce admin doing a bulk product import or a
      ; report over a year of orders genuinely takes longer than 30 seconds, and
      ; there is no queue to move it to. keel's choice.
      max_execution_time = 60

      ; Media uploads. PHP's defaults (2M and 8M) are far below what a product
      ; photo set needs. WordPress's own nginx recipe couples this to the web
      ; server with the note "php max upload limit cannot be larger than this" on
      ; client_max_body_size, so if you change this you must change
      ; client_max_body_size in the nginx server block too, or the request is
      ; rejected before PHP ever sees it. docs/infra/wordpress.md, source 5.
      upload_max_filesize = 64M
      post_max_size = 64M

      ; PHP's default is 1000. A WooCommerce variable product with several
      ; attributes and dozens of variations posts far more fields than that from
      ; the product editor, and PHP silently discards everything past the limit:
      ; the product saves and the variations are simply gone. docs/infra/woocommerce.md
      ; records that no value is published (open question 1), so this is keel's.
      max_input_vars = 3000

      ; Neither project documents realpath values (docs/infra/wordpress.md, open
      ; question 2). PHP's defaults are 4096K and 120. The TTL is raised to 600 on
      ; the same reasoning Symfony publishes for its own: a plugin-heavy WordPress
      ; opens a great many files per request.
      realpath_cache_size = 4096K
      realpath_cache_ttl = 600

      [opcache]
      ; READ THIS BEFORE "FIXING" IT TO 0.
      ;
      ; Every other production PHP recipe in keel sets
      ; opcache.validate_timestamps = 0, because in an immutable image the code
      ; cannot change under a running process. WordPress is the exception, and the
      ; reason is structural rather than a matter of taste: WordPress updates
      ; ITSELF. Core auto-updates, plugin updates and theme updates all rewrite PHP
      ; files on the live filesystem, from the admin UI, with no deploy and no
      ; process restart. With validate_timestamps = 0 the opcode cache keeps
      ; serving the previous version of every updated file until something restarts
      ; FPM, so a security update appears to install and does nothing.
      ;
      ; WordPress never states this; it follows from the update model and is
      ; recorded in docs/infra/wordpress.md, open question 2.
      ;
      ; If you have genuinely made the codebase immutable (updates disabled with
      ; DISALLOW_FILE_MODS, everything deployed by image) then 0 is correct and
      ; faster. Only then.
      opcache.validate_timestamps = 1
      ; Check timestamps at most once a minute rather than PHP's default of every
      ; 2 seconds. Thirty times fewer stat() calls, and a plugin update goes live
      ; within a minute instead of instantly, which is a fair trade.
      opcache.revalidate_freq = 60

      ; PHP's default is 128. A WordPress install with WooCommerce and a normal
      ; plugin set is a lot of code: WooCommerce alone is several thousand files.
      opcache.memory_consumption = 256

      ; PHP's default is 8MB. Raised for the same reason Symfony publishes for its
      ; own applications: many fully-qualified class names. 16 rather than
      ; Symfony's 32, because WordPress's procedural core interns fewer of them.
      ; keel's number: neither project publishes one.
      opcache.interned_strings_buffer = 16

      ; PHP's default is 10000, which WordPress plus WooCommerce plus a plugin set
      ; exceeds. The manual rounds any value up to the first prime in
      ; {223, 463, 983, 1979, 3907, 7963, 16229, 32531, 65407, ...} that is >= it,
      ; so the prime is set directly. Check it rather than trusting it:
      ; opcache_get_status()['opcache_statistics']['num_cached_keys'] must stay
      ; well below max_cached_keys, or files are evicted on every request.
      opcache.max_accelerated_files = 16229

      ; PHP's default. Plugin and theme metadata lives in file header comments, and
      ; enough of the plugin ecosystem parses doc comments that discarding them is
      ; not worth the memory it saves. The PHP manual's own warning names PHPUnit
      ; and Doctrine.
      opcache.save_comments = 1

      ; No opcache.preload: WordPress ships no preload script, and preloading a
      ; codebase that rewrites itself during plugin updates would pin the old
      ; classes in shared memory until the pool restarted.

  - path: docker/php/php-fpm.d/zzz-wordpress-pool.conf
    verbatim: true
    content: |
      ; keel-generated. WordPress and WooCommerce PHP-FPM pool.
      ; Read after docker/php/php-fpm.d/zz-global.conf (shared [global]) and the
      ; official image's docker.conf and zz-docker.conf.
      ;
      ; Neither WordPress nor WooCommerce publishes any pool guidance: no pm mode,
      ; no pm.max_children, no pm.max_requests, no request_terminate_timeout. The
      ; only FPM-adjacent statement in the official nginx recipe is the upstream
      ; block and the note "this should match value of 'listen' directive in
      ; php-fpm pool". docs/infra/wordpress.md open question 3,
      ; docs/infra/woocommerce.md open question 3. Every number here is keel's.

      [www]
      ; Uncomment if you run the FPM master as root. The prod image runs the whole
      ; container as www-data, and FPM ignores these with a NOTICE otherwise.
      user = www-data
      group = www-data

      listen = 9000
      ; listen.allowed_clients is deliberately not set, and 127.0.0.1 is the
      ; wrong value for it here.
      ;
      ; It filters on the peer address, and in compose the peer is the web
      ; server in its own container, arriving from an address on the bridge
      ; network that Docker assigns at run time. 127.0.0.1 is the loopback
      ; inside THIS container, so nothing that is not this container can match
      ; it: FPM accepted every connection from nginx and reset it immediately,
      ; and the site answered 502 Bad Gateway on every request.
      ;
      ; Unset means any peer, and the isolation comes from the network instead:
      ; port 9000 is published to no one, so the only things that can reach it
      ; are the services on the same compose network. On a VM where FPM and the
      ; web server share a host, use a unix socket with listen.owner and
      ; listen.group, which is a stronger boundary than an address list.

      pm = dynamic

      ; pm.max_children = RAM available to PHP / peak RSS of one worker.
      ; Worked as 2048 MB (a 2 GB container) / 96 MB per worker = 21, rounded down
      ; to 20.
      ;
      ; 96 MB, not the 64 used for Laravel and Symfony, because a WooCommerce
      ; request loads WordPress core, WooCommerce and every active plugin on every
      ; single request: there is no compiled container and no route-level lazy
      ; loading. A store with a heavy theme and thirty plugins will exceed 96 MB,
      ; so measure it rather than trusting this:
      ;   ps -o rss= -C php-fpm | sort -n | tail -5
      ; Then divide again. Oversubscribing is worse than under-provisioning: the
      ; box swaps and every request slows, instead of a few requests queueing.
      pm.max_children = 20
      pm.start_servers = 5
      pm.min_spare_servers = 3
      pm.max_spare_servers = 8

      ; The manual's default is 0, meaning a worker never respawns. WordPress
      ; plugin quality varies enormously and a leak in any one of them accumulates
      ; for the life of the process, so bounding it matters more here than
      ; anywhere else in this catalogue.
      pm.max_requests = 500

      ; The backstop for when max_execution_time (60s) does not stop the script.
      ; Set above it so PHP's own error fires first and is logged.
      request_terminate_timeout = 120s
      request_terminate_timeout_track_finished = yes

      request_slowlog_timeout = 15s
      slowlog = /proc/self/fd/2

      pm.status_path = /fpm-status
      ping.path = /fpm-ping
      ping.response = pong

      ; Matters more here than anywhere else in this catalogue. WordPress's uploads
      ; directory is writable by the web server BY DESIGN, so this is the last line
      ; of defence if the web server's uploads deny is ever mis-edited: even if a
      ; request for wp-content/uploads/evil.jpg reached FPM, it does not end in
      ; .php and is refused.
      security.limit_extensions = .php

  - path: docker/php/cron/wordpress.cron
    verbatim: true
    content: |
      # keel-generated. The real cron that replaces WP-Cron.
      #
      # Why this exists: WP-Cron is not cron. It fires on page loads, and WordPress
      # says so, verbatim: "WP-Cron does not run continuously, which can be an
      # issue if there are critical tasks that must run on time." On a low-traffic
      # site nothing runs until somebody visits.
      #
      # For a WooCommerce store that is not a nuisance, it is the single most
      # important operational fact about the install: WooCommerce bundles Action
      # Scheduler as a hard dependency and drives it from WP-Cron. Order status
      # transitions, webhooks, subscription renewals, HPOS sync and product lookup
      # table regeneration all run through it, so a store nobody is browsing does
      # not process its own orders.
      #
      # The other half of the fix is DISABLE_WP_CRON in wp-config.php, which keel
      # sets in a post_build hook. Without it, both mechanisms run.
      # docs/infra/wordpress.md source 8, docs/infra/woocommerce.md source 6.
      #
      # WordPress's documented example is
      #   0 0 * * * wget --delete-after http://YOUR_SITE_URL/wp-cron.php
      # which is daily. The interval below is every minute instead. WordPress
      # publishes NO recommended frequency (docs/infra/wordpress.md, open question
      # 4), so this is keel's choice, and it is driven by Action Scheduler, which
      # documents that it checks for due actions every minute.
      #
      # The request goes to the `web` service by name rather than to the public
      # site URL: no DNS, no TLS, no round trip out of the network. curl is present
      # in the official PHP image.
      * * * * * root curl -fsS -o /dev/null --max-time 55 http://web/wp-cron.php?doing_wp_cron
      # A crontab file must end with a newline or cron ignores the last line.

  - path: compose.yaml
    verbatim: true
    content: |
      # keel-generated. WordPress and WooCommerce application stack: PHP-FPM,
      # MariaDB, Redis for the object cache, and the real cron that replaces
      # WP-Cron.
      #
      # No web server here on purpose: that is the choice you make by selecting the
      # nginx or apache service, which writes compose.override.yaml with the
      # container and WordPress's own server block. Compose merges it over
      # compose.yaml with no extra flags.
      #
      # A local stack: bind-mounts your working tree and builds the Dockerfile's
      # `dev` target. The deployable image is `--target prod`.
      services:
        php:
          build:
            context: .
            target: dev
            args:
              # The PHP line chosen in the wizard, written to .env by this
              # recipe. The Dockerfile carries the same default, so a checkout
              # without a .env still builds.
              PHP_VERSION: "${PHP_VERSION:-8.3}"
              APP_UID: "${APP_UID:-1000}"
              APP_GID: "${APP_GID:-1000}"
              WP_UPLOADS: "${WP_UPLOADS:-wp-content/uploads}"
          volumes: [".:/var/www/html"]
          # expose, never ports. A PHP-FPM pool speaks FastCGI, not HTTP, and it
          # will execute whatever script path it is handed with no authentication
          # of any kind. Publishing 9000 to the host is remote code execution
          # waiting for a port scan.
          expose: ["9000"]
          environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_NAME: db
            WORDPRESS_DB_USER: db
            WORDPRESS_DB_PASSWORD: db
          depends_on:
            db: { condition: service_healthy }
            redis: { condition: service_started }

        cron:
          build:
            context: .
            target: dev
            args:
              # Same three as the php service: without them this service builds a
              # second, near-identical image, and one of them has the wrong uid.
              PHP_VERSION: "${PHP_VERSION:-8.3}"
              APP_UID: "${APP_UID:-1000}"
              APP_GID: "${APP_GID:-1000}"
              WP_UPLOADS: "${WP_UPLOADS:-wp-content/uploads}"
          volumes: [".:/var/www/html"]
          # /etc/cron.d/wordpress is baked into the image: cron ignores a crontab
          # in that directory unless root owns it.
          command: ["cron", "-f", "-L", "2"]
          # The image's HEALTHCHECK probes PHP-FPM on port 9000, and this
          # container runs cron. An inherited probe that can never pass makes a
          # working container look permanently broken, and blocks anything
          # waiting on `condition: service_healthy` for it.
          healthcheck:
            disable: true
          depends_on:
            db: { condition: service_healthy }

        db:
          # WordPress's requirements page asks for "MariaDB 10.11+ or MySQL 8.0+";
          # WooCommerce's floor is lower still (MySQL 8.0 / MariaDB 10.6), so take
          # the higher of the two. MySQL 8.0 reached end of life in April 2026, so
          # a new build should be on an LTS line: MariaDB 11.4 or 11.8, or MySQL
          # 8.4. docs/infra/wordpress.md source 2, docs/infra/woocommerce.md source 1.
          image: mariadb:11.8
          environment:
            MARIADB_DATABASE: db
            MARIADB_USER: db
            MARIADB_PASSWORD: db
            MARIADB_ROOT_PASSWORD: root
          # WooCommerce names the SQL modes it expects, and this is an easy one to
          # miss on a managed database with a non-default sql_mode.
          # docs/infra/woocommerce.md, source 1.
          command:
            - "--sql-mode=ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,NO_ZERO_DATE,NO_ZERO_IN_DATE,STRICT_ALL_TABLES"
          # keel's shared MariaDB tuning, mounted because this compose file is
          # verbatim and cannot substitute a var there. It supplies everything
          # the command flags above do not; where they overlap the flags win,
          # which is intended: those are the vendor's own numbers.
          volumes:
            - db:/var/lib/mysql
            - ./.keel/mariadb/my.cnf:/etc/mysql/conf.d/keel-mariadb.cnf:ro
          healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 5s
            retries: 30

        redis:
          # Not required by either project. WordPress ships no persistent object
          # cache at all (the built-in WP_Object_Cache is per-request), and the
          # documented route to one is a drop-in plugin backed by Redis or
          # Memcached: "Using a persistent Object Cache helps speed up page load
          # times by saving on trips to the database". The php extension is already
          # in the image; install a drop-in such as redis-cache to use it.
          # docs/infra/wordpress.md, source 4.
          image: redis:7.4-alpine
          command: ["redis-server", "--appendonly", "yes"]
          volumes: [redis:/data]

      volumes:
        db:
        redis:
