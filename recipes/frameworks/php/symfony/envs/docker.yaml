id: symfony-docker
schema_version: 2
kind: env
env_family: compose
label: Docker (compose, PHP-FPM)
appliesTo: [symfony]
provides: [env, docker, db-postgres] # this stack brings up PostgreSQL itself
priority: -10 # write the compose files before the app is created
updated: 2026-08-12
# This env owns the command vocabulary. The stack it talks to is written by
# recipes/frameworks/php/symfony/infra/php-fpm.yaml (the Dockerfile, compose.yaml,
# Symfony's published opcache and realpath values, and the FPM pool) and by the
# shared PHP baseline in recipes/frameworks/php/shared/php-production.yaml.
#
# `symfony serve` and `php -S` are development servers and appear nowhere in this
# stack. Symfony's own web server page says production needs nginx or Apache and
# that both "require PHP-FPM (install the php-fpm package)", which is what the
# php service is.
#
# There is no web server in the stack until you pick one, which is how keel
# models the choice: the nginx and Apache service recipes in recipes/infra/web/
# are single-select and mutually exclusive, and picking one injects Symfony's own
# server block or VirtualHost from symfony/infra/nginx.yaml or
# symfony/infra/apache.yaml, along with a compose.override.yaml that adds the
# container and publishes port 80.
#
#   keel new symfony --env symfony-docker --with nginx
#   keel new symfony --env symfony-docker --with apache
commands:
  start: "docker compose up -d --build"
  # How this environment tears itself down. Used when a build fails partway:
  # keel removes the directory it created, and without this the containers,
  # volumes and network it started stay behind holding a bind mount to a
  # path that no longer exists. The next attempt then reuses that container
  # and dies with "current working directory is outside of container mount
  # namespace root".
  down: "docker compose down -v --remove-orphans"
  restart: "docker compose restart"
  # --user: the dev stage runs as root so it can write to the bind-mounted host
  # tree, which means composer and artisan would create root-owned files in your
  # working directory. keel then cannot patch its own .env ("permission denied")
  # and you cannot edit the project without sudo. Running exec as the invoking
  # user keeps everything written here owned by you.
  #
  # It applies to all of them, not just exec. composer and the console ran as
  # root until they were fixed, and those are the steps that write the most:
  # every add-on that installs a package or publishes a config left root-owned
  # files behind, after which the app could not write its own cache or log and
  # answered 500 on every request.
  #
  # COMPOSER_HOME and HOME point at /tmp because an arbitrary uid has no home
  # directory inside the image, and composer refuses to start without one.
  exec: 'docker compose exec -T --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp -e HOME=/tmp php'
  composer: 'docker compose exec -T --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp -e HOME=/tmp php composer'
  console: 'docker compose exec -T --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp -e HOME=/tmp php php bin/console'
  site_url: "http://localhost:{{http_port}}"
smoke:
  - "docker compose ps"
