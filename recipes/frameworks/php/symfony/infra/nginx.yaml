id: nginx-symfony
schema_version: 2
kind: config
label: Symfony server block for NGINX
updated: 2026-08-12
# Division of labour. The shared NGINX service (recipes/infra/web/nginx.yaml)
# owns .keel/nginx/nginx.conf: worker and http-level tuning, the log format,
# gzip and its type list, server_tokens off, the default security headers,
# real_ip from the trusted proxy, the default client_max_body_size and the
# default fastcgi buffer sizes. This recipe owns one server block and the compose
# wiring.
#
# Source: symfony.com/doc/current/setup/web_server_configuration.html.
when:
  framework: symfony
  uses: nginx
provision:
  compose:
    files:
      - path: docker/nginx/conf.d/app.conf
        verbatim: true
        content: |
          # keel-generated. Symfony server block. Included by the shared nginx.conf from
          # /etc/nginx/conf.d/*.conf.
          #
          # The shared half lives once in recipes/infra/web/nginx.yaml, which owns
          # .keel/nginx/nginx.conf: worker_processes
          # and worker_connections, sendfile / tcp_nopush / keepalive_timeout, the log
          # format, gzip and its type list, server_tokens off, the default security
          # headers, real_ip from the trusted proxy, the default client_max_body_size
          # and the default fastcgi buffer sizes. None are repeated here.
          #
          # Source: symfony.com/doc/current/setup/web_server_configuration.html. The
          # only change is fastcgi_pass, which targets the compose service php:9000
          # rather than the published unix:/var/run/php/php8.3-fpm.sock. Note that the
          # published socket is php8.3 while current stable Symfony requires PHP 8.4.

          server {
              listen 80;
              listen [::]:80;
              server_name _;

              # public/ "is the document root for your web server and contains static
              # files and the front controller (index.php)". The docs use
              # /var/www/project/public throughout.
              root /var/www/html/public;

              location / {
                  # try to serve file directly, fallback to index.php
                  try_files $uri /index.php$is_args$args;
              }

              # Symfony offers this as optional: 404 a missing asset instead of letting
              # it fall through to the front controller and render a Symfony error page
              # for a missing image. Kept, because a 404 for an asset is the honest
              # answer and it keeps PHP out of the asset path entirely.
              location /bundles {
                  try_files $uri =404;
              }

              location ~ ^/index\.php(/|$) {
                  fastcgi_pass php:9000;
                  fastcgi_split_path_info ^(.+\.php)(/.*)$;
                  include fastcgi_params;

                  # "pass the real path, not the symlink, or OPcache may miss changes"
                  # (Symfony's own comment). Both DOCUMENT_ROOT and SCRIPT_FILENAME are
                  # set, which is what makes a symlinked release directory resolve
                  # correctly. Symfony's caveat applies here: "When PHP-FPM is hosted on
                  # a different machine from nginx $realpath_root may not resolve as you
                  # expect! In this case try using $document_root instead." In this
                  # stack nginx and FPM mount the same tree at the same path, so it does
                  # resolve.
                  fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
                  fastcgi_param DOCUMENT_ROOT $realpath_root;

                  # The directive recipes routinely drop. Without it, every route is
                  # reachable twice, at /some-path and at /index.php/some-path, which
                  # duplicates content for search engines and doubles the surface any
                  # path-based rule has to cover. With it, /index.php/some-path is a
                  # plain 404.
                  internal;
              }

              # FPM's status and ping pages, declared in the pool. keel's addition, not
              # Symfony's. Placed before the catch-all 404 below, since nginx takes the
              # first matching regex location. 172.16.0.0/12 is Docker's bridge range.
              location ~ ^/(fpm-status|fpm-ping)$ {
                  allow 127.0.0.1;
                  allow 172.16.0.0/12;
                  deny all;
                  fastcgi_pass php:9000;
                  fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
                  include fastcgi_params;
                  access_log off;
              }

              # return 404 for all other php files not matching the front controller
              location ~ \.php$ {
                  return 404;
              }

              # Not in Symfony's published block. Dotfiles under public/ (an .env that
              # was copied to the wrong place, a stray .git) would otherwise be served.
              location ~ /\.(?!well-known).* {
                  deny all;
              }

              # Symfony's block names per-project log files. Left to the shared config
              # so every site logs the same way; add access_log / error_log here only
              # if this site genuinely needs its own.
          }
      - path: compose.override.yaml
        verbatim: true
        content: |
          # keel-generated. Compose merges compose.override.yaml over compose.yaml with no
          # extra flags.
          services:
            nginx:
              image: nginx:1.27-alpine
              restart: unless-stopped
              depends_on:
                php:
                  condition: service_healthy
              ports:
                - "${HTTP_PORT:-8080}:80"
              volumes:
                # nginx serves public/ directly and never writes.
                - .:/var/www/html:ro
                # Shared, owned by recipes/infra/web/nginx.yaml.
                - ./.keel/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                # This framework's server block, owned by this recipe.
                - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
              # No HTTP healthcheck: Symfony ships no health endpoint and documents no
              # convention for one, a real difference from Laravel's /up
              # (docs/infra/symfony.md, open question 4). Add a route and probe it.
  # DDEV already runs nginx-fpm with a Symfony-aware config.
  ddev: {}
  # Native env: no container. The server block still applies if you run nginx on
  # the host, with fastcgi_pass pointing at your own FPM socket.
  local: {}
