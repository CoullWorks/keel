id: express
kind: framework
label: Express (Node API server)
lang: node
provides: [node, express, self-serving]
default: false
family: express
variant: JavaScript
updated: 2026-08-07
pins:
  express: ^5.1.0
# The Node line is a choice. Only the versions this framework actually
# supports are offered; the note says what each one costs you.
versions:
  node_version:
    label: Node.js version
    recommended: "22"
    options:
      - value: "20"
        label: "Node 20 LTS"
        note: "maintenance only, ends Apr 2026"
      - value: "22"
        label: "Node 22 LTS"
        note: "active LTS, the safe default"
      - value: "24"
        label: "Node 24 LTS"
        note: "newest LTS"
# Express's own generator (express-generator) is effectively abandoned, so keel
# writes a minimal, current Express 5 app directly (deterministic, no prompts).
install:
  # The stack has to be up before anything can exec into it. Under a native
  # env {{start}} renders empty and the engine drops the no-op step.
  - "{{start}}"
  - "{{exec}} npm install"
  # The app started before its dependencies existed, so bring it back up now
  # that they are installed. Renders empty, and is dropped, on a native env.
  - "{{restart}}"
smoke:
  - "{{exec}} node --check src/index.js"
files:
  - path: package.json
    content: |
      {
        "name": "app",
        "private": true,
        "type": "module",
        "scripts": {
          "dev": "node --watch src/index.js",
          "start": "node src/index.js",
          "test": "node --test"
        },
        "dependencies": { "express": "^5.1.0" }
      }
  - path: src/index.js
    content: |
      import express from "express";

      const app = express();
      app.use(express.json());

      // The route keel's own URL points at. Without it a freshly built project
      // answers 404 at the address the build prints, which reads as a broken
      // stack rather than an empty one.
      app.get("/", (_req, res) =>
        res.json({ app: "keel Express", db: process.env.KEEL_DB ?? "sqlite" }),
      );

      app.get("/health", (_req, res) => res.json({ status: "healthy" }));

      const port = process.env.PORT || 3000;
      app.listen(port, () => console.log(`listening on :${port}`));

      export default app;
  - path: .env.example
    content: |
      # Copy to .env and fill in. Generate secrets with: keel secrets sync
      PORT=3000
  - path: .gitignore
    content: |
      node_modules/
      .env
tasks:
  lint: "{{exec}} npx eslint ."
  dev: "{{exec}} npm run dev"
  start: "{{exec}} npm run start"
  test: "{{exec}} npm test"
