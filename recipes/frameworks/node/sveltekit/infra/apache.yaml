id: apache-sveltekit
schema_version: 2
kind: config
label: SvelteKit VirtualHost for Apache
updated: 2026-08-12
# Written from docs/infra/sveltekit.md plus the Apache 2.4 module reference.
# SvelteKit is the only framework here that publishes anything for Apache, but
# what it publishes is an .htaccess for the SPA fallback under adapter-static,
# not a reverse-proxy VirtualHost for adapter-node. This file is the latter, so
# it is keel's.
#
# What is quoted is the header contract and its warning:
#
#   "x-forwarded-proto and x-forwarded-host are de facto standard headers that
#   forward the original protocol and host if you're using a reverse proxy
#   (think load balancers and CDNs). You should only set these variables if your
#   server is behind a trusted reverse proxy; otherwise, it'd be possible for
#   clients to spoof these headers."
#
# That is why PROTOCOL_HEADER and HOST_HEADER are set by THIS recipe rather than
# by the env recipe: they are only safe once a proxy is in front. The proxy
# config and the app environment have to agree or SvelteKit rejects form posts
# as cross-origin.
#
# Division of labour. The shared Apache service (recipes/infra/web/apache.yaml)
# owns .keel/apache/keel-tuning.conf: MPM event tuning, the LoadModule lines for the
# proxy modules, global compression, mod_expires, ServerTokens Prod,
# ServerSignature Off, TraceEnable Off, the global security headers, and the
# `IncludeOptional conf.d/app-*.conf` that pulls this file in.
when:
  framework: sveltekit
  uses: apache
patch:
  - file: .env
    set:
      # mod_proxy_http sets X-Forwarded-Host itself and the vhost below sets
      # X-Forwarded-Proto, both after clearing whatever the client sent, which
      # is the "trusted reverse proxy" precondition the warning above requires.
      PROTOCOL_HEADER: "x-forwarded-proto"
      HOST_HEADER: "x-forwarded-host"
      # Client IP. The adapter reads X-Forwarded-For from the RIGHT, because
      # leftmost entries are client-supplied and spoofable, and XFF_DEPTH counts
      # the trusted proxies. With this Apache as the only hop the value is 1.
      # docs/infra/sveltekit.md records that the docs explain the right-to-left
      # read but never state the single-proxy value, so 1 is keel's reading.
      ADDRESS_HEADER: "x-forwarded-for"
      XFF_DEPTH: "1"
files:
  - path: docker/apache/conf.d/app-sveltekit.conf
    content: |
      # SvelteKit on @sveltejs/adapter-node, proxied. Included by the shared
      # httpd.conf.
      <VirtualHost *:80>
          ServerName localhost

          ProxyRequests Off

          # mod_proxy_http adds X-Forwarded-For, X-Forwarded-Host and
          # X-Forwarded-Server itself, and warns they "will contain more than
          # one (comma-separated) value if the original request already
          # contained one of these headers". For SvelteKit that is not a
          # theoretical concern: HOST_HEADER makes the app derive its own origin
          # from x-forwarded-host, so a client-supplied value left in place is
          # exactly the spoofing the adapter docs warn about. Clearing them
          # first is what makes setting HOST_HEADER safe at all.
          RequestHeader unset X-Forwarded-For
          RequestHeader unset X-Forwarded-Host
          RequestHeader unset X-Forwarded-Server
          # mod_proxy_http does NOT add X-Forwarded-Proto; the documented list
          # is For, Host and Server only. PROTOCOL_HEADER is worthless without
          # it. Change to "https" when TLS terminates at this vhost, or the app
          # builds http:// origins for an https site and rejects its own form
          # posts.
          RequestHeader set X-Forwarded-Proto "http"

          ProxyPreserveHost On

          # upgrade=websocket rather than mod_proxy_wstunnel, which the vendor
          # marks Deprecated: "Since Apache HTTP Server 2.4.47, protocol Upgrade
          # (tunneling) can be better handled by mod_proxy_http." The
          # httpd:2.4-alpine image is 2.4.68. In production nothing upgrades;
          # this is for the Vite HMR WebSocket in development, which the adapter
          # page does not document proxying.
          #
          # ttl=50 retires a pooled backend connection before Node's own idle
          # close can pull it out from under Apache. Unlike nginx, which opens a
          # fresh connection per request unless an upstream keepalive is
          # declared, Apache pools by default, so the keep-alive mismatch that
          # produces intermittent 502s applies here. SvelteKit leaves
          # KEEP_ALIVE_TIMEOUT at Node's default.
          ProxyPass        / http://app:3000/ upgrade=websocket connectiontimeout=5 timeout=60 ttl=50
          ProxyPassReverse / http://app:3000/

          # /_app/immutable/ is where SvelteKit puts the content-hashed client
          # assets. SvelteKit publishes NO Cache-Control value, unlike Next.js
          # and Astro which both document public, max-age=31536000, immutable,
          # so this is keel's convention justified only by the filenames being
          # hashed. Scoped to that path and nowhere else: the HTML around these
          # assets is rendered per request and must not be cached, which is why
          # the shared keel-tuning.conf's mod_expires configuration must not set a
          # global ExpiresDefault.
          #
          # `always` puts the header in the table mod_headers documents as the
          # one whose contents "are added to the response even on error", and
          # `set` replaces rather than appends.
          <LocationMatch "^/_app/immutable/">
              Header always set Cache-Control "public, max-age=31536000, immutable"
          </LocationMatch>

          # LimitRequestBody alone does NOT cap a proxied request, and this is
          # not a guess: it was tested against httpd 2.4.68 in this exact
          # topology. With LimitRequestBody set on the vhost, a POST an order of
          # magnitude over the limit still reached the backend with a 200. The
          # directive is enforced when Apache itself serves the request, not
          # when mod_proxy_http streams the body through to a backend. So the
          # rewrite below is what actually rejects it. [R=413] aborts with that
          # status rather than redirecting, because mod_rewrite treats any code
          # outside 300-399 as an abort.
          #
          # Caveat worth knowing: this reads the declared Content-Length, so a
          # chunked upload that sends none is not caught. nginx's
          # client_max_body_size covers both cases. Keep the application's own
          # body limit as the backstop either way.
          RewriteEngine On
          RewriteCond expr "%{HTTP:Content-Length} -gt 524288"
          RewriteRule ^ - [R=413,L]
          # LimitRequestBody defaults to 0, unlimited. 524288 bytes is
          # adapter-node's own BODY_SIZE_LIMIT default of 512kb expressed in
          # bytes, so Apache and the app refuse the same upload rather than one
          # failing at a limit the other does not know about. Raise both
          # together or neither.
          LimitRequestBody 524288
      </VirtualHost>

      # Apache has no one-line equivalent of nginx's `return 200`, so there is
      # no proxy-local health endpoint. The container health check probes the
      # app through this vhost, which proves the whole proxy path.
      #
      # Streaming: the adapter's compression note establishes that SvelteKit
      # streams responses. Apache implements no X-Accel-Buffering equivalent,
      # but mod_proxy_http forwards the response as it reads it rather than
      # accumulating the whole body, so streaming works through this vhost.
      # That is keel's reading of the module, not a statement either vendor
      # makes.
provision:
  compose:
    files:
      - path: compose.override.yaml
        content: |
          # Compose merges compose.override.yaml over compose.yaml with no extra
          # flags, so the app service written by the env recipe is untouched.
          services:
            apache:
              image: httpd:2.4-alpine
              # The stock httpd.conf is left in place: it loads mpm_event and the base
              # module set. -c appends this directive after it is read, pulling in the
              # shared tuning and this framework's VirtualHost. Without it the image
              # starts on stock config and serves its default page - it does not fail.
              command: ["httpd-foreground", "-c", "Include conf/keel-tuning.conf"]
              restart: unless-stopped
              depends_on:
                app:
                  condition: service_healthy
              ports:
                - "${HTTP_PORT:-8080}:80"
              volumes:
                # Shared, owned by recipes/infra/web/apache.yaml.
                - ./.keel/apache/keel-tuning.conf:/usr/local/apache2/conf/keel-tuning.conf:ro
                # This framework's VirtualHost, owned by this recipe.
                - ./docker/apache/conf.d:/usr/local/apache2/conf.d:ro
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
                interval: 15s
                timeout: 5s
                retries: 5
                start_period: 10s
              # adapter-node's SHUTDOWN_TIMEOUT defaults to 30 seconds, so the
              # app can take that long to drain. The proxy gets the same.
              stop_grace_period: 30s
  # Native env: no container to add. The VirtualHost above still applies, but
  # change the ProxyPass target to http://127.0.0.1:3000/.
  local: {}
