id: apache-nestjs
schema_version: 2
kind: config
label: NestJS VirtualHost for Apache
updated: 2026-08-12
# Written from docs/infra/nestjs.md plus the Apache 2.4 module reference. Nest
# names nginx and AWS ELB as load balancers and publishes no Apache
# configuration, so the directives below are keel's translation of what its
# rate-limiting chapter requires, not a vendor artefact.
#
# Division of labour. The shared Apache service (recipes/infra/web/apache.yaml)
# owns .keel/apache/keel-tuning.conf: MPM event tuning, the LoadModule lines for the
# proxy modules, global compression, mod_expires, ServerTokens Prod,
# ServerSignature Off, TraceEnable Off, the global security headers, and the
# `IncludeOptional conf.d/app-*.conf` that pulls this file in.
#
# mod_remoteip is deliberately not configured: Apache is the edge here. Behind
# a load balancer, RemoteIPHeader plus RemoteIPInternalProxy belong in the
# shared httpd.conf.
when:
  framework: nestjs
  uses: apache
patch:
  - file: .env
    # Nest's own example is `app.set('trust proxy', 'loopback')`. Right shape,
    # wrong value here: the proxy is a sibling container on an RFC1918 compose
    # network, so loopback alone never matches and every request looks like it
    # came from the proxy, which is the failure that makes the throttler limit
    # all users as one. Never true: that is the other failure, where a client
    # spoofs X-Forwarded-For and bypasses the limiter entirely.
    set:
      TRUST_PROXY: "loopback, uniquelocal"
files:
  - path: docker/apache/conf.d/app-nestjs.conf
    content: |
      # NestJS on the Express adapter, proxied. Included by the shared
      # httpd.conf.
      <VirtualHost *:80>
          ServerName localhost

          ProxyRequests Off

          # mod_proxy_http adds X-Forwarded-For, X-Forwarded-Host and
          # X-Forwarded-Server itself, and warns they "will contain more than
          # one (comma-separated) value if the original request already
          # contained one of these headers". Nest's ThrottlerBehindProxyGuard
          # reads req.ips[0], the leftmost entry, so a client-supplied value
          # left in place is precisely what it would key the rate limit on.
          # Clearing them first is the Apache spelling of
          # real-IP-from-the-trusted-proxy-only.
          RequestHeader unset X-Forwarded-For
          RequestHeader unset X-Forwarded-Host
          RequestHeader unset X-Forwarded-Server
          # mod_proxy_http does NOT add X-Forwarded-Proto; the documented list
          # is For, Host and Server only. express-session `secure: true` cookies
          # silently stop being set without it. Change to "https" when TLS
          # terminates at this vhost.
          RequestHeader set X-Forwarded-Proto "http"

          ProxyPreserveHost On

          # upgrade=websocket rather than mod_proxy_wstunnel, which the vendor
          # marks Deprecated: "Since Apache HTTP Server 2.4.47, protocol Upgrade
          # (tunneling) can be better handled by mod_proxy_http." The
          # httpd:2.4-alpine image is 2.4.68. This carries @nestjs/websockets
          # gateways. Gateway proxying and sticky sessions are listed as
          # unresearched in docs/infra/nestjs.md; this makes the transport work,
          # it does not verify a gateway deployment.
          ProxyPass        / http://app:3000/ upgrade=websocket connectiontimeout=5 timeout=60
          ProxyPassReverse / http://app:3000/

          # LimitRequestBody alone does NOT cap a proxied request, and this is
          # not a guess: it was tested against httpd 2.4.68 in this exact
          # topology. With LimitRequestBody set on the vhost, a POST an order of
          # magnitude over the limit still reached the backend with a 200. The
          # directive is enforced when Apache itself serves the request, not
          # when mod_proxy_http streams the body through to a backend. So the
          # rewrite below is what actually rejects it. [R=413] aborts with that
          # status rather than redirecting, because mod_rewrite treats any code
          # outside 300-399 as an abort.
          #
          # Caveat worth knowing: this reads the declared Content-Length, so a
          # chunked upload that sends none is not caught. nginx's
          # client_max_body_size covers both cases. Keep the application's own
          # body limit as the backstop either way.
          RewriteEngine On
          RewriteCond expr "%{HTTP:Content-Length} -gt 102400"
          RewriteRule ^ - [R=413,L]
          # LimitRequestBody defaults to 0, unlimited. 102400 bytes is the
          # platform-express adapter's own "100kb" default expressed in bytes.
          # If you switch to FastifyAdapter its bodyLimit default is 1048576,
          # ten times this, and both numbers have to move together.
          LimitRequestBody 102400
      </VirtualHost>

      # Apache has no one-line equivalent of nginx's `return 200`, so there is
      # no proxy-local health endpoint. The container health check probes the
      # app's own /health through this vhost, which proves the whole proxy path.
      # Keep that distinct from the Terminus readiness route, which should carry
      # the dependency indicators.
provision:
  compose:
    files:
      - path: compose.override.yaml
        content: |
          # Compose merges compose.override.yaml over compose.yaml with no extra
          # flags, so the app service written by the env recipe is untouched.
          services:
            apache:
              image: httpd:2.4-alpine
              # The stock httpd.conf is left in place: it loads mpm_event and the base
              # module set. -c appends this directive after it is read, pulling in the
              # shared tuning and this framework's VirtualHost. Without it the image
              # starts on stock config and serves its default page - it does not fail.
              command: ["httpd-foreground", "-c", "Include conf/keel-tuning.conf"]
              restart: unless-stopped
              depends_on:
                app:
                  condition: service_healthy
              ports:
                - "${HTTP_PORT:-8080}:80"
              volumes:
                # Shared, owned by recipes/infra/web/apache.yaml.
                - ./.keel/apache/keel-tuning.conf:/usr/local/apache2/conf/keel-tuning.conf:ro
                # This framework's VirtualHost, owned by this recipe.
                - ./docker/apache/conf.d:/usr/local/apache2/conf.d:ro
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
                interval: 15s
                timeout: 5s
                retries: 5
                start_period: 10s
              stop_grace_period: 30s
  # DDEV runs this project with --webserver-type=generic, so Traefik forwards
  # straight to the dev-server daemon on :3000 and no apache is in the local
  # path. The server block above is still written, so the deployment shape is
  # version-controlled next to the code that assumes it.
  ddev: {}
  # Native env: no container to add. The VirtualHost above still applies, but
  # change the ProxyPass target to http://127.0.0.1:3000/.
  local: {}
