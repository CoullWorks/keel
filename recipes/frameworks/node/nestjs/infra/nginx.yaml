id: nginx-nestjs
schema_version: 2
kind: config
label: NestJS server block for NGINX
updated: 2026-08-12
# Written from docs/infra/nestjs.md. Nest documents nginx only in passing, as a
# load-balancer option; what it documents properly, in its rate-limiting
# chapter, is trust proxy, because that is where getting it wrong is most
# obviously exploitable.
#
# Division of labour. The shared NGINX service (recipes/infra/web/nginx.yaml)
# owns .keel/nginx/nginx.conf: worker and http-level tuning, the log format,
# gzip and its type list, server_tokens off, the default security headers,
# real_ip from the trusted proxy, and the default client_max_body_size and
# proxy timeouts. This recipe owns one server block and the compose wiring.
when:
  framework: nestjs
  uses: nginx
patch:
  - file: .env
    # Nest inherits its adapter's setting and its own example is
    # `app.set('trust proxy', 'loopback')` with the comment "Trust requests from
    # the loopback address". That is the right shape and the wrong value for
    # this topology: the proxy is a sibling container on the compose bridge
    # network, so its address is RFC1918 and loopback alone never matches.
    # `uniquelocal` is added, which is a pre-configured subnet name the
    # underlying Express adapter documents.
    #
    # Never true. Nest states both failure modes plainly: with trust proxy off
    # every request appears to come from the proxy and the throttler limits all
    # users as one; with it true on a directly reachable pod a client spoofs
    # X-Forwarded-For and bypasses the limiter entirely. Neither failure is
    # loud.
    set:
      TRUST_PROXY: "loopback, uniquelocal"
files:
  - path: docker/nginx/conf.d/app.conf
    content: |
      # NestJS on the Express adapter, proxied. Included by the shared
      # nginx.conf from /etc/nginx/conf.d/*.conf; http-level config lives there.
      server {
        listen 80;
        server_name _;

        # Overrides the shared default (nginx documents client_max_body_size
        # 1m). Nest documents no body limit of its own; it inherits the
        # adapter's, and platform-express defaults express.json() and
        # express.urlencoded() to "100kb". The tenfold difference against the
        # Fastify adapter's 1 MiB bodyLimit is exactly why the adapter is worth
        # stating rather than relying on defaults: if you switch to
        # FastifyAdapter, raise this to 1m.
        client_max_body_size 100k;

        location / {
          proxy_pass http://app:3000;

          # Nest's throttler reads req.ips[0] then req.ip, both of which come
          # from X-Forwarded-For and neither of which is populated until trust
          # proxy is set. The .env patch in this recipe sets it.
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

          # Append, not overwrite: nginx adds the real peer to whatever the
          # client sent, and the framework walks the list from the right
          # discarding trusted hops, so a client-supplied prefix is dropped
          # before it can become the client IP. That holds while the real client
          # is outside the trusted ranges, which is the internet-facing case. If
          # this app only ever serves traffic that is itself inside those ranges,
          # switch to `$remote_addr` here so the header is true by construction,
          # which is what the Hono recipe has to do because Hono has no walk at
          # all. Keep the append form if a CDN or load balancer sits in front and
          # you need its hop preserved, and widen the trusted set to match.

          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host  $host;

          # WebSocket upgrade, for @nestjs/websockets gateways. nginx's simple
          # documented form; it sends Connection: upgrade on every request,
          # which is what Fastify's published config does too. The general
          # alternative is a `map $http_upgrade $connection_upgrade` at http
          # level, which only the shared nginx.conf can declare because map is
          # an http-context directive. Gateway proxying, sticky sessions and
          # shutdown behaviour are listed as unresearched in
          # docs/infra/nestjs.md, so treat this as the transport working rather
          # than as a verified gateway deployment.
          proxy_set_header Upgrade    $http_upgrade;
          proxy_set_header Connection "upgrade";

          # Buffering left at the shared default (nginx documents
          # proxy_buffering on). Nest takes no position on streaming.

          # No `upstream { keepalive N; }`, so nginx opens a fresh connection
          # per request. Under the Express adapter the app's keepAliveTimeout is
          # Node's 5 second default, well under nginx's documented 60 second
          # proxy_read_timeout, which is precisely the mismatch that produces
          # the intermittent 502 AdonisJS documents. Adding upstream keep-alive
          # here without raising the app's timeout reintroduces it.
        }

        # Answered by nginx, so the web tier's liveness does not depend on the
        # app. add_header at this level stops the shared http-level add_header
        # directives being inherited into it, which is nginx's documented
        # behaviour and is harmless for a health endpoint. Keep it distinct from
        # the Terminus readiness route, which should carry the dependency
        # indicators.
        location = /healthz {
          access_log off;
          add_header Content-Type text/plain;
          return 200 "ok\n";
        }
      }
provision:
  compose:
    files:
      - path: compose.override.yaml
        content: |
          # Compose merges compose.override.yaml over compose.yaml with no extra
          # flags, so the app service written by the env recipe is untouched.
          services:
            nginx:
              image: nginx:1.27-alpine
              restart: unless-stopped
              depends_on:
                app:
                  condition: service_healthy
              # The app service stays on `expose` only, so this is the single
              # route in. That is what makes the trusted-hop setting sound:
              # there is no shorter path a client could take to spoof
              # X-Forwarded-For past the throttler.
              ports:
                - "${HTTP_PORT:-8080}:80"
              volumes:
                # Shared, owned by recipes/infra/web/nginx.yaml.
                - ./.keel/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
                # This framework's server block, owned by this recipe.
                - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
              healthcheck:
                test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
                interval: 15s
                timeout: 5s
                retries: 5
                start_period: 10s
              stop_grace_period: 30s
  # Native env: no container to add. The server block above still applies, but
  # change proxy_pass to http://127.0.0.1:3000 because there is no `app` host.
  local: {}
