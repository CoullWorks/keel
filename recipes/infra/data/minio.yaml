id: minio
schema_version: 2
kind: service
label: MinIO (S3-compatible object storage, pinned)
category: Storage
appliesTo: [laravel, django, magento, magento-mageos]
provides: [minio, s3]
updated: 2026-08-12
vars:
  # PINNED TO AN EXACT RELEASE, and not to `latest`, because of where the
  # project is. Read MINIO.md before adopting this for anything long-lived.
  #   - The last community (AGPLv3) image published to Docker Hub and Quay is
  #     RELEASE.2025-09-07T16-13-09Z.
  #   - There is a later SOURCE release, RELEASE.2025-10-15T17-29-55Z, whose own
  #     release notes say "For container environments, please clone the source
  #     and build the latest container" - no image was published for it, and it
  #     carried a privilege-escalation fix.
  #   - MinIO's documentation site now serves AIStor, the commercial product,
  #     whose container image requires a licence file.
  # `latest` currently resolves to the September 2025 build anyway; pinning makes
  # that visible instead of letting a future retag change the stack silently.
  minio.version: "RELEASE.2025-09-07T16-13-09Z"
  minio.host: minio
  minio.port: "9000"
  minio.consolePort: "9001"
  minio.bucket: app
  # Root credentials. "NEVER use the default credentials in production
  # environments. MinIO strongly recommends specifying a unique, long, and random
  # MINIO_ROOT_USER value for all environments."
  # https://docs.min.io/enterprise/aistor-object-store/reference/aistor-server/settings/root-credentials/
  # The server enforces a minimum of 3 characters for the access key and 8 for
  # the secret (internal/auth/credentials.go); neither minimum is documented, and
  # neither is a password policy.
  minio.rootUser: keel-local-root
  minio.rootPassword: keel-local-root-change-me
files:
  - path: docker-compose.minio.yml
    content: |
      # keel-generated: MinIO object storage.
      # Standalone: docker compose -f docker-compose.minio.yml up -d
      # Or merged:  docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d
      services:
        minio:
          image: minio/minio:{{minio.version}}
          restart: unless-stopped
          # The documented server invocation. --console-address is required for a
          # fixed console port: "MinIO runs console on random port by default, if
          # you wish to choose a specific port use --console-address to pick a
          # specific interface and port."
          # https://github.com/minio/minio/blob/master/README.md
          command: ["server", "/data", "--console-address", ":{{minio.consolePort}}"]
          environment:
            # Root credentials can only be set this way: "On MinIO admin
            # credentials or root credentials are only allowed to be changed
            # using ENVs namely MINIO_ROOT_USER and MINIO_ROOT_PASSWORD."
            # https://github.com/minio/minio/blob/master/docs/config/README.md
            # Omitting them leaves the published default minioadmin/minioadmin.
            MINIO_ROOT_USER: "{{minio.rootUser}}"
            MINIO_ROOT_PASSWORD: "{{minio.rootPassword}}"
            # Set MINIO_BROWSER=off to drop the console entirely on a deployment
            # that only needs the S3 API: "Enable or disable access to console web
            # UI. By default it is set to on."
            # MINIO_BROWSER: "off"
          volumes:
            - minio-data:/data
          ports:
            # S3 API and console, both on loopback.
            - "127.0.0.1:{{minio.port}}:9000"
            - "127.0.0.1:{{minio.consolePort}}:{{minio.consolePort}}"
          healthcheck:
            # The documented liveness endpoint. Read what it actually promises:
            # "/minio/health/live ... This probe always responds with '200 OK'.
            # Only fails if 'etcd' is configured and unreachable."
            # https://github.com/minio/minio/blob/master/docs/metrics/healthcheck/README.md
            # So this proves the HTTP listener is answering, and nothing about
            # the health of the storage behind it. For that, the same page
            # documents /minio/health/cluster, which "is '200 OK' if cluster has
            # write quorum if not it returns '503 Service Unavailable'" - which on
            # a single-drive deployment is nearly the same statement.
            test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 8
            start_period: 20s
        # One-shot: create the application bucket, then exit. Re-running is
        # harmless (--ignore-existing), so it is safe on every `up`.
        minio-init:
          image: minio/mc:latest
          depends_on:
            minio:
              condition: service_healthy
          entrypoint: >-
            /bin/sh -c "
            mc alias set local http://minio:9000 {{minio.rootUser}} {{minio.rootPassword}} &&
            mc mb --ignore-existing local/{{minio.bucket}} &&
            mc anonymous set none local/{{minio.bucket}}
            "
          restart: "no"
      volumes:
        minio-data:
  - path: MINIO.md
    content: |
      # MinIO (scaffolded by keel)

      S3 API http://127.0.0.1:{{minio.port}} · console
      http://127.0.0.1:{{minio.consolePort}} · bucket `{{minio.bucket}}` ·
      credentials `{{minio.rootUser}}` / `{{minio.rootPassword}}`.

      ## Read this before using MinIO in a new project

      The community server is not being released the way it used to be, and that
      is a decision to make deliberately rather than discover later:

      - **The last community image is from September 2025**
        (`RELEASE.2025-09-07T16-13-09Z`), which is what this recipe pins.
      - **A later source release exists with no image.**
        `RELEASE.2025-10-15T17-29-55Z` tells you to build your own: "For
        container environments, please clone the source and build the latest
        container." It included a privilege-escalation fix.
      - **The embedded console was cut in May 2025.** The release notes for
        `RELEASE.2025-05-24T17-08-30Z`, titled "Breaking Release", state
        "Embedded UI Console is now deprecated and moved to object-browser" and
        "External IDP logins via LDAP/OIDC are removed as well; these are now
        available as part of the AiStor Product." What is left is a basic object
        browser, not an administration UI: use `mc` or the admin API.
      - **The documentation site now serves the commercial product.**
        `min.io/docs/minio/...` redirects to `docs.min.io/enterprise/aistor-...`,
        whose container image requires a mounted licence file.

      That is fine for what this recipe is for: a local S3 stand-in so the
      application's storage layer is exercised against real S3 semantics instead
      of the local filesystem. For durable production object storage, decide
      explicitly between AIStor, a hosted S3 (S3, R2, B2, Spaces) or another
      self-hosted implementation.

      ## Change the credentials

          MINIO_ROOT_USER / MINIO_ROOT_PASSWORD in docker-compose.minio.yml

      The server accepts an access key of 3 characters and a secret of 8, and
      enforces nothing else. Generate real ones (`openssl rand -hex 24`) and give
      the application its own non-root user with a policy scoped to its bucket,
      rather than handing it the root credentials:

          mc admin user add local app-user "$(openssl rand -hex 24)"
          mc admin policy attach local readwrite --user app-user

      ## One container, one drive

      This is a single drive with no erasure coding, so there is no parity, no
      self-healing and no availability beyond what the underlying volume gives
      you. Production erasure coding needs multiple drives per erasure set and a
      parity of at least `EC:3`. Back the volume up like any other database.

      ## Behind a reverse proxy

      Set `MINIO_BROWSER_REDIRECT_URL` to the console's external hostname:
      "If you want to host the Console UI exclusively from a reverse-proxy
      service, you must specify the hostname managed by that service." Serve the
      API and the console on separate hostnames rather than sub-paths.
provision:
  ddev:
    files:
      - path: .ddev/docker-compose.minio.yaml
        content: |
          # keel-generated: MinIO for DDEV.
          # Rationale for every setting: docker-compose.minio.yml and MINIO.md.
          services:
            minio:
              container_name: ddev-${DDEV_SITENAME}-minio
              image: minio/minio:{{minio.version}}
              hostname: minio
              restart: "no"
              command: ["server", "/data", "--console-address", ":{{minio.consolePort}}"]
              labels:
                com.ddev.site-name: ${DDEV_SITENAME}
                com.ddev.approot: ${DDEV_APPROOT}
              environment:
                - MINIO_ROOT_USER={{minio.rootUser}}
                - MINIO_ROOT_PASSWORD={{minio.rootPassword}}
                - VIRTUAL_HOST=$DDEV_HOSTNAME
                - HTTP_EXPOSE=9000:9000,9001:{{minio.consolePort}}
                - HTTPS_EXPOSE=9002:9000,9003:{{minio.consolePort}}
              expose:
                - "9000"
                - "{{minio.consolePort}}"
              volumes:
                - minio:/data
              healthcheck:
                test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
                interval: 15s
                timeout: 5s
                retries: 8
                start_period: 20s
          volumes:
            minio:
    install:
      - "{{restart}}"
  compose: {}
  sail: {}
  local:
    install:
      - "docker compose -f docker-compose.minio.yml up -d"
