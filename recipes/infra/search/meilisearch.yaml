id: meilisearch
schema_version: 2
kind: service
label: Meilisearch v1.53 (search engine, tuned)
category: Search
appliesTo: [laravel, django]
provides: [meilisearch, search]
updated: 2026-08-12
vars:
  meili.version: "v1.53"
  meili.host: meilisearch
  meili.port: "7700"
  # A master key must be at least 16 bytes or Meilisearch refuses to start in
  # production mode. This one is a placeholder that satisfies the length rule and
  # nothing else: replace it before anything but your laptop can reach the port.
  #   openssl rand -base64 32
  meili.masterKey: "keel-local-development-master-key-replace-me"
files:
  # Meilisearch reads a TOML config file as well as environment variables:
  # "Environment variable: MEILI_CONFIG_FILE_PATH, CLI option: --config-file-path,
  # Default: ./config.toml".
  # https://www.meilisearch.com/docs/learn/configuration/instance_options
  # The file is the readable place for the settings that never change per
  # environment; the master key stays in the environment, where a secret belongs.
  - path: .keel/meilisearch/config.toml
    content: |
      # keel-generated: Meilisearch instance options.
      # All defaults quoted from
      # https://www.meilisearch.com/docs/learn/configuration/instance_options
      # (fetched 2026-08-12).

      # Default is "localhost:7700", which inside a container means the container
      # itself and nothing else can reach it. 0.0.0.0 exposes it on the container
      # network only; the published port is bound to loopback in the compose file.
      http_addr = "0.0.0.0:7700"

      # production or development. In production:
      #   - "Setting a master key of at least 16 bytes is mandatory. If no master
      #     key is provided or if it is under 16 bytes, Meilisearch will suggest a
      #     secure autogenerated master key"
      #   - "The search preview interface is disabled"
      # In development, "Setting a master key is optional. If none is given, all
      # routes will be unprotected and publicly accessible."
      #
      # production is the default here on purpose. An unauthenticated Meilisearch
      # lets anyone read every indexed document, and search indexes routinely
      # contain customer names, order references and unpublished content.
      env = "production"

      # Where the LMDB database lives inside the container. Default is "data.ms/"
      # relative to the working directory; this is explicit so the volume mount
      # and the setting cannot drift apart.
      db_path = "/meili_data/data.ms"

      # Snapshots are "an exact copy of your database", "already 'indexed' and
      # ready to go, therefore they import faster than dumps", but they "cannot be
      # used to migrate to a new Meilisearch release". Dumps are "closer to a
      # blueprint that allows you to rebuild an identical database" and are what
      # you take before an upgrade.
      # https://www.meilisearch.com/docs/learn/data_backup/snapshots_vs_dumps
      #
      # Snapshots are disabled by default. Enabled here at the documented default
      # interval of 86400 seconds (24 hours).
      schedule_snapshot = 86400
      snapshot_dir = "/meili_data/snapshots"
      dump_dir = "/meili_data/dumps"

      # "Deactivates Meilisearch's built-in telemetry when provided. Meilisearch
      # automatically collects data from all instances that do not opt out using
      # this flag." Telemetry is opt-out, so a config that does not mention it is
      # a config that sends data.
      no_analytics = true

      log_level = "INFO"

      # max_indexing_memory is left at its default, "2/3 of the available RAM".
      # Set it explicitly if the container shares a host with the database:
      #   max_indexing_memory = "1 GiB"
      # Meilisearch stores data in a memory-mapped file, so "it is the operating
      # system that manages the real memory allocated (or not) to Meilisearch"
      # and the virtual-memory figure a monitor reports is not resident memory.
      # https://www.meilisearch.com/docs/resources/internals/storage
  - path: docker-compose.meilisearch.yml
    content: |
      # keel-generated: Meilisearch {{meili.version}}.
      # Standalone: docker compose -f docker-compose.meilisearch.yml up -d
      # Or merged:  docker compose -f docker-compose.yml -f docker-compose.meilisearch.yml up -d
      services:
        meilisearch:
          image: getmeili/meilisearch:{{meili.version}}
          restart: unless-stopped
          environment:
            # The key is an environment variable, not a config-file entry, so it
            # can come from a secret store in a deployment without editing files.
            MEILI_MASTER_KEY: "{{meili.masterKey}}"
            MEILI_CONFIG_FILE_PATH: /etc/meilisearch/config.toml
          volumes:
            # "/meili_data" is the documented data volume; the database itself
            # lives at /meili_data/data.ms.
            # https://www.meilisearch.com/docs/resources/self_hosting/getting_started/docker
            - meili-data:/meili_data
            - ./.keel/meilisearch/config.toml:/etc/meilisearch/config.toml:ro
          ports:
            # Loopback only. The master key is the only thing between this port
            # and every document in the index.
            - "127.0.0.1:7700:7700"
          healthcheck:
            # GET /health is the one route the master key does not protect, which
            # makes it the right healthcheck: it needs no credentials and it
            # answers from the search engine itself rather than from the socket.
            # It returns {"status":"available"} with HTTP 200 when healthy.
            # https://www.meilisearch.com/docs/reference/api/health/get-health
            # (GET /version does require a bearer token, so it is the wrong choice.)
            test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s
      volumes:
        meili-data:
  - path: MEILISEARCH.md
    content: |
      # Meilisearch (scaffolded by keel)

      Config `.keel/meilisearch/config.toml`, service
      `docker-compose.meilisearch.yml` (DDEV:
      `.ddev/docker-compose.meilisearch.yaml`).

      URL `http://127.0.0.1:7700` · master key: see `MEILI_MASTER_KEY` in the
      compose file.

      ## Replace the master key

          openssl rand -base64 32

      Then set it in the compose environment (or your secret store) and in the
      application (`MEILISEARCH_KEY` for Laravel Scout,
      `MEILISEARCH_MASTER_KEY` for a Django client). Never use the master key in
      a browser: mint a search-only API key from `GET /keys` and ship that.

      ## Two backups that are not interchangeable

      - **Snapshot** - an exact copy of the database, fast to restore, and it
        cannot be restored into a different Meilisearch version. Scheduled every
        24 hours in the config.
      - **Dump** - a rebuildable blueprint. This is the one you take before
        upgrading Meilisearch, and the only one that survives a version change.

      Disk: deleting documents does not return disk to the filesystem. LMDB's
      on-disk size "tends to increase over time", so size the volume for growth.
provision:
  ddev:
    files:
      - path: .ddev/docker-compose.meilisearch.yaml
        content: |
          # keel-generated: Meilisearch {{meili.version}} for DDEV.
          # Rationale for every setting: .keel/meilisearch/config.toml.
          services:
            meilisearch:
              container_name: ddev-${DDEV_SITENAME}-meilisearch
              image: getmeili/meilisearch:{{meili.version}}
              hostname: meilisearch
              restart: "no"
              labels:
                com.ddev.site-name: ${DDEV_SITENAME}
                com.ddev.approot: ${DDEV_APPROOT}
              environment:
                - MEILI_MASTER_KEY={{meili.masterKey}}
                - MEILI_CONFIG_FILE_PATH=/etc/meilisearch/config.toml
                - VIRTUAL_HOST=$DDEV_HOSTNAME
                - HTTP_EXPOSE=7700:7700
                - HTTPS_EXPOSE=7701:7700
              expose:
                - "7700"
              volumes:
                - meilisearch:/meili_data
                # Relative to .ddev/, so this is the project-root copy.
                - "../.keel/meilisearch/config.toml:/etc/meilisearch/config.toml:ro"
              healthcheck:
                test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || exit 1"]
                interval: 10s
                timeout: 5s
                retries: 10
                start_period: 20s
          volumes:
            meilisearch:
    install:
      - "{{restart}}"
  compose: {}
  sail: {}
  local:
    install:
      - "docker compose -f docker-compose.meilisearch.yml up -d"
