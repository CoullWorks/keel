# Test suite as a level: stack generator. Points at the flask-pytest addon, so
# `keel gen tests` on a Flask project adds pytest and a first passing test.
id: gen-tests-flask
kind: generator
level: stack
label: "Test suite (pytest)"
appliesTo: [flask]
provides: [tests]
apply: [flask-pytest]
schema_version: 2
updated: 2026-08-24
