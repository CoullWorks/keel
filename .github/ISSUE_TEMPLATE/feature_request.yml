name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that keel does not support today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like keel to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Anything you have already tried or considered, and why it fell short.
