name: verify-stacks

# Proves each recipe actually BOOTS (not just composes): builds the stack in a
# throwaway dir with the real installers, then runs its smoke steps. Weekly +
# on demand, because a full build (composer/npm/uv/ddev) takes minutes.
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      framework:
        description: "single framework to verify (blank = all)"
        required: false
      tier:
        description: "which tier to run"
        required: false
        default: all
        type: choice
        options: [all, native, ddev, full]

permissions:
  contents: read

jobs:
  # Native-env stacks (no Docker): Node + Python frameworks + the UI-kit combos.
  native:
    runs-on: ubuntu-latest
    # Honour the workflow_dispatch inputs: without these the "single framework"
    # box did nothing and every run was the full matrix.
    if: ${{ github.event.inputs.tier == '' || github.event.inputs.tier == 'all' || github.event.inputs.tier == 'native' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { framework: fastapi, env: fastapi-local, with: "" }
          - { framework: nextjs, env: nextjs-local, with: "" }
          - { framework: nextjs, env: nextjs-local, with: "nextjs-tailwind,nextjs-shadcn" }
          - { framework: nextjs, env: nextjs-local, with: "nextjs-mui" }
          - { framework: nextjs, env: nextjs-local, with: "nextjs-tailwind,nextjs-daisyui" }
          - { framework: nextjs, env: nextjs-local, with: "nextjs-chakra" }
          - { framework: express, env: express-local, with: "" }
          - { framework: fastify, env: fastify-local, with: "" }
          - { framework: hono, env: hono-local, with: "" }
          - { framework: nestjs, env: nestjs-local, with: "" }
          - { framework: adonisjs, env: adonisjs-local, with: "", node: "24" }
          - { framework: astro, env: astro-local, with: "" }
          - { framework: astro, env: astro-local, with: "astro-tailwind,astro-daisyui" }
          - { framework: astro, env: astro-local, with: "astro-bootstrap" }
          - { framework: astro, env: astro-local, with: "astro-tailwind,astro-flowbite" }
          - { framework: sveltekit, env: sveltekit-local, with: "" }
          - { framework: sveltekit, env: sveltekit-local, with: "sveltekit-tailwind,sveltekit-daisyui" }
          - { framework: nuxt, env: nuxt-local, with: "" }
          - { framework: nuxt, env: nuxt-local, with: "nuxt-tailwind,nuxt-daisyui" }
          - { framework: nuxt, env: nuxt-local, with: "nuxt-primevue" }
          - { framework: nuxt, env: nuxt-local, with: "nuxt-vuetify" }
          - { framework: flask, env: flask-local, with: "" }
          - { framework: streamlit, env: streamlit-local, with: "" }
          - { framework: gradio, env: gradio-local, with: "" }
          - { framework: dash, env: dash-local, with: "" }
          - { framework: reflex, env: reflex-local, with: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node || '22' }}
      # Newer npm than the one bundled with Node: works around an arborist
      # regression ("Cannot read properties of null (reading 'edgesOut')") that
      # breaks a fresh `npm install` of the Nuxt dependency tree.
      - run: npm install -g npm@latest
      - run: go build -o keel ./cmd/keel
      - name: Verify ${{ matrix.framework }} ${{ matrix.with }}
        if: ${{ github.event.inputs.framework == '' || github.event.inputs.framework == matrix.framework }}
        run: ./keel recipes verify ${{ matrix.framework }} --env ${{ matrix.env }} ${{ matrix.with != '' && format('--with {0}', matrix.with) || '' }}

  # End-to-end CLI test: drives the real `keel new` binary through every stack
  # (dry-run, offline) — proves the whole resolve→render→plan path, including the
  # frontend + UI-kit combos. Fast; complements the boot-level `native`/`ddev`
  # jobs above. `make e2e-visible` / `e2e-full` run the boot+teardown levels.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: e2e (dry — every stack through the real binary)
        run: make e2e

  # Every generated nginx and Apache config, handed to the real servers to
  # parse. Cheap (two image pulls and 44 short container runs) and it covers
  # every framework, including the ones no boot-level job here exercises. A web
  # server that refuses its config is a stack with no way into it.
  web-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: web server configs parse
        run: make web-config

  # DDEV stacks (need Docker): the PHP frameworks + Django. Locks in the DDEV
  # web-image fixes (uv installer, venv perms) and the create-project ordering.
  ddev:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.tier == '' || github.event.inputs.tier == 'all' || github.event.inputs.tier == 'ddev' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { framework: laravel, env: ddev }
          - { framework: symfony, env: symfony-ddev }
          - { framework: django, env: django-ddev }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: ddev/github-action-setup-ddev@v1
        with:
          # keel's own repo has no .ddev project; the action's default autostart
          # tries to start one and fails. keel starts ddev itself during verify.
          autostart: false
      - run: go build -o keel ./cmd/keel
      - name: Verify ${{ matrix.framework }} (DDEV)
        if: ${{ github.event.inputs.framework == '' || github.event.inputs.framework == matrix.framework }}
        run: ./keel recipes verify ${{ matrix.framework }} --env ${{ matrix.env }}

  # Container tier: brings the DDEV/Sail/compose stacks up through `keel new`
  # and tears them down, volumes included. This is the tier the Makefile always
  # advertised and that never actually ran, and the only coverage Magento and
  # WooCommerce have.
  #
  # Sharded, one leg per framework. As a single job it could not finish: sixteen
  # rows that install whole platforms do not fit in one runner's budget, so the
  # job was cancelled part way through every time and the tier stayed unproven.
  # KEEL_E2E_ONLY selects a slice by matching the framework and env, which is
  # also how a single row is run locally.
  full:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.tier == '' || github.event.inputs.tier == 'all' || github.event.inputs.tier == 'full' }}
    timeout-minutes: 90
    strategy:
      # One framework failing must not hide the state of the others: that is the
      # whole point of running them separately.
      fail-fast: false
      matrix:
        # Mage-OS rather than Adobe's Magento: Adobe's needs Marketplace keys,
        # which are per-account and cannot live in a public repository. Same
        # recipes either way - see the note on the table in scaffold.feature.
        framework: [magento-mageos, woocommerce, laravel, django, symfony, fastapi, nextjs, express]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false
      - name: e2e (full - container stacks boot and tear down)
        # The dispatch box narrows the matrix further: leave it blank for all of
        # them, or name one to run only that leg.
        if: ${{ github.event.inputs.framework == '' || github.event.inputs.framework == matrix.framework }}
        run: make e2e-full
        env:
          KEEL_E2E_ONLY: ${{ matrix.framework }}
      - name: Sweep anything a failed run left behind
        if: always()
        run: |
          docker ps -aq --filter name=keel-e2e- | xargs -r docker rm -f
          docker volume ls -q --filter name=keel-e2e- | xargs -r docker volume rm -f
