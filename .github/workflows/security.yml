name: security

# CVE scanning for the Go module. govulncheck is the Go team's scanner: it checks
# the dependency graph and the Go toolchain against the Go vulnerability database
# and, unlike a plain manifest scan, reports only vulnerabilities whose affected
# code is actually reachable from this binary. Complements Dependabot (which scans
# the manifest against the GitHub Advisory database).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly anti-rot: a new advisory can land against a pinned dependency with no
    # commit of ours, so a scheduled scan is information even on a quiet week.
    - cron: "0 7 * * 1"

# Least privilege: govulncheck only reads the checkout.
permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Go CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # stable, not the module's 1.24: govulncheck itself now requires Go >= 1.25.
      # A newer toolchain analysing a `go 1.24` module is fine.
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan
        run: govulncheck ./...
